    // ============ MODAL DE SINCRONIZACIÓN MULTI-DISPOSITIVO (NUBE SUPABASE) ============
    function CloudSyncModal({ syncStatus, isSyncing, counts, onPushAll, onPullAll, onClose, notify }) {
      const [showSql, setShowSql] = useState(syncStatus.state === "error");

      const sqlScript = `-- Ejecuta este script en el SQL Editor de tu proyecto Supabase para asegurar todas las tablas y columnas:
CREATE TABLE IF NOT EXISTS usuarios (
  id text PRIMARY KEY, name text, email text, pass text, role text
);
CREATE TABLE IF NOT EXISTS productos (
  id text PRIMARY KEY, name text, category text, sku text, barcode text,
  "costPrice" numeric DEFAULT 0, "salePrice" numeric DEFAULT 0, "minStock" integer DEFAULT 0,
  "stockByLocation" jsonb DEFAULT '{}'::jsonb
);
CREATE TABLE IF NOT EXISTS ventas (
  id text PRIMARY KEY, date text, "customerName" text, "paymentMethod" text, total numeric DEFAULT 0, details text
);
CREATE TABLE IF NOT EXISTS gastos (
  id text PRIMARY KEY, date text, category text, description text, amount numeric DEFAULT 0
);
CREATE TABLE IF NOT EXISTS clientes (
  id text PRIMARY KEY, name text, phone text
);
CREATE TABLE IF NOT EXISTS finanzas_personales (
  id text PRIMARY KEY, date text, type text, wallet text DEFAULT 'Tarjeta', category text, description text, amount numeric DEFAULT 0
);

ALTER TABLE productos ADD COLUMN IF NOT EXISTS barcode text;
ALTER TABLE productos ADD COLUMN IF NOT EXISTS "costPrice" numeric DEFAULT 0;
ALTER TABLE productos ADD COLUMN IF NOT EXISTS "salePrice" numeric DEFAULT 0;
ALTER TABLE productos ADD COLUMN IF NOT EXISTS "minStock" integer DEFAULT 0;
ALTER TABLE productos ADD COLUMN IF NOT EXISTS "stockByLocation" jsonb DEFAULT '{}'::jsonb;
ALTER TABLE ventas ADD COLUMN IF NOT EXISTS "customerName" text;
ALTER TABLE ventas ADD COLUMN IF NOT EXISTS "paymentMethod" text;
ALTER TABLE finanzas_personales ADD COLUMN IF NOT EXISTS wallet text DEFAULT 'Tarjeta';

ALTER TABLE usuarios DISABLE ROW LEVEL SECURITY;
ALTER TABLE productos DISABLE ROW LEVEL SECURITY;
ALTER TABLE ventas DISABLE ROW LEVEL SECURITY;
ALTER TABLE gastos DISABLE ROW LEVEL SECURITY;
ALTER TABLE clientes DISABLE ROW LEVEL SECURITY;
ALTER TABLE finanzas_personales DISABLE ROW LEVEL SECURITY;`;

      const copySql = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(sqlScript);
          notify("Script SQL copiado al portapapeles 📋");
        }
      };

      const tables = [
        { key: "productos", label: "Productos & Stock", count: counts.productos },
        { key: "ventas", label: "Ventas", count: counts.ventas },
        { key: "gastos", label: "Gastos Negocio", count: counts.gastos },
        { key: "finanzas_personales", label: "Espacio Personal", count: counts.finanzas_personales },
        { key: "clientes", label: "Clientes", count: counts.clientes },
        { key: "usuarios", label: "Usuarios", count: counts.usuarios }
      ];

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div className="responsive-modal" style={{ ...styles.glassModal, maxWidth: 580 }} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <h3 style={{ ...styles.modalTitle, margin: 0 }}>☁️ Sincronización Multi-Dispositivo</h3>
              <span style={syncStatus.state === "error" ? styles.badgeRed : styles.badgeGreen}>
                {isSyncing ? "Sincronizando..." : syncStatus.state === "error" ? "Revisar Tablas" : "Conectado a Supabase"}
              </span>
            </div>

            <p style={{ fontSize: 12.5, color: "#94A3B8", marginBottom: 14, lineHeight: 1.45 }}>
              Si actualizaste datos en este PC y quieres asegurarte de que aparezcan de inmediato en tu celular u otro computador, presiona <strong>"Subir datos de este PC a la Nube"</strong>. En el otro dispositivo, presiona <strong>"Descargar de la Nube"</strong> (o simplemente recarga la página).
            </p>

            <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
              <button
                type="button"
                disabled={isSyncing}
                style={{ ...styles.primaryBtn, justifyContent: "center", padding: "11px 12px" }}
                onClick={onPushAll}
              >
                <Icon name="upload-cloud" size={16} />
                <span>⬆️ Subir datos de este PC a la Nube</span>
              </button>
              <button
                type="button"
                disabled={isSyncing}
                style={{ ...styles.sheetsExportBtn, justifyContent: "center", padding: "11px 12px" }}
                onClick={onPullAll}
              >
                <Icon name="download-cloud" size={16} />
                <span>⬇️ Descargar datos de la Nube</span>
              </button>
            </div>

            <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 10, padding: 12, marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: "#94A3B8", marginBottom: 8 }}>
                <span>Estado de tablas en la nube:</span>
                <span>Última sinc.: <strong style={{ color: "#F8FAFC" }}>{syncStatus.lastSync || "Ahora"}</strong></span>
              </div>
              <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {tables.map(t => {
                  const st = syncStatus.tableStatus?.[t.key] || "OK";
                  const isOk = st.startsWith("OK");
                  return (
                    <div key={t.key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 11.5, padding: "5px 8px", background: "rgba(0,0,0,0.2)", borderRadius: 6 }}>
                      <span style={{ color: "#CBD5E1" }}>{t.label} ({t.count})</span>
                      <span style={{ color: isOk ? "#34D399" : "#FBBF24", fontWeight: 600, fontSize: 10.5 }}>
                        {isOk ? "✓ Sincronizado" : "⚡ Vía Espejo"}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{ marginBottom: 12 }}>
              <button
                type="button"
                style={{ background: "none", border: "none", color: "#38BDF8", fontSize: 12, cursor: "pointer", textDecoration: "underline", padding: 0 }}
                onClick={() => setShowSql(prev => !prev)}
              >
                {showSql ? "Ocultar Script SQL de Supabase" : "🛠️ ¿Problemas de permisos (RLS) o columnas en Supabase? Ver Script SQL reparador"}
              </button>

              {showSql && (
                <div style={{ marginTop: 8, background: "rgba(0,0,0,0.35)", border: "1px solid rgba(56,189,248,0.25)", borderRadius: 8, padding: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                    <span style={{ fontSize: 11, color: "#BAE6FD" }}>Pega esto en Supabase &rarr; SQL Editor &rarr; Run:</span>
                    <button type="button" style={styles.smallGlassBtn} onClick={copySql}>📋 Copiar SQL</button>
                  </div>
                  <pre style={{ fontSize: 10.5, color: "#E2E8F0", maxHeight: 130, overflowY: "auto", whiteSpace: "pre-wrap", margin: 0 }}>
                    {sqlScript}
                  </pre>
                </div>
              )}
            </div>

            <div style={{ display: "flex", justifyContent: "flex-end" }}>
              <button type="button" style={styles.secondaryBtn} onClick={onClose}>Cerrar</button>
            </div>
          </div>
        </div>
      );
    }

    // ============ MODAL DE TRASPASO ENTRE BODEGAS ============
    function TransferModal({ products, locations, onClose, onTransfer }) {
      const [productId, setProductId] = useState(products[0]?.id || "");
      const [fromLocId, setFromLocId] = useState(locations[0]?.id || "loc-central");
      const [toLocId, setToLocId] = useState(locations[1]?.id || "loc-tienda");
      const [qty, setQty] = useState(1);

      const selectedProd = products.find(p => p.id === productId);
      const availableInOrigin = Number(selectedProd?.stockByLocation?.[fromLocId] || 0);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (fromLocId === toLocId) {
          alert("Selecciona una bodega de destino distinta a la de origen.");
          return;
        }
        onTransfer({ productId, fromLocId, toLocId, qty: Number(qty) });
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div className="responsive-modal" style={styles.glassModal} onClick={e => e.stopPropagation()}>
            <h3 style={styles.modalTitle}>Traspasar Mercadería entre Bodegas 🚚</h3>
            <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <label style={styles.inputLabel}>Producto</label>
                <select style={styles.glassInput} value={productId} onChange={e => setProductId(e.target.value)}>
                  {products.map(p => <option key={p.id} value={p.id}>{p.name} ({p.sku})</option>)}
                </select>
              </div>
              <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>Desde Origen</label>
                  <select style={styles.glassInput} value={fromLocId} onChange={e => setFromLocId(e.target.value)}>
                    {locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                  </select>
                </div>
                <div>
                  <label style={styles.inputLabel}>Hacia Destino</label>
                  <select style={styles.glassInput} value={toLocId} onChange={e => setToLocId(e.target.value)}>
                    {locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label style={styles.inputLabel}>Cantidad (Disponible en origen: {availableInOrigin} un.)</label>
                <input style={styles.glassInput} type="number" min="1" max={Math.max(1, availableInOrigin)} value={qty} onChange={e => setQty(e.target.value)} required />
              </div>
              <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 }}>
                <button type="button" style={styles.secondaryBtn} onClick={onClose}>Cancelar</button>
                <button type="submit" style={styles.amberBtn} disabled={availableInOrigin <= 0}>Traspasar</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============ MODAL DE PRODUCTO / INVENTARIO ============
    function ProductModal({ product, locations, onClose, onSave }) {
      const [name, setName] = useState(product?.name || "");
      const [category, setCategory] = useState(product?.category || PRODUCT_CATEGORIES[0]);
      const [sku, setSku] = useState(product?.sku || "");
      const [barcode, setBarcode] = useState(product?.barcode || "");
      const [costPrice, setCostPrice] = useState(product?.costPrice || 0);
      const [salePrice, setSalePrice] = useState(product?.salePrice || 0);
      const [minStock, setMinStock] = useState(product?.minStock || 3);

      const [stockByLocation, setStockByLocation] = useState(() => {
        const map = {};
        locations.forEach(loc => {
          map[loc.id] = product?.stockByLocation?.[loc.id] !== undefined ? product.stockByLocation[loc.id] : 0;
        });
        return map;
      });

      const handleStockChange = (locId, value) => {
        setStockByLocation(prev => ({
          ...prev,
          [locId]: Number(value) >= 0 ? Number(value) : 0
        }));
      };

      const generateAutoSKU = () => {
        const catPart = (category || "ALM").slice(0, 3).toUpperCase();
        const namePart = (name || "PRD").replace(/[^a-zA-Z0-9]/g, "").slice(0, 3).toUpperCase() || "PRD";
        setSku(`${catPart}-${namePart}-${String(Date.now()).slice(-3)}`);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          name: sanitizeText(name),
          category,
          sku: sanitizeText(sku) || `SKU-${Date.now().toString().slice(-4)}`,
          barcode: sanitizeText(barcode),
          costPrice: Number(costPrice) || 0,
          salePrice: Number(salePrice) || 0,
          minStock: Number(minStock) || 0,
          stockByLocation
        });
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div className="responsive-modal" style={styles.glassModal} onClick={e => e.stopPropagation()}>
            <h3 style={styles.modalTitle}>
              {product ? "Modificar Ficha de Producto" : "Nuevo Producto en Inventario 📦"}
            </h3>
            <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 11 }}>
              <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>Nombre del Producto</label>
                  <input style={styles.glassInput} value={name} onChange={e => setName(e.target.value)} placeholder="Ej: Polera Oversize" required />
                </div>
                <div>
                  <label style={styles.inputLabel}>Categoría</label>
                  <select style={styles.glassInput} value={category} onChange={e => setCategory(e.target.value)}>
                    {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>

              <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>SKU / Código Referencia</label>
                  <div style={{ display: "flex", gap: 6 }}>
                    <input style={styles.glassInput} value={sku} onChange={e => setSku(e.target.value)} placeholder="Ej: ROP-POL-101" />
                    <button type="button" style={styles.smallGlassBtn} onClick={generateAutoSKU}>Auto</button>
                  </div>
                </div>
                <div>
                  <label style={styles.inputLabel}>Código de Barras (Opcional)</label>
                  <input style={styles.glassInput} value={barcode} onChange={e => setBarcode(e.target.value)} placeholder="Ej: 7801001" />
                </div>
              </div>

              <div className="responsive-3col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>Costo Unitario ($)</label>
                  <input style={styles.glassInput} type="number" min="0" value={costPrice} onChange={e => setCostPrice(e.target.value)} required />
                </div>
                <div>
                  <label style={styles.inputLabel}>Precio Venta ($)</label>
                  <input style={styles.glassInput} type="number" min="0" value={salePrice} onChange={e => setSalePrice(e.target.value)} required />
                </div>
                <div>
                  <label style={styles.inputLabel}>Stock Mínimo</label>
                  <input style={styles.glassInput} type="number" min="0" value={minStock} onChange={e => setMinStock(e.target.value)} required />
                </div>
              </div>

              <div style={{ background: "rgba(255, 255, 255, 0.02)", padding: "10px 12px", borderRadius: 10, border: "1px solid rgba(255, 255, 255, 0.08)", marginTop: 4 }}>
                <span style={{ fontSize: 11.5, color: "#38BDF8", fontWeight: 600, display: "block", marginBottom: 8 }}>
                  Distribución de Existencias por Bodega:
                </span>
                <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {locations.map(loc => (
                    <div key={loc.id}>
                      <label style={{ ...styles.inputLabel, fontSize: 11, color: "#CBD5E1" }}>{loc.name}</label>
                      <input
                        style={styles.glassInput}
                        type="number"
                        min="0"
                        value={stockByLocation[loc.id] || 0}
                        onChange={e => handleStockChange(loc.id, e.target.value)}
                      />
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 }}>
                <button type="button" style={styles.secondaryBtn} onClick={onClose}>Cancelar</button>
                <button type="submit" style={styles.primaryBtn}>{product ? "Guardar Cambios" : "Guardar Producto"}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============ DASHBOARD CON PROYECCIÓN DE GANANCIAS ============
    function Dashboard({
      currentUser, canAccessSales, canAccessPersonal, canViewCosts, sales, expenses, products, lowStock, locations, customers,
      totalSales, totalExpenses, profit, personalFinances, personalIncome, personalExpense, personalBalance,
      personalCashBalance, personalCardBalance, creditCardSummary, onOpenCreditCardConfig,
      onNewSale, onNewPersonal, onGoToPersonal, onGoToInventory, onExportBusiness, onExportPersonal
    }) {
      const [selectedProdFilter, setSelectedProdFilter] = useState("all");

      const trendCanvasRef = useRef(null);
      const expenseCanvasRef = useRef(null);
      const projectionCanvasRef = useRef(null);
      const chartRefs = useRef({ trend: null, expense: null, projection: null });

      const last7Days = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          days.push(d.toISOString().slice(0, 10));
        }
        return days;
      }, []);

      const salesByDay = useMemo(() => {
        return last7Days.map(day => sales.filter(s => s.date === day).reduce((a, s) => a + Number(s.total || 0), 0));
      }, [sales, last7Days]);

      const expensesByDay = useMemo(() => {
        return last7Days.map(day => expenses.filter(e => e.date === day).reduce((a, e) => a + Number(e.amount || 0), 0));
      }, [expenses, last7Days]);

      const expensesByCategory = useMemo(() => {
        const map = {};
        expenses.forEach(e => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
        return map;
      }, [expenses]);

      const inventoryProjection = useMemo(() => {
        if (selectedProdFilter === "all") {
          let totalCost = 0;
          let totalRevenue = 0;
          let totalUnits = 0;

          const itemBreakdown = products.map(p => {
            const stock = getProductTotalStock(p);
            const cost = (Number(p.costPrice) || 0) * stock;
            const revenue = (Number(p.salePrice) || 0) * stock;
            const profitVal = revenue - cost;
            totalCost += cost;
            totalRevenue += revenue;
            totalUnits += stock;
            return {
              id: p.id,
              name: p.name,
              sku: p.sku,
              stock,
              cost,
              revenue,
              profit: profitVal,
              unitCost: Number(p.costPrice) || 0,
              unitSale: Number(p.salePrice) || 0,
              unitProfit: (Number(p.salePrice) || 0) - (Number(p.costPrice) || 0)
            };
          });

          const totalProfit = totalRevenue - totalCost;
          const margin = totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0;
          return { isAll: true, totalCost, totalRevenue, totalProfit, totalUnits, margin, itemBreakdown };
        } else {
          const p = products.find(x => x.id === selectedProdFilter);
          if (!p) return null;
          const stock = getProductTotalStock(p);
          const cost = (Number(p.costPrice) || 0) * stock;
          const revenue = (Number(p.salePrice) || 0) * stock;
          const profitVal = revenue - cost;
          const unitCost = Number(p.costPrice) || 0;
          const unitSale = Number(p.salePrice) || 0;
          const unitProfit = unitSale - unitCost;
          const margin = revenue > 0 ? (profitVal / revenue) * 100 : 0;
          return { isAll: false, product: p, stock, cost, revenue, profit: profitVal, unitCost, unitSale, unitProfit, margin };
        }
      }, [products, selectedProdFilter]);

      useEffect(() => {
        if (!window.Chart) return;

        if (chartRefs.current.trend) chartRefs.current.trend.destroy();
        if (trendCanvasRef.current) {
          chartRefs.current.trend = new window.Chart(trendCanvasRef.current, {
            type: "line",
            data: {
              labels: last7Days.map(d => d.slice(5)),
              datasets: [
                {
                  label: "Ventas Negocio",
                  data: salesByDay,
                  borderColor: "#34D399",
                  backgroundColor: "rgba(52, 211, 153, 0.15)",
                  borderWidth: 2.5,
                  tension: 0.35,
                  fill: true
                },
                {
                  label: "Gastos Negocio",
                  data: expensesByDay,
                  borderColor: "#F87171",
                  backgroundColor: "rgba(248, 113, 113, 0.1)",
                  borderWidth: 2,
                  tension: 0.35,
                  fill: true
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: "#CBD5E1", font: { size: 11 } } } },
              scales: {
                x: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } },
                y: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } }
              }
            }
          });
        }

        if (chartRefs.current.expense) chartRefs.current.expense.destroy();
        if (expenseCanvasRef.current) {
          const labels = Object.keys(expensesByCategory);
          const data = Object.values(expensesByCategory);
          chartRefs.current.expense = new window.Chart(expenseCanvasRef.current, {
            type: "doughnut",
            data: {
              labels: labels.length ? labels : ["Sin gastos"],
              datasets: [{
                data: data.length ? data : [1],
                backgroundColor: ["#10B981", "#38BDF8", "#F87171", "#FBBF24", "#A78BFA", "#EC4899", "#64748B"],
                borderWidth: 1,
                borderColor: "rgba(255,255,255,0.1)"
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: "bottom", labels: { color: "#CBD5E1", font: { size: 10 }, boxWidth: 10 } } }
            }
          });
        }

        if (chartRefs.current.projection) chartRefs.current.projection.destroy();
        if (projectionCanvasRef.current && inventoryProjection && canViewCosts) {
          if (inventoryProjection.isAll) {
            const topItems = inventoryProjection.itemBreakdown.slice(0, 8);
            chartRefs.current.projection = new window.Chart(projectionCanvasRef.current, {
              type: "bar",
              data: {
                labels: topItems.map(i => i.name.length > 14 ? i.name.slice(0, 14) + "…" : i.name),
                datasets: [
                  {
                    label: "Costo Invertido ($)",
                    data: topItems.map(i => i.cost),
                    backgroundColor: "rgba(248, 113, 113, 0.75)",
                    borderRadius: 5
                  },
                  {
                    label: "Ganancia Neta Posible ($)",
                    data: topItems.map(i => i.profit),
                    backgroundColor: "rgba(52, 211, 153, 0.85)",
                    borderRadius: 5
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { labels: { color: "#CBD5E1", font: { size: 11 } } },
                  tooltip: {
                    callbacks: {
                      label: function(context) {
                        return `${context.dataset.label}: ${money(context.raw)}`;
                      }
                    }
                  }
                },
                scales: {
                  x: { ticks: { color: "#94A3B8", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } },
                  y: { ticks: { color: "#94A3B8", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } }
                }
              }
            });
          } else {
            chartRefs.current.projection = new window.Chart(projectionCanvasRef.current, {
              type: "bar",
              data: {
                labels: ["Por Unidad", `Total (${inventoryProjection.stock} un.)`],
                datasets: [
                  {
                    label: "Costo ($)",
                    data: [inventoryProjection.unitCost, inventoryProjection.cost],
                    backgroundColor: "rgba(248, 113, 113, 0.75)",
                    borderRadius: 6
                  },
                  {
                    label: "Ganancia Neta ($)",
                    data: [inventoryProjection.unitProfit, inventoryProjection.profit],
                    backgroundColor: "rgba(52, 211, 153, 0.85)",
                    borderRadius: 6
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { labels: { color: "#CBD5E1", font: { size: 11 } } },
                  tooltip: {
                    callbacks: {
                      label: function(context) {
                        return `${context.dataset.label}: ${money(context.raw)}`;
                      }
                    }
                  }
                },
                scales: {
                  x: { ticks: { color: "#F8FAFC", font: { size: 11 } }, grid: { display: false } },
                  y: { ticks: { color: "#94A3B8", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } }
                }
              }
            });
          }
        }

        return () => {
          if (chartRefs.current.trend) chartRefs.current.trend.destroy();
          if (chartRefs.current.expense) chartRefs.current.expense.destroy();
          if (chartRefs.current.projection) chartRefs.current.projection.destroy();
        };
      }, [salesByDay, expensesByDay, expensesByCategory, last7Days, inventoryProjection, canViewCosts]);

      return (
        <div>
          <div style={styles.pageHeader}>
            <div>
              <div style={styles.eyebrow}>RESUMEN INTEGRAL & CONTROL</div>
              <h2 style={styles.pageTitle}>Bienvenido, {currentUser.name} ✨</h2>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              {canAccessPersonal && (
                <button style={styles.purpleBtn} onClick={onNewPersonal}>
                  <Icon name="plus" size={14} /> Movimiento Personal
                </button>
              )}
              {canAccessSales && (
                <button style={styles.primaryBtn} onClick={onNewSale}>
                  <Icon name="shopping-bag" size={14} /> Registrar Venta
                </button>
              )}
            </div>
          </div>

          {lowStock.length > 0 && (
            <div style={styles.warehouseAlertBanner}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Icon name="alert-triangle" size={18} color="#FBBF24" />
                <div>
                  <strong style={{ color: "#FEF3C7", fontSize: 13 }}>
                    Alerta de Estantería: {lowStock.length} {lowStock.length === 1 ? "producto requiere" : "productos requieren"} reposición
                  </strong>
                  <div style={{ fontSize: 11.5, color: "#FDE68A" }}>
                    {lowStock.map(p => `${p.name} (${getProductTotalStock(p)} un.)`).join(" • ")}
                  </div>
                </div>
              </div>
              <button style={styles.amberBtn} onClick={onGoToInventory}>Revisar Inventario</button>
            </div>
          )}

          {/* SECCIÓN 1: FINANZAS DEL NEGOCIO */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <div style={styles.sectionHeader}>
              <Icon name="briefcase" size={17} color="#34D399" />
              <span style={styles.sectionTitle}>Finanzas & Operación del Negocio</span>
            </div>
            <button style={styles.sheetsExportBtn} onClick={onExportBusiness}>
              <Icon name="file-spreadsheet" size={14} color="#34D399" /> Exportar a Sheets
            </button>
          </div>

          <div className="responsive-kpi-grid" style={styles.kpiGrid}>
            <div style={styles.kpiCard}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Ventas del Negocio</span>
                <Icon name="trending-up" size={15} color="#34D399" />
              </div>
              <div style={{ ...styles.kpiValue, color: "#34D399" }}>{money(totalSales)}</div>
              <span style={styles.kpiSub}>Ingresos totales en ventas</span>
            </div>

            <div style={styles.kpiCard}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Gastos Operativos</span>
                <Icon name="trending-down" size={15} color="#F87171" />
              </div>
              <div style={{ ...styles.kpiValue, color: "#F87171" }}>{money(totalExpenses)}</div>
              <span style={styles.kpiSub}>Arriendo, insumos y compras</span>
            </div>

            <div style={styles.kpiCard}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Utilidad Neta (Negocio)</span>
                <Icon name="dollar-sign" size={15} color={profit >= 0 ? "#38BDF8" : "#F87171"} />
              </div>
              <div style={{ ...styles.kpiValue, color: profit >= 0 ? "#38BDF8" : "#F87171" }}>{money(profit)}</div>
              <span style={styles.kpiSub}>Margen bruto - costos</span>
            </div>

            <div style={styles.kpiCard}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Catálogo & Alertas</span>
                <Icon name="package-check" size={15} color="#FBBF24" />
              </div>
              <div style={{ ...styles.kpiValue, color: "#F1F5F9" }}>{products.length} <span style={{ fontSize: 13, color: "#94A3B8" }}>prods.</span></div>
              <span style={{ ...styles.kpiSub, color: lowStock.length > 0 ? "#F87171" : "#34D399" }}>
                {lowStock.length > 0 ? `⚠️ ${lowStock.length} con stock bajo` : "✓ Stock en óptimo estado"}
              </span>
            </div>
          </div>

          {/* PANEL: PROYECCIÓN DE GANANCIAS EN INVENTARIO */}
          {canViewCosts && (
            <div style={{ ...styles.panel, marginBottom: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <Icon name="calculator" size={18} color="#34D399" />
                    <h3 style={{ margin: 0, fontSize: 15, color: "#F1F5F9", fontWeight: 700 }}>
                      Proyección de Ganancias si se vende todo el Inventario
                    </h3>
                  </div>
                  <p style={{ margin: "2px 0 0", fontSize: 11.5, color: "#94A3B8" }}>
                    Cálculo de retorno estimado en base al costo unitario, precio de venta y stock total.
                  </p>
                </div>

                <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                  <span style={{ fontSize: 12, color: "#94A3B8" }}>Ver producto:</span>
                  <select
                    style={styles.filterSelect}
                    value={selectedProdFilter}
                    onChange={e => setSelectedProdFilter(e.target.value)}
                  >
                    <option value="all">📦 Todo el Inventario Global</option>
                    {products.map(p => (
                      <option key={p.id} value={p.id}>{p.name} ({getProductTotalStock(p)} un.)</option>
                    ))}
                  </select>
                </div>
              </div>

              {inventoryProjection && (
                <div className="responsive-kpi-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(175px, 1fr))", gap: 10, marginBottom: 14 }}>
                  <div style={styles.miniProjectionCard}>
                    <span style={styles.miniLabel}>Costo Invertido (Stock)</span>
                    <strong style={{ color: "#F87171", fontSize: 15 }}>
                      {money(inventoryProjection.cost || inventoryProjection.totalCost)}
                    </strong>
                    <span style={{ fontSize: 10, color: "#64748B" }}>Dinero retenido en costo</span>
                  </div>

                  <div style={styles.miniProjectionCard}>
                    <span style={styles.miniLabel}>Venta Bruta Estimada</span>
                    <strong style={{ color: "#38BDF8", fontSize: 15 }}>
                      {money(inventoryProjection.revenue || inventoryProjection.totalRevenue)}
                    </strong>
                    <span style={{ fontSize: 10, color: "#64748B" }}>Ingreso total al liquidar</span>
                  </div>

                  <div style={{ ...styles.miniProjectionCard, background: "rgba(52, 211, 153, 0.08)", borderColor: "rgba(52, 211, 153, 0.3)" }}>
                    <span style={{ ...styles.miniLabel, color: "#34D399" }}>Ganancia Neta Posible</span>
                    <strong style={{ color: "#34D399", fontSize: 17 }}>
                      +{money(inventoryProjection.profit || inventoryProjection.totalProfit)}
                    </strong>
                    <span style={{ fontSize: 10, color: "#34D399" }}>Utilidad líquida a cobrar</span>
                  </div>

                  <div style={styles.miniProjectionCard}>
                    <span style={styles.miniLabel}>Margen de Ganancia</span>
                    <strong style={{ color: "#FBBF24", fontSize: 15 }}>
                      {inventoryProjection.margin.toFixed(1)}%
                    </strong>
                    <span style={{ fontSize: 10, color: "#64748B" }}>
                      {!inventoryProjection.isAll ? `+${money(inventoryProjection.unitProfit)} /un.` : `${inventoryProjection.totalUnits} un. totales`}
                    </span>
                  </div>
                </div>
              )}

              <div style={{ height: 210 }}>
                <canvas ref={projectionCanvasRef}></canvas>
              </div>
            </div>
          )}

          <div className="responsive-2col" style={styles.dashGrid}>
            <div style={styles.panel}>
              <div style={styles.panelTitleRow}>
                <h3 style={styles.panelTitle}>Rendimiento Comercial (Últimos 7 días)</h3>
                <span style={styles.badgeGlass}>Flujo Negocio</span>
              </div>
              <div style={{ height: 210 }}>
                <canvas ref={trendCanvasRef}></canvas>
              </div>
            </div>

            <div style={styles.panel}>
              <div style={styles.panelTitleRow}>
                <h3 style={styles.panelTitle}>Distribución de Costos del Negocio</h3>
                <span style={styles.badgeGlass}>Por Categoría</span>
              </div>
              <div style={{ height: 210 }}>
                <canvas ref={expenseCanvasRef}></canvas>
              </div>
            </div>
          </div>

          {/* SECCIÓN 2: ESPACIO & FINANZAS PERSONALES */}
          {canAccessPersonal && (
            <div style={{ marginTop: 28 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
                <div style={{ ...styles.sectionHeader, borderLeftColor: "#A855F7" }}>
                  <Icon name="wallet" size={17} color="#C084FC" />
                  <span style={{ ...styles.sectionTitle, color: "#E9D5FF" }}>Espacio de Cosas Personales & Finanzas</span>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button style={styles.purpleExportBtn} onClick={onExportPersonal}>
                    <Icon name="file-spreadsheet" size={14} color="#C084FC" /> Exportar Personal
                  </button>
                  <button onClick={onGoToPersonal} style={styles.linkGlassBtn}>
                    Ver historial completo &rarr;
                  </button>
                </div>
              </div>

              <div className="responsive-kpi-grid" style={styles.kpiGrid}>
                <div style={{ ...styles.kpiCard, borderColor: "rgba(52, 211, 153, 0.35)", background: "rgba(16, 185, 129, 0.06)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ ...styles.kpiLabel, color: "#A7F3D0" }}>💵 Efectivo en Bolsillo</span>
                    <Icon name="banknote" size={16} color="#34D399" />
                  </div>
                  <div style={{ ...styles.kpiValue, color: personalCashBalance >= 0 ? "#34D399" : "#F87171" }}>
                    {money(personalCashBalance)}
                  </div>
                  <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                    <button
                      type="button"
                      style={styles.quickActionPlusBtn}
                      onClick={() => onNewPersonal({ type: "ingreso", wallet: "Efectivo" })}
                    >
                      + Agregar
                    </button>
                    <button
                      type="button"
                      style={styles.quickActionMinusBtn}
                      onClick={() => onNewPersonal({ type: "gasto", wallet: "Efectivo" })}
                    >
                      - Restar
                    </button>
                  </div>
                </div>

                <div style={{ ...styles.kpiCard, borderColor: "rgba(56, 189, 248, 0.35)", background: "rgba(56, 189, 248, 0.06)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ ...styles.kpiLabel, color: "#BAE6FD" }}>💳 Dinero en Tarjeta</span>
                    <Icon name="credit-card" size={16} color="#38BDF8" />
                  </div>
                  <div style={{ ...styles.kpiValue, color: personalCardBalance >= 0 ? "#38BDF8" : "#F87171" }}>
                    {money(personalCardBalance)}
                  </div>
                  <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                    <button
                      type="button"
                      style={styles.quickActionPlusBtn}
                      onClick={() => onNewPersonal({ type: "ingreso", wallet: "Tarjeta" })}
                    >
                      + Agregar
                    </button>
                    <button
                      type="button"
                      style={styles.quickActionMinusBtn}
                      onClick={() => onNewPersonal({ type: "gasto", wallet: "Tarjeta" })}
                    >
                      - Restar
                    </button>
                  </div>
                </div>

                {creditCardSummary && (
                  <div style={{ ...styles.kpiCard, borderColor: "rgba(251, 191, 36, 0.4)", background: "rgba(245, 158, 11, 0.07)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ ...styles.kpiLabel, color: "#FDE68A" }}>💎 Cupo Tarjeta Crédito</span>
                      <button
                        type="button"
                        onClick={onOpenCreditCardConfig}

                        title="Configurar Cupo y Día de Pago"

                    <div style={{ ...styles.kpiValue, color: "#FBBF24" }}>

                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, color: "#CBD5E1", marginTop: 3 }}>

                      <span style={{ color: creditCardSummary.daysUntilPayment <= 5 ? "#FCA5A5" : "#A7F3D0", fontWeight: 600 }}>
                        📅 Pago día {creditCardSummary.paymentDay} ({creditCardSummary.daysUntilPayment === 0 ? "Hoy" : `${creditCardSummary.daysUntilPayment}d`})

                      <button

                        style={styles.quickActionPlusBtn}
                        onClick={() => onNewPersonal({ type: "ingreso", wallet: "Crédito", category: "Pago / Abono Tarjeta de Crédito" })}
                      >
                        + Pagar Cupo
                      </button>
                    </div>
                  </div>
                )}

                <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.35)", background: "rgba(168, 85, 247, 0.08)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <span style={styles.kpiLabel}>Saldo Personal Total</span>
                    <Icon name="piggy-bank" size={16} color="#C084FC" />
                  </div>
                  <div style={{ ...styles.kpiValue, color: personalBalance >= 0 ? "#C084FC" : "#F87171" }}>
                    {money(personalBalance)}
                  </div>
                  <span style={styles.kpiSub}>Suma Efectivo + Tarjeta Débito</span>
                </div>
              </div>

              <div className="responsive-2col" style={styles.dashGrid}>
                <div style={styles.panel}>
                  <div style={styles.panelTitleRow}>
                    <h3 style={styles.panelTitle}>Últimos Movimientos Personales</h3>
                    <button style={styles.smallGlassBtn} onClick={() => onNewPersonal()}>+ Agregar</button>

                  {personalFinances.length === 0 ? (
                    <p style={{ color: "#64748B", fontSize: 13 }}>No has registrado movimientos personales aún.</p>

                      const w = getPersonalWallet(item);
                      const badgeStyle = w === "Efectivo"

                        : w === "Crédito"
                        ? styles.walletBadgeCredit

                        ? "💵 Efectivo"
                        : w === "Crédito"
                        ? "💎 T. Crédito"

                        <div key={item.id} style={styles.listRow}>

                              <span style={badgeStyle}>{badgeLabel}</span>

                            <span style={{ fontSize: 11, color: "#94A3B8" }}>{item.date} • {item.category}</span>

                <div style={styles.panel}>
                  <div style={styles.panelTitleRow}>
                    <h3 style={styles.panelTitle}>Recordatorios & Cosas Personales</h3>
                    <span style={styles.badgeGlass}>Notas Rápidas</span>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    <div style={styles.glassNote}>
                      <Icon name="check-circle-2" size={15} color="#34D399" />

                      <Icon name="clock" size={15} color="#FBBF24" />
                      <span style={{ fontSize: 12.5, color: "#CBD5E1" }}>
                        {creditCardSummary
                          ? `Próximo pago de ${creditCardSummary.cardName}: ${creditCardSummary.nextPaymentFormatted} (faltan ${creditCardSummary.daysUntilPayment} días).`

                      <Icon name="sparkles" size={15} color="#38BDF8" />

                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============ MÓDULO PERSONAL CON SEPARACIÓN EFECTIVO, TARJETA Y CUPO DE CRÉDITO ============
    function PersonalFinancesManager({ personalFinances, creditCardSummary, onOpenCreditCardConfig, onNew, onEdit, onDelete, onExport }) {
      const [selectedMonth, setSelectedMonth] = useState("");
      const [selectedWalletFilter, setSelectedWalletFilter] = useState("Todos");

      const availableMonths = useMemo(() => {
        const currentYM = new Date().toISOString().slice(0, 7);
        const monthsSet = new Set(personalFinances.map(p => (p.date || "").slice(0, 7)).filter(Boolean));
        monthsSet.add(currentYM);
        return Array.from(monthsSet).sort().reverse();
      }, [personalFinances]);

      const monthFilteredFinances = useMemo(() => {
        if (!selectedMonth) return personalFinances;
        return personalFinances.filter(p => (p.date || "").startsWith(selectedMonth));
      }, [personalFinances, selectedMonth]);

      const filteredFinances = useMemo(() => {
        if (selectedWalletFilter === "Todos") return monthFilteredFinances;
        return monthFilteredFinances.filter(p => getPersonalWallet(p) === selectedWalletFilter);
      }, [monthFilteredFinances, selectedWalletFilter]);

      const periodIncome = useMemo(() => {
        return filteredFinances
          .filter(f => f.type === "ingreso" && (selectedWalletFilter === "Crédito" ? true : getPersonalWallet(f) !== "Crédito"))
          .reduce((a, b) => a + Number(b.amount || 0), 0);
      }, [filteredFinances, selectedWalletFilter]);

      const periodExpense = useMemo(() => {
        return filteredFinances
          .filter(f => f.type === "gasto" && (selectedWalletFilter === "Crédito" ? true : getPersonalWallet(f) !== "Crédito"))
          .reduce((a, b) => a + Number(b.amount || 0), 0);
      }, [filteredFinances, selectedWalletFilter]);

      const cashIncome = useMemo(() => {
        return monthFilteredFinances.filter(f => f.type === "ingreso" && getPersonalWallet(f) === "Efectivo").reduce((a, b) => a + Number(b.amount || 0), 0);
      }, [monthFilteredFinances]);
      const cashExpense = useMemo(() => {
        return monthFilteredFinances.filter(f => f.type === "gasto" && getPersonalWallet(f) === "Efectivo").reduce((a, b) => a + Number(b.amount || 0), 0);
      }, [monthFilteredFinances]);
      const cashBalance = cashIncome - cashExpense;

      const cardIncome = useMemo(() => {
        return monthFilteredFinances.filter(f => f.type === "ingreso" && getPersonalWallet(f) === "Tarjeta").reduce((a, b) => a + Number(b.amount || 0), 0);
      }, [monthFilteredFinances]);
      const cardExpense = useMemo(() => {
        return monthFilteredFinances.filter(f => f.type === "gasto" && getPersonalWallet(f) === "Tarjeta").reduce((a, b) => a + Number(b.amount || 0), 0);
      }, [monthFilteredFinances]);
      const cardBalance = cardIncome - cardExpense;

      const periodBalance = periodIncome - periodExpense;
      const currentPeriodLabel = selectedMonth ? formatMonthLabel(selectedMonth) : "Historial Completo";

      const paymentUrgencyColor = creditCardSummary
        ? creditCardSummary.daysUntilPayment <= 3
          ? "#F87171"
          : creditCardSummary.daysUntilPayment <= 7
          ? "#FBBF24"
          : "#34D399"
        : "#34D399";

      return (
        <div>
          <div style={styles.pageHeader}>
            <div>
              <div style={{ ...styles.eyebrow, color: "#C084FC" }}>GESTIÓN INDEPENDIENTE • EFECTIVO, DÉBITO Y CUPO CRÉDITO</div>
              <h2 style={styles.pageTitle}>Mi Espacio & Finanzas Personales 💳💵💎</h2>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <Icon name="calendar" size={15} color="#C084FC" />
                <select
                  style={{ ...styles.filterSelect, borderColor: "rgba(168, 85, 247, 0.3)" }}
                  value={selectedMonth}
                  onChange={e => setSelectedMonth(e.target.value)}
                >
                  <option value="">Todos los meses</option>
                  {availableMonths.map(ym => (
                    <option key={ym} value={ym}>{formatMonthLabel(ym)}</option>
                  ))}
                </select>
              </div>

              <select
                style={{ ...styles.filterSelect, borderColor: "rgba(56, 189, 248, 0.3)" }}
                value={selectedWalletFilter}
                onChange={e => setSelectedWalletFilter(e.target.value)}
              >
                <option value="Todos">👛 Todos (Efectivo + Débito + Crédito)</option>
                <option value="Efectivo">💵 Solo Efectivo</option>
                <option value="Tarjeta">💳 Solo Tarjeta Débito / Banco</option>
                <option value="Crédito">💎 Solo Tarjeta de Crédito (Cupo)</option>
              </select>

              <a
                href="widget.html"
                target="_blank"
                rel="noopener noreferrer"
                style={{ ...styles.amberBtn, textDecoration: "none" }}
                title="Abrir Widget Rápido independiente para móvil"
              >
                <Icon name="smartphone" size={14} color="#FEF3C7" /> ⚡ Modo Widget
              </a>
              <button style={styles.purpleExportBtn} onClick={() => onExport(filteredFinances, currentPeriodLabel, periodIncome, periodExpense, periodBalance, cashBalance, cardBalance)}>
                <Icon name="file-spreadsheet" size={14} color="#C084FC" /> Exportar Sheets
              </button>
              <button style={styles.purpleBtn} onClick={() => onNew()}>
                <Icon name="plus" size={14} /> Nuevo Movimiento
              </button>
            </div>
          </div>

          {(selectedMonth || selectedWalletFilter !== "Todos") && (
            <div style={{ ...styles.filterBanner, borderColor: "rgba(168, 85, 247, 0.3)", background: "rgba(168, 85, 247, 0.08)", flexWrap: "wrap" }}>
              <Icon name="filter" size={14} color="#C084FC" />
              <span style={{ color: "#E9D5FF" }}>
                Filtrando por: <strong>{selectedMonth ? formatMonthLabel(selectedMonth) : "Todos los meses"}</strong>
                {selectedWalletFilter !== "Todos" ? ` • Medio: ${selectedWalletFilter === "Crédito" ? "Tarjeta de Crédito (Cupo)" : selectedWalletFilter}` : ""}
              </span>
              <button
                style={{ ...styles.clearFilterBtn, color: "#C084FC" }}
                onClick={() => { setSelectedMonth(""); setSelectedWalletFilter("Todos"); }}
              >
                Limpiar filtros
              </button>
            </div>
          )}

          {/* SEPARACIÓN PRINCIPAL: TARJETA DE EFECTIVO Y TARJETA BANCARIA CON BOTONES + AGREGAR / - RESTAR */}
          <div className="responsive-2col" style={{ ...styles.dashGrid, marginBottom: 16 }}>
            <div style={{ ...styles.panel, borderColor: "rgba(52, 211, 153, 0.35)", background: "linear-gradient(145deg, rgba(16, 185, 129, 0.1) 0%, rgba(15, 23, 42, 0.6) 100%)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                <div>
                  <span style={{ fontSize: 11, fontWeight: 700, color: "#6EE7B7", letterSpacing: "0.06em", textTransform: "uppercase" }}>
                    💵 Bolsillo en Efectivo
                  </span>
                  <div style={{ fontSize: 26, fontWeight: 800, color: cashBalance >= 0 ? "#34D399" : "#F87171", marginTop: 4 }}>
                    {money(cashBalance)}
                  </div>
                </div>
                <div style={{ background: "rgba(16, 185, 129, 0.18)", padding: 10, borderRadius: 12, border: "1px solid rgba(52, 211, 153, 0.3)" }}>
                  <Icon name="banknote" size={22} color="#34D399" />
                </div>
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#CBD5E1", margin: "12px 0", padding: "8px 10px", background: "rgba(0,0,0,0.22)", borderRadius: 8 }}>
                <span>Entradas: <strong style={{ color: "#34D399" }}>+{money(cashIncome)}</strong></span>
                <span>Salidas: <strong style={{ color: "#F87171" }}>-{money(cashExpense)}</strong></span>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <button
                  type="button"
                  style={styles.walletPlusBtn}
                  onClick={() => onNew({ type: "ingreso", wallet: "Efectivo" })}
                >
                  <Icon name="plus-circle" size={15} color="#34D399" />
                  <span>+ Agregar Efectivo</span>
                </button>
                <button
                  type="button"
                  style={styles.walletMinusBtn}
                  onClick={() => onNew({ type: "gasto", wallet: "Efectivo" })}
                >
                  <Icon name="minus-circle" size={15} color="#F87171" />
                  <span>- Restar Efectivo</span>
                </button>
              </div>
            </div>

            <div style={{ ...styles.panel, borderColor: "rgba(56, 189, 248, 0.35)", background: "linear-gradient(145deg, rgba(56, 189, 248, 0.1) 0%, rgba(15, 23, 42, 0.6) 100%)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                <div>
                  <span style={{ fontSize: 11, fontWeight: 700, color: "#7DD3FC", letterSpacing: "0.06em", textTransform: "uppercase" }}>
                    💳 Dinero en Tarjeta / Banco
                  </span>
                  <div style={{ fontSize: 26, fontWeight: 800, color: cardBalance >= 0 ? "#38BDF8" : "#F87171", marginTop: 4 }}>
                    {money(cardBalance)}
                  </div>
                </div>
                <div style={{ background: "rgba(56, 189, 248, 0.18)", padding: 10, borderRadius: 12, border: "1px solid rgba(56, 189, 248, 0.3)" }}>
                  <Icon name="credit-card" size={22} color="#38BDF8" />
                </div>
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#CBD5E1", margin: "12px 0", padding: "8px 10px", background: "rgba(0,0,0,0.22)", borderRadius: 8 }}>
                <span>Entradas: <strong style={{ color: "#34D399" }}>+{money(cardIncome)}</strong></span>
                <span>Salidas: <strong style={{ color: "#F87171" }}>-{money(cardExpense)}</strong></span>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <button
                  type="button"
                  style={styles.walletPlusBtn}
                  onClick={() => onNew({ type: "ingreso", wallet: "Tarjeta" })}
                >
                  <Icon name="plus-circle" size={15} color="#34D399" />
                  <span>+ Agregar Tarjeta</span>
                </button>
                <button
                  type="button"
                  style={styles.walletMinusBtn}
                  onClick={() => onNew({ type: "gasto", wallet: "Tarjeta" })}
                >
                  <Icon name="minus-circle" size={15} color="#F87171" />
                  <span>- Restar Tarjeta</span>
                </button>
              </div>
            </div>
          </div>

          {/* NUEVA SECCIÓN: TARJETA DE CRÉDITO (CUPO DISPONIBLE, DÍAS DE PAGO Y + / - CUPO) */}
          {creditCardSummary && (
            <div style={{
              ...styles.panel,
              marginBottom: 18,
              borderColor: "rgba(251, 191, 36, 0.4)",
              background: "linear-gradient(145deg, rgba(245, 158, 11, 0.12) 0%, rgba(168, 85, 247, 0.08) 55%, rgba(15, 23, 42, 0.72) 100%)"
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 14 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{
                    background: "rgba(251, 191, 36, 0.18)",
                    border: "1px solid rgba(251, 191, 36, 0.4)",
                    padding: 11,
                    borderRadius: 12,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center"
                  }}>
                    <Icon name="credit-card" size={24} color="#FBBF24" />
                  </div>
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 11, fontWeight: 800, color: "#FDE68A", letterSpacing: "0.07em", textTransform: "uppercase" }}>
                        💎 Tarjeta de Crédito • Control de Cupo y Fecha de Pago
                      </span>
                      <span style={{
                        background: "rgba(251, 191, 36, 0.2)",
                        border: "1px solid rgba(251, 191, 36, 0.4)",
                        color: "#FEF3C7",
                        padding: "2px 8px",
                        borderRadius: 20,
                        fontSize: 10.5,
                        fontWeight: 700
                      }}>
                        {creditCardSummary.cardName}
                      </span>
                    </div>
                    <div style={{ fontSize: 12, color: "#CBD5E1", marginTop: 3 }}>
                      Facturación día <strong>{creditCardSummary.billingDay}</strong> • Día de pago mensual: <strong>Día {creditCardSummary.paymentDay}</strong> (Próximo vencimiento: <strong>{creditCardSummary.nextPaymentFormatted}</strong>)
                    </div>
                  </div>
                </div>

                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <div style={{
                    background: "rgba(15, 23, 42, 0.65)",
                    border: `1px solid ${paymentUrgencyColor}`,
                    borderRadius: 10,
                    padding: "6px 12px",
                    display: "flex",
                    alignItems: "center",
                    gap: 7
                  }}>
                    <Icon name="calendar-clock" size={15} color={paymentUrgencyColor} />
                    <span style={{ fontSize: 12, color: "#F8FAFC", fontWeight: 700 }}>
                      {creditCardSummary.daysUntilPayment === 0
                        ? "⚠️ ¡Día de pago es HOY!"
                        : creditCardSummary.daysUntilPayment === 1
                        ? "⏰ ¡Mañana es día de pago!"
                        : `📅 Faltan ${creditCardSummary.daysUntilPayment} días para pagar`}
                    </span>
                  </div>

                  <button
                    type="button"
                    style={styles.amberBtn}
                    onClick={onOpenCreditCardConfig}
                  >
                    <Icon name="settings" size={14} /> Configurar Cupo y Días de Pago
                  </button>
                </div>
              </div>

              {/* TARJETAS DE MÉTRICAS DE CUPO */}
              <div className="responsive-kpi-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(195px, 1fr))", gap: 12, marginBottom: 14 }}>
                <div style={{
                  background: "rgba(16, 185, 129, 0.1)",
                  border: "1px solid rgba(52, 211, 153, 0.35)",
                  borderRadius: 12,
                  padding: "12px 14px"
                }}>
                  <span style={{ fontSize: 11, color: "#A7F3D0", fontWeight: 700, textTransform: "uppercase" }}>
                    ✨ Cupo Disponible (Me queda)
                  </span>
                  <div style={{ fontSize: 25, fontWeight: 800, color: "#34D399", marginTop: 4 }}>
                    {money(creditCardSummary.availableCredit)}
                  </div>
                  <span style={{ fontSize: 11, color: "#6EE7B7" }}>
                    {(100 - creditCardSummary.usagePercent).toFixed(1)}% libre para usar
                  </span>
                </div>

                <div style={{
                  background: "rgba(239, 68, 68, 0.1)",
                  border: "1px solid rgba(248, 113, 113, 0.32)",
                  borderRadius: 12,
                  padding: "12px 14px"
                }}>
                  <span style={{ fontSize: 11, color: "#FECACA", fontWeight: 700, textTransform: "uppercase" }}>
                    📉 Cupo Utilizado / Deuda Actual
                  </span>
                  <div style={{ fontSize: 25, fontWeight: 800, color: "#F87171", marginTop: 4 }}>
                    {money(creditCardSummary.usedAmount)}
                  </div>
                  <span style={{ fontSize: 11, color: "#FCA5A5" }}>
                    {creditCardSummary.usagePercent.toFixed(1)}% del cupo ocupado
                  </span>
                </div>

                <div style={{
                  background: "rgba(255, 255, 255, 0.04)",
                  border: "1px solid rgba(251, 191, 36, 0.3)",
                  borderRadius: 12,
                  padding: "12px 14px"
                }}>
                  <span style={{ fontSize: 11, color: "#FDE68A", fontWeight: 700, textTransform: "uppercase" }}>
                    🏦 Cupo Total de la Tarjeta
                  </span>
                  <div style={{ fontSize: 23, fontWeight: 800, color: "#FBBF24", marginTop: 4 }}>
                    {money(creditCardSummary.totalLimit)}
                  </div>
                  <span style={{ fontSize: 11, color: "#CBD5E1" }}>
                    Límite total configurado
                  </span>
                </div>

                <div style={{
                  background: "rgba(168, 85, 247, 0.1)",
                  border: "1px solid rgba(192, 132, 252, 0.3)",
                  borderRadius: 12,
                  padding: "12px 14px"
                }}>
                  <span style={{ fontSize: 11, color: "#E9D5FF", fontWeight: 700, textTransform: "uppercase" }}>
                    🗓️ Próxima Fecha de Pago
                  </span>
                  <div style={{ fontSize: 18, fontWeight: 800, color: "#F8FAFC", marginTop: 6 }}>
                    Día {creditCardSummary.paymentDay} ({creditCardSummary.nextPaymentFormatted})
                  </div>
                  <span style={{ fontSize: 11, color: "#C084FC" }}>
                    Corte/Facturación: día {creditCardSummary.billingDay}
                  </span>
                </div>
              </div>

                  <span>Barra de Cupo Disponible vs Utilizado</span>
                  <span>

                  </span>

                  width: "100%",

                  display: "flex"
                }}>

    function ClientesManager({ customers, sales, onNew, onEdit, onDelete }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      const customerStats = useMemo(() => {
        return customers.map(c => {
          const customerSales = sales.filter(s => (s.customerName || "").toLowerCase() === (c.name || "").toLowerCase());
          const totalSpent = customerSales.reduce((a, s) => a + Number(s.total || 0), 0);
          const lastPurchase = customerSales.length ? customerSales.map(s => s.date).sort().reverse()[0] : null;
          return { ...c, purchaseCount: customerSales.length, totalSpent, lastPurchase };
        }).sort((a, b) => b.totalSpent - a.totalSpent);
      }, [customers, sales]);

      useEffect(() => {
        if (!window.Chart) return;
        if (chartRef.current) chartRef.current.destroy();
        if (canvasRef.current) {
          const top = customerStats.slice(0, 6);
          chartRef.current = new window.Chart(canvasRef.current, {
            type: "bar",
            data: {
              labels: top.map(c => c.name),
              datasets: [{
                label: "Total comprado",
                data: top.map(c => c.totalSpent),
                backgroundColor: "rgba(52, 211, 153, 0.75)",
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              indexAxis: "y",
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } },
                y: { ticks: { color: "#E2E8F0", font: { size: 11 } }, grid: { display: false } }
              }
            }
          });
        }
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [customerStats]);

      return (
        <div>
          <div style={styles.pageHeader}>
            <div>
              <div style={styles.eyebrow}>CRM & CARTERA</div>
              <h2 style={styles.pageTitle}>Fichas de Clientes e Historial de Compra</h2>
            </div>
            <button style={styles.primaryBtn} onClick={onNew}>
              <Icon name="user-plus" size={14} /> Agregar Cliente
            </button>
          </div>

          <div style={styles.panel}>
            <h3 style={styles.panelTitle}>Top Clientes por Monto Comprado</h3>
            <div style={{ height: 210 }}>
              <canvas ref={canvasRef}></canvas>
            </div>
          </div>

          <div style={{ ...styles.panel, marginTop: 16 }}>

              <table style={styles.table}>
                <thead>
                  <tr style={styles.tableHeaderRow}>
                    <th style={{ padding: "12px 10px" }}>Nombre</th>

                    <th>Última Compra</th>
                    <th style={{ textAlign: "right", paddingRight: 10 }}>Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  {customerStats.length === 0 ? (
                    <tr>
                      <td colSpan="6" style={{ padding: 24, textAlign: "center", color: "#64748B" }}>
                        No hay clientes registrados todavía.
                      </td>
                    </tr>
                  ) : (
                    customerStats.map(c => (
                      <tr key={c.id} style={styles.tableRow}>
                        <td style={{ padding: 10, fontWeight: 600, color: "#F8FAFC" }}>{c.name}</td>
                        <td style={{ color: "#94A3B8" }}>{c.phone || "-"}</td>
                        <td><span style={styles.badgeGray}>{c.purchaseCount} ped.</span></td>
                        <td style={{ color: "#34D399", fontWeight: 700 }}>{money(c.totalSpent)}</td>

    function SaleModal({ sale, customers, products, locations, onClose, onSave }) {
      const [customerName, setCustomerName] = useState(sale?.customerName || "");
      const [details, setDetails] = useState(sale?.details || "");
      const [paymentMethod, setPaymentMethod] = useState(sale?.paymentMethod || "Efectivo");
      const [total, setTotal] = useState(sale?.total || 0);
      const [date, setDate] = useState(sale?.date || new Date().toISOString().slice(0, 10));

      const [selectedProductId, setSelectedProductId] = useState("");
      const [selectedQty, setSelectedQty] = useState(1);
      const [selectedLocId, setSelectedLocId] = useState(locations[1]?.id || "loc-tienda");

      const handleQuickSelectProduct = (prodId, qtyVal) => {
        setSelectedProductId(prodId);
        const prod = products.find(p => p.id === prodId);
        if (prod) {
          const q = Math.max(1, Number(qtyVal) || 1);
          setDetails(`${q}x ${prod.name}`);
          setTotal((Number(prod.salePrice) || 0) * q);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!customerName.trim() || Number(total) <= 0) return;
        const deduction = !sale && selectedProductId
          ? { productId: selectedProductId, qty: Number(selectedQty) || 1, locationId: selectedLocId }
          : null;
        onSave(
          { customerName: sanitizeText(customerName), details: sanitizeText(details), paymentMethod, total: Number(total), date },
          deduction
        );
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div className="responsive-modal" style={styles.glassModal} onClick={e => e.stopPropagation()}>
            <h3 style={styles.modalTitle}>{sale ? "Modificar Venta" : "Registrar Nueva Venta"}</h3>
            <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {!sale && products && products.length > 0 && (
                <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(251,191,36,0.25)", borderRadius: 10, padding: 10 }}>
                  <span style={{ fontSize: 11, color: "#FBBF24", fontWeight: 600, display: "block", marginBottom: 6 }}>
                    ⚡ Seleccionar Producto del Almacén (Descuenta Stock Automáticamente):
                  </span>
                  <div className="responsive-3col" style={{ display: "grid", gridTemplateColumns: "1.4fr 70px 1fr", gap: 8 }}>
                    <select style={styles.glassInput} value={selectedProductId} onChange={e => handleQuickSelectProduct(e.target.value, selectedQty)}>
                      <option value="">-- Venta manual libre --</option>
                      {products.map(p => <option key={p.id} value={p.id}>{p.name} ({money(p.salePrice)})</option>)}
                    </select>
                    <input
                      style={styles.glassInput}
                      type="number"
                      min="1"
                      value={selectedQty}
                      onChange={e => {
                        setSelectedQty(e.target.value);
                        if (selectedProductId) handleQuickSelectProduct(selectedProductId, e.target.value);
                      }}
                    />
                    <select style={styles.glassInput} value={selectedLocId} onChange={e => setSelectedLocId(e.target.value)}>
                      {locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                    </select>
                  </div>
                </div>
              )}

              <div>
                <label style={styles.inputLabel}>Cliente</label>
                <input style={styles.glassInput} value={customerName} onChange={e => setCustomerName(e.target.value)} placeholder="Ej: Carlos Soto / Consumidor Final" list="customer-suggestions" required />
                <datalist id="customer-suggestions">
                  {customers.map(c => <option key={c.id} value={c.name} />)}
                </datalist>
              </div>
              <div>
                <label style={styles.inputLabel}>Detalle o Concepto</label>
                <input style={styles.glassInput} value={details} onChange={e => setDetails(e.target.value)} placeholder="Ej: 2x Poleras Oversize" />
              </div>
              <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>Medio de Pago</label>
                  <select style={styles.glassInput} value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)}>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Tarjeta Débito">Tarjeta Débito</option>
                    <option value="Tarjeta Crédito">Tarjeta Crédito</option>
                    <option value="Transferencia">Transferencia</option>
                  </select>
                </div>
                <div>
                  <label style={styles.inputLabel}>Total Venta ($)</label>
                  <input style={styles.glassInput} type="number" min="1" value={total} onChange={e => setTotal(e.target.value)} required />
                </div>
              </div>
              <div>
                <label style={styles.inputLabel}>Fecha</label>
                <input style={styles.glassInput} type="date" value={date} onChange={e => setDate(e.target.value)} required />
              </div>
              <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 }}>
                <button type="button" style={styles.secondaryBtn} onClick={onClose}>Cancelar</button>
                <button type="submit" style={styles.primaryBtn}>{sale ? "Guardar Cambios" : "Guardar Venta"}</button>
              </div>
            </form>
          </div>
        </div>
      );

    function PersonalFinanceModal({ item, creditCardSummary, onClose, onSave }) {
      const isEditing = Boolean(item && item.id && !item.isPreset);
      const [type, setType] = useState(item?.type || "gasto");
      const [wallet, setWallet] = useState(item?.wallet ? item.wallet : (isEditing ? getPersonalWallet(item) : "Tarjeta"));
      const [category, setCategory] = useState(
        item?.category ||
        (item?.wallet === "Crédito"
          ? (item?.type === "ingreso" ? "Pago / Abono Tarjeta de Crédito" : "Compras con Tarjeta de Crédito")
          : (item?.type === "ingreso" ? "Retiro de Ganancias" : PERSONAL_CATEGORIES[0]))
      );
      const [description, setDescription] = useState(item?.description || "");
      const [amount, setAmount] = useState(item?.amount || "");
      const [date, setDate] = useState(item?.date || new Date().toISOString().slice(0, 10));

      const isCredit = wallet === "Crédito";

      const handleSelectWallet = (nextWallet) => {
        setWallet(nextWallet);
        if (nextWallet === "Crédito") {
          setCategory(type === "ingreso" ? "Pago / Abono Tarjeta de Crédito" : "Compras con Tarjeta de Crédito");
        }
      };

      const handleSelectType = (nextType) => {
