    * {

      padding: 0;

    body {
      margin: 0;
      background: #07090e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #F1F5F9;
      overflow-x: hidden;
      position: relative;
      transition: background 0.3s ease;
    }
    body[data-warehouse-theme="warm"] {
      background: #120f0b;
    }
    /* Orbes de luz ambiental de fondo para efecto Glassmorphism */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, #0c4f1c, #063111); top: -80px; left: -80px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #0ea5e9, #0369a1); bottom: -60px; right: -60px; animation-delay: -5s; }

    body[data-warehouse-theme="warm"] .orb-2 { background: radial-gradient(circle, #0f766e, #115e59); opacity: 0.35; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, 25px) scale(1.08); }
      100% { transform: translate(-25px, 45px) scale(0.95); }
    }
    #root {
      width: 100%;
      max-width: 1320px;
      z-index: 1;
      position: relative;
    }
    input, select, button, textarea {
      font-family: inherit;
    }
    option {
      background-color: #0f172a;

    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }

    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

    async function hashPassword(plain, salt = "almacen_supabase_salt_v2") {
      try {
        if (!window.crypto || !window.crypto.subtle) {
          return "sha256$" + btoa(unescape(encodeURIComponent(salt + plain)));
        }
        const data = new TextEncoder().encode(salt + "::" + plain);
        const digest = await window.crypto.subtle.digest("SHA-256", data);
        return "sha256$" + Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
      } catch (e) {
        return "sha256$" + btoa(unescape(encodeURIComponent(salt + plain)));
      }
    }

    async function verifyUserPassword(userObj, inputPlain) {
      if (!userObj) return false;
      const stored = String(userObj.pass || "");
      if (stored.startsWith("sha256$")) {
        const hashedInput = await hashPassword(inputPlain);
        return stored === hashedInput;
      }
      return stored === inputPlain;
    }

    function exportToGoogleSheetsCSV(filename, rows) {
      const csvContent = "\uFEFF" + rows.map(row =>
        row.map(cell => {
          if (cell === null || cell === undefined) return '""';
          let cellStr = String(cell).replace(/"/g, '""');
          if (/^[=+\-@]/.test(cellStr)) {
            cellStr = "'" + cellStr;
          }
          return `"${cellStr}"`;
        }).join(";")
      ).join("\r\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

        const prod = products.find(p => p.id === productId);
        if (!prod) return;
        const currentFrom = Number(prod.stockByLocation?.[fromLocId] || 0);

          return;
        }
        const updatedProduct = {
          ...prod,
          stockByLocation: {
            ...(prod.stockByLocation || {}),
            [fromLocId]: currentFrom - qty,
            [toLocId]: Number(prod.stockByLocation?.[toLocId] || 0) + qty

        setProducts(prev => prev.map(p => p.id === productId ? updatedProduct : p));

          updatedEntry = { ...saleData, id: "s-" + Date.now() };
          setSales(prev => [updatedEntry, ...prev]);
          registerAudit("Venta Registrada", `${money(updatedEntry.total)} - ${updatedEntry.customerName}`);
          notify("Venta registrada en caja");
        } else {
          updatedEntry = { ...saleData, id: saleModalState.id };
          setSales(prev => prev.map(s => s.id === saleModalState.id ? updatedEntry : s));
          registerAudit("Venta Modificada", `${money(updatedEntry.total)} - ${updatedEntry.customerName}`);
          notify("Venta modificada");
        }

        if (stockDeduction && stockDeduction.productId && stockDeduction.qty > 0) {
          const targetProd = products.find(p => p.id === stockDeduction.productId);
          if (targetProd) {
            const locId = stockDeduction.locationId || "loc-tienda";
            const currentLocStock = Number(targetProd.stockByLocation?.[locId] || 0);
            const updatedProd = {
              ...targetProd,
              stockByLocation: {
                ...(targetProd.stockByLocation || {}),
                [locId]: Math.max(0, currentLocStock - stockDeduction.qty)
              }
            };
            setProducts(prev => prev.map(p => p.id === targetProd.id ? updatedProd : p));
            if (supabase) {
              await supabase.from("productos").upsert([updatedProd]);
            }
          }
        }

        ensureCustomerExists(saleData.customerName);
        setSaleModalState(null);

        if (supabase) {
          await supabase.from("ventas").upsert([updatedEntry]);
        }
      };

      const handleDeleteSale = async (saleId) => {
        if (confirm("¿Estás seguro de eliminar esta venta del registro?")) {
          setSales(prev => prev.filter(s => s.id !== saleId));
          registerAudit("Venta Eliminada", saleId);
          notify("Venta eliminada", "warn");
          if (supabase) {
            await supabase.from("ventas").delete().eq("id", saleId);
          }
        }
      };

      const handleSaveExpense = async (expenseData) => {
        let updatedEntry;
        if (expenseModalState === "new") {
          updatedEntry = { ...expenseData, id: "e-" + Date.now() };
          setExpenses(prev => [updatedEntry, ...prev]);
          registerAudit("Gasto Registrado", `${updatedEntry.category}: ${money(updatedEntry.amount)}`);
          notify("Gasto registrado");
        } else {
          updatedEntry = { ...expenseData, id: expenseModalState.id };
          setExpenses(prev => prev.map(e => e.id === expenseModalState.id ? updatedEntry : e));
          notify("Gasto actualizado");
        }
        setExpenseModalState(null);

        if (supabase) {
          await supabase.from("gastos").upsert([updatedEntry]);
        }
      };

      const handleDeleteExpense = async (expenseId) => {
        if (confirm("¿Estás seguro de eliminar este gasto del registro?")) {
          setExpenses(prev => prev.filter(e => e.id !== expenseId));
          notify("Gasto eliminado", "warn");
          if (supabase) {
            await supabase.from("gastos").delete().eq("id", expenseId);
          }
        }
      };

      const handleSaveCustomer = async (customerData) => {
        let updatedEntry;
        if (customerModalState === "new") {
          updatedEntry = { ...customerData, id: "c-" + Date.now() };
          setCustomers(prev => [updatedEntry, ...prev]);
          notify("Cliente guardado");
        } else {
          updatedEntry = { ...customerData, id: customerModalState.id };
          setCustomers(prev => prev.map(c => c.id === customerModalState.id ? updatedEntry : c));
          notify("Cliente actualizado");
        }
        setCustomerModalState(null);

        if (supabase) {
          await supabase.from("clientes").upsert([updatedEntry]);
        }
      };

      const handleDeleteCustomer = async (customerId) => {
        if (confirm("¿Estás seguro de eliminar este cliente del registro?")) {
          setCustomers(prev => prev.filter(c => c.id !== customerId));
          notify("Cliente eliminado", "warn");
          if (supabase) {
            await supabase.from("clientes").delete().eq("id", customerId);
          }
        }
      };

      const handleSavePersonalFinance = async (itemData) => {
        let updatedEntry;
        if (personalModalState === "new") {
          updatedEntry = { ...itemData, id: "pf-" + Date.now() };
          setPersonalFinances(prev => [updatedEntry, ...prev]);
          notify("Movimiento personal guardado");
        } else {
          updatedEntry = { ...itemData, id: personalModalState.id };
          setPersonalFinances(prev => prev.map(item => item.id === personalModalState.id ? updatedEntry : item));
          notify("Movimiento personal actualizado");
        }
        setPersonalModalState(null);

        if (supabase) {
          await supabase.from("finanzas_personales").upsert([updatedEntry]);
        }
      };

      const handleDeletePersonalFinance = async (id) => {
        if (confirm("¿Eliminar este movimiento de tus finanzas personales?")) {
          setPersonalFinances(prev => prev.filter(i => i.id !== id));
          notify("Movimiento eliminado", "warn");
          if (supabase) {
            await supabase.from("finanzas_personales").delete().eq("id", id);
          }
        }
      };

      // CONDICIONAL DE AUTENTICACIÓN (DESPUÉS DE TODOS LOS HOOKS)
      if (!currentUser) {
        return <AuthScreen onLogin={handleLogin} onRegister={handleRegister} users={users} />;
      }

      const role = currentUser.role || "Vendedor";
      const activePerms = rolePermissions[role] || defaultRolePermissions[role] || defaultRolePermissions.Vendedor;

      const canAccessFinances = Boolean(activePerms.gastos);
      const canAccessPersonal = Boolean(activePerms.personal);
      const canAccessWarehouses = Boolean(activePerms.bodegas);
      const canAccessSales = Boolean(activePerms.ventas);
      const canAccessCustomers = Boolean(activePerms.clientes);
      const canManageInventory = Boolean(activePerms.canManageInventory);
      const canViewCosts = Boolean(activePerms.canViewCosts);

      const lowStock = products.filter(p => getProductTotalStock(p) <= (p.minStock || 0));
      const totalSales = sales.reduce((a, s) => a + Number(s.total || 0), 0);
      const totalExpenses = expenses.reduce((a, e) => a + Number(e.amount || 0), 0);
      const profit = totalSales - totalExpenses;

      const personalIncome = personalFinances.filter(f => f.type === "ingreso").reduce((a, b) => a + Number(b.amount || 0), 0);
      const personalExpense = personalFinances.filter(f => f.type === "gasto").reduce((a, b) => a + Number(b.amount || 0), 0);
      const personalBalance = personalIncome - personalExpense;

      const handleExportBusinessFinances = () => {
        const today = new Date().toISOString().slice(0, 10);
        const labelPeriodo = salesMonthFilter ? formatMonthLabel(salesMonthFilter) : "Historial Completo";
        const rows = [
          ["REPORTE GENERAL - FINANZAS DEL NEGOCIO", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", ""],
          ["Período Seleccionado:", labelPeriodo, "", "", ""],
          [""],
          ["--- VENTAS REGISTRADAS ---", "", "", "", ""],
          ["Fecha", "Cliente", "Detalle / Concepto", "Medio de Pago", "Monto ($)"],
          ...filteredSales.map(s => [s.date, s.customerName, s.details || "Venta General", s.paymentMethod, s.total]),
          ["TOTAL VENTAS PERÍODO", "", "", "", filteredSalesTotal],
          [""],
          ["--- GASTOS OPERATIVOS DEL NEGOCIO ---", "", "", "", ""],
          ["Fecha", "Categoría", "Descripción", "", "Monto ($)"],
          ...expenses.map(e => [e.date, e.category, e.description || "-", "", e.amount]),
          ["TOTAL GASTOS", "", "", "", totalExpenses],
          [""],
          ["--- RESUMEN FINANCIERO ---", "", "", "", ""],
          ["Ingresos por Ventas", "", "", "", totalSales],
          ["Egresos por Gastos", "", "", "", totalExpenses],
          ["UTILIDAD NETA (NEGOCIO)", "", "", "", profit]
        ];
        exportToGoogleSheetsCSV(`Finanzas_Negocio_${salesMonthFilter || "Total"}_${today}.csv`, rows);
      };

      const handleExportPersonalFinances = (filteredList, periodLabel, pIncome, pExpense, pBalance) => {
        const today = new Date().toISOString().slice(0, 10);
        const rows = [
          ["REPORTE GENERAL - ESPACIO Y FINANZAS PERSONALES", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", ""],
          ["Período:", periodLabel, "", "", ""],
          [""],
          ["--- REGISTRO DE MOVIMIENTOS PERSONALES ---", "", "", "", ""],
          ["Fecha", "Tipo", "Categoría", "Descripción / Motivo", "Monto ($)"],
          ...filteredList.map(p => [
            p.date,
            p.type === "ingreso" ? "Ingreso (+)" : "Gasto (-)",
            p.category,
            p.description || "-",
            p.type === "ingreso" ? p.amount : -Math.abs(p.amount)
          ]),
          [""],
          ["--- BALANCE PERSONAL DEL PERÍODO ---", "", "", "", ""],
          ["Total Ingresos Personales", "", "", "", pIncome],
          ["Total Gastos Personales", "", "", "", pExpense],
          ["SALDO DISPONIBLE EN BOLSILLO", "", "", "", pBalance]
        ];
        exportToGoogleSheetsCSV(`Finanzas_Personales_${periodLabel.replace(/\s+/g, '_')}_${today}.csv`, rows);
      };

      const handleExportInventory = () => {
        const today = new Date().toISOString().slice(0, 10);
        const rows = [
          ["CATÁLOGO DE PRODUCTOS E INVENTARIO", "", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", "", ""],
          [""],
          ["Nombre", "Categoría", "SKU", "Costo ($)", "Precio Venta ($)", "Stock Total", "Stock Mínimo"],
          ...products.map(p => [
            p.name,
            p.category,
            p.sku,
            canViewCosts ? p.costPrice : "Restringido",
            p.salePrice,
            getProductTotalStock(p),
            p.minStock
          ])
        ];
        exportToGoogleSheetsCSV(`Inventario_${today}.csv`, rows);
      };

      return (
        <div style={styles.appContainer}>
          {toast && (
            <div style={{
              position: "fixed", bottom: 22, right: 24, zIndex: 999,
              background: toast.type === "warn" ? "rgba(217, 119, 6, 0.95)" : "rgba(12, 79, 28, 0.95)",
              border: "1px solid rgba(255,255,255,0.25)", color: "#FFF", padding: "10px 16px",
              borderRadius: 12, fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 8,
              boxShadow: "0 12px 30px rgba(0,0,0,0.45)", backdropFilter: "blur(12px)"
            }}>
              <Icon name={toast.type === "warn" ? "alert-circle" : "check-circle-2"} size={15} color="#FFF" />
              <span>{toast.msg}</span>
            </div>
          )}

          <aside style={styles.sidebar}>
            <div style={styles.brand}>
              <img
                src="logo.png"
                alt="Logo Almacén"
                onError={(e) => { e.target.style.display = "none"; }}
                style={{ width: 36, height: 36, objectFit: "contain" }}
              />
              <div style={{ flex: 1 }}>
                <div style={styles.brandTitle}>Almacén</div>
                <div style={styles.brandSub}>
                  {isSupabaseConfigured ? "☁️ Nube Supabase Activa" : "💾 Modo Local"}
                </div>
              </div>
              <button
                onClick={() => setWarehouseTheme(prev => prev === "warm" ? "cool" : "warm")}
                style={styles.themeToggleBtn}
                title="Cambiar ambiente visual del almacén"
              >
                <Icon name={warehouseTheme === "warm" ? "flame" : "sparkles"} size={14} color={warehouseTheme === "warm" ? "#FBBF24" : "#38BDF8"} />
              </button>
            </div>

            <div style={styles.userCard}>
              <div style={styles.userAvatar}>
                {(currentUser.name || "US").slice(0, 2).toUpperCase()}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={styles.userName}>{currentUser.name}</div>
                <span style={{ ...styles.roleBadge, color: role === "Personal" ? "#C084FC" : "#34D399" }}>
                  {currentUser.role}
                </span>
              </div>
              <button style={styles.logoutBtn} onClick={handleLogout} title="Cerrar sesión">
                <Icon name="log-out" size={14} color="#F87171" />
              </button>
            </div>

            <nav style={styles.nav}>
              <button onClick={() => setTab("dashboard")} style={{ ...styles.navItem, ...(tab === "dashboard" ? styles.navItemActive : {}) }}>
                <Icon name="layout-dashboard" size={16} />
                <span>Panel General</span>
              </button>

              {canAccessPersonal && (
                <button onClick={() => setTab("personal")} style={{ ...styles.navItem, ...(tab === "personal" ? styles.navItemActive : {}) }}>
                  <Icon name="wallet" size={16} color="#C084FC" />
                  <span>Espacio Personal</span>
                  <span style={styles.navBadgePurple}>Mío</span>
                </button>
              )}

              <button onClick={() => setTab("inventario")} style={{ ...styles.navItem, ...(tab === "inventario" ? styles.navItemActive : {}) }}>
                <Icon name="package" size={16} />
                <span>Inventario</span>
                {lowStock.length > 0 && <span style={styles.navBadge}>{lowStock.length}</span>}
              </button>

              {canAccessWarehouses && (
                <button onClick={() => setTab("bodegas")} style={{ ...styles.navItem, ...(tab === "bodegas" ? styles.navItemActive : {}) }}>
                  <Icon name="warehouse" size={16} />
                  <span>Bodegas & Traspaso</span>
                </button>
              )}

              {canAccessSales && (
                <button onClick={() => setTab("ventas")} style={{ ...styles.navItem, ...(tab === "ventas" ? styles.navItemActive : {}) }}>
                  <Icon name="shopping-cart" size={16} />
                  <span>Ventas & Caja</span>
                </button>
              )}

              {canAccessCustomers && (
                <button onClick={() => setTab("clientes")} style={{ ...styles.navItem, ...(tab === "clientes" ? styles.navItemActive : {}) }}>
                  <Icon name="users-round" size={16} />
                  <span>Clientes</span>
                </button>
              )}

              {canAccessFinances && (
                <button onClick={() => setTab("gastos")} style={{ ...styles.navItem, ...(tab === "gastos" ? styles.navItemActive : {}) }}>
                  <Icon name="receipt" size={16} />
                  <span>Gastos Negocio</span>
                </button>
              )}

              {(role === "Administrador") && (
                <button onClick={() => setTab("usuarios")} style={{ ...styles.navItem, ...(tab === "usuarios" ? styles.navItemActive : {}) }}>
                  <Icon name="shield-check" size={16} />
                  <span>Equipo & Roles</span>
                </button>
              )}
            </nav>

            <div style={styles.footerStatus}>
              <span style={styles.statusDot}></span>
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {isSyncing ? "Sincronizando..." : currentUser.email}
              </span>
              {isSupabaseConfigured && (
                <button onClick={fetchDataFromSupabase} style={{ background: "none", border: "none", cursor: "pointer", marginLeft: "auto", color: "#94A3B8" }} title="Actualizar datos">
                  <Icon name="refresh-cw" size={12} />
                </button>
              )}
            </div>
          </aside>

          <main style={styles.main}>
            {tab === "dashboard" && (
              <Dashboard
                currentUser={currentUser}
                canAccessSales={canAccessSales}
                canAccessPersonal={canAccessPersonal}
                canViewCosts={canViewCosts}
                sales={sales}
                expenses={expenses}
                products={products}
                lowStock={lowStock}
                locations={locations}
                customers={customers}
                totalSales={totalSales}
                totalExpenses={totalExpenses}
                profit={profit}
                personalFinances={personalFinances}
                personalIncome={personalIncome}
                personalExpense={personalExpense}
                personalBalance={personalBalance}
                onNewSale={() => setSaleModalState("new")}
                onNewPersonal={() => setPersonalModalState("new")}
                onGoToPersonal={() => setTab("personal")}
                onGoToInventory={() => setTab("inventario")}
                onExportBusiness={handleExportBusinessFinances}
                onExportPersonal={() => handleExportPersonalFinances(personalFinances, "Historial Completo", personalIncome, personalExpense, personalBalance)}
              />
            )}

            {tab === "personal" && canAccessPersonal && (
              <PersonalFinancesManager
                personalFinances={personalFinances}
                onNew={() => setPersonalModalState("new")}
                onEdit={(item) => setPersonalModalState(item)}
                onDelete={handleDeletePersonalFinance}
                onExport={handleExportPersonalFinances}
              />
            )}

            {tab === "inventario" && (
              <div>
                <div style={styles.pageHeader}>
                  <div>
                    <div style={styles.eyebrow}>INVENTARIO & CATÁLOGO DE ALMACÉN</div>
                    <h2 style={styles.pageTitle}>Fichas de Productos y Existencias</h2>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <button style={styles.sheetsExportBtn} onClick={handleExportInventory} title="Exportar catálogo a Google Sheets">
                      <Icon name="file-spreadsheet" size={14} color="#34D399" /> Exportar Sheets
                    </button>
                    {canManageInventory && (
                      <button style={styles.primaryBtn} onClick={() => setProductModalState("new")}>
                        <Icon name="plus" size={14} /> Agregar Producto
                      </button>
                    )}
                  </div>
                </div>

                {/* Buscador rápido de Almacén por Nombre, SKU o Código de Barras */}
                <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
                  <div style={{ flex: 1, minWidth: 230 }}>
                    <input
                      style={styles.glassInput}
                      placeholder="🔍 Buscar en estantería por nombre, SKU o Código de Barras..."
                      value={inventorySearch}
                      onChange={e => setInventorySearch(e.target.value)}
                    />
                  </div>
                  <select
                    style={styles.filterSelect}
                    value={inventoryCategoryFilter}
                    onChange={e => setInventoryCategoryFilter(e.target.value)}
                  >
                    <option value="Todas">📦 Todas las categorías</option>
                    {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                {filteredInventory.length === 0 ? (
                  <div style={styles.panel}>
                    <p style={{ textAlign: "center", color: "#64748B", margin: 20 }}>
                      No hay productos que coincidan con la búsqueda.
                    </p>
                  </div>
                ) : (
                  <div style={styles.tagGrid}>
                    {filteredInventory.map(p => (
                      <div key={p.id} style={styles.productGlassCard}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <span style={styles.categoryBadge}>{p.category}</span>
                          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            {getProductTotalStock(p) <= p.minStock && (
                              <span style={styles.stockLowBadge}>Stock Crítico</span>
                            )}
                            {canManageInventory && (
                              <>
                                <button style={styles.actionIconBtn} onClick={() => setProductModalState(p)} title="Modificar Producto">
                                  <Icon name="pencil" size={13} color="#38BDF8" />
                                </button>
                                <button style={styles.actionIconBtn} onClick={() => handleDeleteProduct(p.id)} title="Eliminar Producto">
                                  <Icon name="trash-2" size={13} color="#F87171" />
                                </button>
                              </>
                            )}
                          </div>
                        </div>

                        <div style={{ fontSize: 16, fontWeight: 700, margin: "10px 0 2px", color: "#F8FAFC" }}>{p.name}</div>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#94A3B8", fontFamily: "monospace" }}>
                          <span>SKU: {p.sku || "-"}</span>
                          {p.barcode && <span>EAN: {p.barcode}</span>}
                        </div>
                        <div style={styles.cardDivider}></div>

                        <div style={styles.tagRow}>
                          <span>Precio Venta:</span>
                          <strong style={{ color: "#34D399" }}>{money(p.salePrice)}</strong>
                        </div>
                        {canViewCosts && (
                          <div style={styles.tagRow}>
                            <span>Costo Unitario:</span>
                            <span>{money(p.costPrice)}</span>
                          </div>
                        )}
                        <div style={styles.tagRow}>
                          <span>Stock Mínimo:</span>
                          <span style={{ color: "#94A3B8" }}>{p.minStock || 0} un.</span>
                        </div>
                        <div style={styles.tagRow}>
                          <span>Stock Global:</span>
                          <strong style={{ color: "#38BDF8" }}>{getProductTotalStock(p)} un.</strong>
                        </div>

                        <div style={styles.stockByLocBox}>
                          {locations.map(loc => (
                            <div key={loc.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#94A3B8", margin: "2px 0" }}>
                              <span>{loc.name}:</span>
                              <strong style={{ color: "#E2E8F0" }}>{p.stockByLocation?.[loc.id] || 0}</strong>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {tab === "bodegas" && canAccessWarehouses && (
              <div>
                <div style={styles.pageHeader}>
                  <div>
                    <div style={styles.eyebrow}>LOGÍSTICA MULTI-BODEGA</div>
                    <h2 style={styles.pageTitle}>Distribución de Stock por Almacén</h2>
                  </div>
                  {canManageInventory && (
                    <div style={{ display: "flex", gap: 8 }}>
                      <button style={styles.amberBtn} onClick={() => setTransferModalOpen(true)}>
                        <Icon name="arrow-left-right" size={14} /> Traspasar entre Bodegas
                      </button>
                      <button style={styles.primaryBtn} onClick={() => setProductModalState("new")}>
                        <Icon name="plus" size={14} /> Nuevo Artículo
                      </button>
                    </div>
                  )}
                </div>
                <div style={styles.dashGrid}>
                  {locations.map(loc => (
                    <div key={loc.id} style={styles.panel}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
                        <Icon name="building-2" size={18} color="#34D399" />
                        <h3 style={{ color: "#F1F5F9", margin: 0, fontSize: 16 }}>{loc.name}</h3>
                      </div>
                      {products.map(p => (
                        <div key={p.id} style={styles.listRow}>
                          <span style={{ color: "#CBD5E1" }}>{p.name}</span>
                          <strong style={{ color: "#38BDF8" }}>{p.stockByLocation?.[loc.id] || 0} un.</strong>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === "ventas" && canAccessSales && (
              <div>
                <div style={styles.pageHeader}>
                  <div>
                    <div style={styles.eyebrow}>PUNTO DE VENTA & CAJA</div>
                    <h2 style={styles.pageTitle}>Registro de Ventas Comerciales</h2>
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <Icon name="calendar" size={15} color="#38BDF8" />
                      <select
                        style={styles.filterSelect}
                        value={salesMonthFilter}
                        onChange={e => setSalesMonthFilter(e.target.value)}
                      >
                        <option value="">Todos los meses</option>
                        {salesAvailableMonths.map(ym => (
                          <option key={ym} value={ym}>{formatMonthLabel(ym)}</option>
                        ))}
                      </select>
                    </div>

                    <button style={styles.sheetsExportBtn} onClick={handleExportBusinessFinances} title="Exportar ventas a Google Sheets">
                      <Icon name="file-spreadsheet" size={14} color="#34D399" /> Exportar Sheets
                    </button>
                    <button style={styles.primaryBtn} onClick={() => setSaleModalState("new")}>
                      <Icon name="plus" size={14} /> Registrar Venta
                    </button>
                  </div>
                </div>

                {salesMonthFilter && (
                  <div style={styles.filterBanner}>
                    <Icon name="filter" size={14} color="#38BDF8" />
                    <span>Filtrando por: <strong>{formatMonthLabel(salesMonthFilter)}</strong> — Total vendido en el mes: <strong style={{ color: "#34D399" }}>{money(filteredSalesTotal)}</strong></span>
                    <button style={styles.clearFilterBtn} onClick={() => setSalesMonthFilter("")}>Mostrar todo</button>
                  </div>
                )}

                <div style={styles.panel}>
                  <table style={styles.table}>
                    <thead>
                      <tr style={styles.tableHeaderRow}>
                        <th style={{ padding: "12px 10px" }}>Fecha</th>
                        <th>Cliente</th>
                        <th>Detalle / Concepto</th>
                        <th>Medio de Pago</th>
                        <th>Total</th>
                        <th style={{ textAlign: "right", paddingRight: 10 }}>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredSales.length === 0 ? (
                        <tr>
                          <td colSpan="6" style={{ padding: 24, textAlign: "center", color: "#64748B" }}>
                            {salesMonthFilter ? `No hay ventas registradas en ${formatMonthLabel(salesMonthFilter)}.` : "No hay ventas registradas."}
                          </td>
                        </tr>
                      ) : (
                        filteredSales.map(s => (
                          <tr key={s.id} style={styles.tableRow}>
                            <td style={{ padding: 10, color: "#94A3B8" }}>{s.date}</td>
                            <td style={{ fontWeight: 600, color: "#F8FAFC" }}>{s.customerName}</td>
                            <td style={{ color: "#94A3B8" }}>{s.details || "Venta general"}</td>
                            <td><span style={styles.badgeGray}>{s.paymentMethod}</span></td>
                            <td style={{ color: "#34D399", fontWeight: 700 }}>{money(s.total)}</td>
                            <td style={{ textAlign: "right", paddingRight: 10 }}>
                              <button style={styles.actionIconBtn} onClick={() => setSaleModalState(s)} title="Modificar">
                                <Icon name="pencil" size={14} color="#38BDF8" />
                              </button>
                              {activePerms.canDeleteRecords && (
                                <button style={styles.actionIconBtn} onClick={() => handleDeleteSale(s.id)} title="Eliminar">
                                  <Icon name="trash-2" size={14} color="#F87171" />
                                </button>
                              )}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {tab === "clientes" && canAccessCustomers && (
              <ClientesManager
                customers={customers}
                sales={sales}
                onNew={() => setCustomerModalState("new")}
                onEdit={(c) => setCustomerModalState(c)}
                onDelete={handleDeleteCustomer}
              />
            )}

            {tab === "gastos" && canAccessFinances && (
              <GastosManager
                expenses={expenses}
                totalExpenses={totalExpenses}
                onNew={() => setExpenseModalState("new")}
                onEdit={(e) => setExpenseModalState(e)}
                onDelete={handleDeleteExpense}
                onExport={handleExportBusinessFinances}
              />
            )}

            {tab === "usuarios" && (role === "Administrador") && (
              <UsersManager
                users={users}
                rolePermissions={rolePermissions}
                setRolePermissions={(newPerms) => {
                  setRolePermissions(newPerms);
                  registerAudit("Permisos Actualizados", "Se actualizaron los permisos de rol");
                  notify("Permisos actualizados");
                }}
                auditLog={auditLog}
                onAddUser={async (u) => {
                  setUsers(prev => [...prev, u]);
                  registerAudit("Usuario Creado", `${u.name} (${u.role})`);
                  notify("Usuario agregado");
                  if (supabase) await supabase.from("usuarios").insert([u]);
                }}
              />
            )}
          </main>

          {/* MODALES */}
          {productModalState && (
            <ProductModal
              product={productModalState === "new" ? null : productModalState}
              locations={locations}
              onClose={() => setProductModalState(null)}
              onSave={handleSaveProduct}
            />
          )}

          {transferModalOpen && (
            <TransferModal
              products={products}
              locations={locations}
              onClose={() => setTransferModalOpen(false)}
              onTransfer={handleTransferStock}
            />
          )}

          {saleModalState && (
            <SaleModal
              sale={saleModalState === "new" ? null : saleModalState}
              customers={customers}
              products={products}
              locations={locations}
              onClose={() => setSaleModalState(null)}
              onSave={handleSaveSale}
            />
          )}

          {expenseModalState && (
            <ExpenseModal
              expense={expenseModalState === "new" ? null : expenseModalState}
              onClose={() => setExpenseModalState(null)}
              onSave={handleSaveExpense}
            />
          )}

          {customerModalState && (
            <CustomerModal
              customer={customerModalState === "new" ? null : customerModalState}
              onClose={() => setCustomerModalState(null)}
              onSave={handleSaveCustomer}
            />
          )}

          {personalModalState && (
            <PersonalFinanceModal
              item={personalModalState === "new" ? null : personalModalState}
              onClose={() => setPersonalModalState(null)}
              onSave={handleSavePersonalFinance}
            />
          )}
        </div>
      );
    }

    // ============ MODAL DE TRASPASO ENTRE BODEGAS ============
    function TransferModal({ products, locations, onClose, onTransfer }) {
      const [productId, setProductId] = useState(products[0]?.id || "");
      const [fromLocId, setFromLocId] = useState(locations[0]?.id || "loc-central");
      const [toLocId, setToLocId] = useState(locations[1]?.id || "loc-tienda");
      const [qty, setQty] = useState(1);

      const selectedProd = products.find(p => p.id === productId);
      const availableInOrigin = Number(selectedProd?.stockByLocation?.[fromLocId] || 0);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (fromLocId === toLocId) {
          alert("Selecciona una bodega de destino distinta a la de origen.");
          return;
        }
        onTransfer({ productId, fromLocId, toLocId, qty: Number(qty) });
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.glassModal} onClick={e => e.stopPropagation()}>
            <h3 style={styles.modalTitle}>Traspasar Mercadería entre Bodegas 🚚</h3>
            <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <label style={styles.inputLabel}>Producto</label>
                <select style={styles.glassInput} value={productId} onChange={e => setProductId(e.target.value)}>
                  {products.map(p => <option key={p.id} value={p.id}>{p.name} ({p.sku})</option>)}
                </select>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>Desde Origen</label>
                  <select style={styles.glassInput} value={fromLocId} onChange={e => setFromLocId(e.target.value)}>
                    {locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                  </select>
                </div>
                <div>
                  <label style={styles.inputLabel}>Hacia Destino</label>
                  <select style={styles.glassInput} value={toLocId} onChange={e => setToLocId(e.target.value)}>
                    {locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label style={styles.inputLabel}>Cantidad (Disponible en origen: {availableInOrigin} un.)</label>
                <input style={styles.glassInput} type="number" min="1" max={Math.max(1, availableInOrigin)} value={qty} onChange={e => setQty(e.target.value)} required />
              </div>
              <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 }}>
                <button type="button" style={styles.secondaryBtn} onClick={onClose}>Cancelar</button>
                <button type="submit" style={styles.amberBtn} disabled={availableInOrigin <= 0}>Traspasar</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============ MODAL DE PRODUCTO / INVENTARIO ============
    function ProductModal({ product, locations, onClose, onSave }) {
      const [name, setName] = useState(product?.name || "");
      const [category, setCategory] = useState(product?.category || PRODUCT_CATEGORIES[0]);
      const [sku, setSku] = useState(product?.sku || "");
      const [barcode, setBarcode] = useState(product?.barcode || "");
      const [costPrice, setCostPrice] = useState(product?.costPrice || 0);
      const [salePrice, setSalePrice] = useState(product?.salePrice || 0);
      const [minStock, setMinStock] = useState(product?.minStock || 3);

      const [stockByLocation, setStockByLocation] = useState(() => {
        const map = {};
        locations.forEach(loc => {
          map[loc.id] = product?.stockByLocation?.[loc.id] !== undefined ? product.stockByLocation[loc.id] : 0;
        });
        return map;
      });

      const handleStockChange = (locId, value) => {
        setStockByLocation(prev => ({
          ...prev,
          [locId]: Number(value) >= 0 ? Number(value) : 0
        }));
      };

      const generateAutoSKU = () => {
        const catPart = (category || "ALM").slice(0, 3).toUpperCase();
        const namePart = (name || "PRD").replace(/[^a-zA-Z0-9]/g, "").slice(0, 3).toUpperCase() || "PRD";
        setSku(`${catPart}-${namePart}-${String(Date.now()).slice(-3)}`);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          name: sanitizeText(name),
          category,
          sku: sanitizeText(sku) || `SKU-${Date.now().toString().slice(-4)}`,
          barcode: sanitizeText(barcode),
          costPrice: Number(costPrice) || 0,
          salePrice: Number(salePrice) || 0,
          minStock: Number(minStock) || 0,
          stockByLocation
        });
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.glassModal} onClick={e => e.stopPropagation()}>
            <h3 style={styles.modalTitle}>
              {product ? "Modificar Ficha de Producto" : "Nuevo Producto en Inventario 📦"}
            </h3>
            <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 11 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>Nombre del Producto</label>
                  <input style={styles.glassInput} value={name} onChange={e => setName(e.target.value)} placeholder="Ej: Polera Oversize" required />
                </div>
                <div>
                  <label style={styles.inputLabel}>Categoría</label>
                  <select style={styles.glassInput} value={category} onChange={e => setCategory(e.target.value)}>
                    {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>SKU / Código Referencia</label>
                  <div style={{ display: "flex", gap: 6 }}>
                    <input style={styles.glassInput} value={sku} onChange={e => setSku(e.target.value)} placeholder="Ej: ROP-POL-101" />
                    <button type="button" style={styles.smallGlassBtn} onClick={generateAutoSKU}>Auto</button>
                  </div>
                </div>
                <div>
                  <label style={styles.inputLabel}>Código de Barras (Opcional)</label>
                  <input style={styles.glassInput} value={barcode} onChange={e => setBarcode(e.target.value)} placeholder="Ej: 7801001" />
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>Costo Unitario ($)</label>
                  <input style={styles.glassInput} type="number" min="0" value={costPrice} onChange={e => setCostPrice(e.target.value)} required />
                </div>
                <div>
                  <label style={styles.inputLabel}>Precio Venta ($)</label>
                  <input style={styles.glassInput} type="number" min="0" value={salePrice} onChange={e => setSalePrice(e.target.value)} required />
                </div>
                <div>
                  <label style={styles.inputLabel}>Stock Mínimo</label>
                  <input style={styles.glassInput} type="number" min="0" value={minStock} onChange={e => setMinStock(e.target.value)} required />
                </div>
              </div>

              <div style={{ background: "rgba(255, 255, 255, 0.02)", padding: "10px 12px", borderRadius: 10, border: "1px solid rgba(255, 255, 255, 0.08)", marginTop: 4 }}>
                <span style={{ fontSize: 11.5, color: "#38BDF8", fontWeight: 600, display: "block", marginBottom: 8 }}>
                  Distribución de Existencias por Bodega:
                </span>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {locations.map(loc => (
                    <div key={loc.id}>
                      <label style={{ ...styles.inputLabel, fontSize: 11, color: "#CBD5E1" }}>{loc.name}</label>
                      <input
                        style={styles.glassInput}
                        type="number"
                        min="0"
                        value={stockByLocation[loc.id] || 0}
                        onChange={e => handleStockChange(loc.id, e.target.value)}
                      />
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 }}>
                <button type="button" style={styles.secondaryBtn} onClick={onClose}>Cancelar</button>
                <button type="submit" style={styles.primaryBtn}>{product ? "Guardar Cambios" : "Guardar Producto"}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============ DASHBOARD CON PROYECCIÓN DE GANANCIAS ============
    function Dashboard({
      currentUser, canAccessSales, canAccessPersonal, canViewCosts, sales, expenses, products, lowStock, locations, customers,
      totalSales, totalExpenses, profit, personalFinances, personalIncome, personalExpense, personalBalance,
      onNewSale, onNewPersonal, onGoToPersonal, onGoToInventory, onExportBusiness, onExportPersonal
    }) {
      const [selectedProdFilter, setSelectedProdFilter] = useState("all");

      const trendCanvasRef = useRef(null);
      const expenseCanvasRef = useRef(null);
      const projectionCanvasRef = useRef(null);
      const chartRefs = useRef({ trend: null, expense: null, projection: null });

      const last7Days = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          days.push(d.toISOString().slice(0, 10));
        }
        return days;
      }, []);

      const salesByDay = useMemo(() => {
        return last7Days.map(day => sales.filter(s => s.date === day).reduce((a, s) => a + Number(s.total || 0), 0));
      }, [sales, last7Days]);

      const expensesByDay = useMemo(() => {
        return last7Days.map(day => expenses.filter(e => e.date === day).reduce((a, e) => a + Number(e.amount || 0), 0));
      }, [expenses, last7Days]);

      const expensesByCategory = useMemo(() => {
        const map = {};
        expenses.forEach(e => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
        return map;
      }, [expenses]);

      const inventoryProjection = useMemo(() => {
        if (selectedProdFilter === "all") {
          let totalCost = 0;
          let totalRevenue = 0;
          let totalUnits = 0;

          const itemBreakdown = products.map(p => {
            const stock = getProductTotalStock(p);
            const cost = (Number(p.costPrice) || 0) * stock;
            const revenue = (Number(p.salePrice) || 0) * stock;
            const profitVal = revenue - cost;
            totalCost += cost;
            totalRevenue += revenue;
            totalUnits += stock;
            return {
              id: p.id,
              name: p.name,
              sku: p.sku,
              stock,
              cost,
              revenue,
              profit: profitVal,
              unitCost: Number(p.costPrice) || 0,
              unitSale: Number(p.salePrice) || 0,
              unitProfit: (Number(p.salePrice) || 0) - (Number(p.costPrice) || 0)
            };
          });

          const totalProfit = totalRevenue - totalCost;
          const margin = totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0;
          return { isAll: true, totalCost, totalRevenue, totalProfit, totalUnits, margin, itemBreakdown };
        } else {
          const p = products.find(x => x.id === selectedProdFilter);
          if (!p) return null;
          const stock = getProductTotalStock(p);
          const cost = (Number(p.costPrice) || 0) * stock;
          const revenue = (Number(p.salePrice) || 0) * stock;
          const profitVal = revenue - cost;
          const unitCost = Number(p.costPrice) || 0;
          const unitSale = Number(p.salePrice) || 0;
          const unitProfit = unitSale - unitCost;
          const margin = revenue > 0 ? (profitVal / revenue) * 100 : 0;
          return { isAll: false, product: p, stock, cost, revenue, profit: profitVal, unitCost, unitSale, unitProfit, margin };
        }
      }, [products, selectedProdFilter]);

      useEffect(() => {
        if (!window.Chart) return;

        if (chartRefs.current.trend) chartRefs.current.trend.destroy();
        if (trendCanvasRef.current) {
          chartRefs.current.trend = new window.Chart(trendCanvasRef.current, {
            type: "line",
            data: {
              labels: last7Days.map(d => d.slice(5)),
              datasets: [
                {
                  label: "Ventas Negocio",
                  data: salesByDay,
                  borderColor: "#34D399",
                  backgroundColor: "rgba(52, 211, 153, 0.15)",
                  borderWidth: 2.5,
                  tension: 0.35,
                  fill: true
                },
                {
                  label: "Gastos Negocio",
                  data: expensesByDay,
                  borderColor: "#F87171",
                  backgroundColor: "rgba(248, 113, 113, 0.1)",
                  borderWidth: 2,
                  tension: 0.35,
                  fill: true
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: "#CBD5E1", font: { size: 11 } } } },
              scales: {
                x: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } },
                y: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } }
              }
            }
          });
        }

        if (chartRefs.current.expense) chartRefs.current.expense.destroy();
        if (expenseCanvasRef.current) {
          const labels = Object.keys(expensesByCategory);
          const data = Object.values(expensesByCategory);
          chartRefs.current.expense = new window.Chart(expenseCanvasRef.current, {
            type: "doughnut",
            data: {
              labels: labels.length ? labels : ["Sin gastos"],
              datasets: [{
                data: data.length ? data : [1],
                backgroundColor: ["#10B981", "#38BDF8", "#F87171", "#FBBF24", "#A78BFA", "#EC4899", "#64748B"],
                borderWidth: 1,
                borderColor: "rgba(255,255,255,0.1)"
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: "bottom", labels: { color: "#CBD5E1", font: { size: 10 }, boxWidth: 10 } } }
            }
          });
        }

        if (chartRefs.current.projection) chartRefs.current.projection.destroy();
        if (projectionCanvasRef.current && inventoryProjection && canViewCosts) {
          if (inventoryProjection.isAll) {
            const topItems = inventoryProjection.itemBreakdown.slice(0, 8);
            chartRefs.current.projection = new window.Chart(projectionCanvasRef.current, {
              type: "bar",
              data: {
                labels: topItems.map(i => i.name.length > 14 ? i.name.slice(0, 14) + "…" : i.name),
                datasets: [
                  {
                    label: "Costo Invertido ($)",
                    data: topItems.map(i => i.cost),
                    backgroundColor: "rgba(248, 113, 113, 0.75)",
                    borderRadius: 5
                  },
                  {
                    label: "Ganancia Neta Posible ($)",
                    data: topItems.map(i => i.profit),
                    backgroundColor: "rgba(52, 211, 153, 0.85)",
                    borderRadius: 5
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { labels: { color: "#CBD5E1", font: { size: 11 } } },
                  tooltip: {
                    callbacks: {
                      label: function(context) {
                        return `${context.dataset.label}: ${money(context.raw)}`;
                      }
                    }
                  }
                },
                scales: {
                  x: { ticks: { color: "#94A3B8", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } },
                  y: { ticks: { color: "#94A3B8", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } }
                }
              }
            });
          } else {
            chartRefs.current.projection = new window.Chart(projectionCanvasRef.current, {
              type: "bar",
              data: {
                labels: ["Por Unidad", `Total (${inventoryProjection.stock} un.)`],
                datasets: [
                  {
                    label: "Costo ($)",
                    data: [inventoryProjection.unitCost, inventoryProjection.cost],
                    backgroundColor: "rgba(248, 113, 113, 0.75)",
                    borderRadius: 6
                  },
                  {
                    label: "Ganancia Neta ($)",
                    data: [inventoryProjection.unitProfit, inventoryProjection.profit],
                    backgroundColor: "rgba(52, 211, 153, 0.85)",
                    borderRadius: 6
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { labels: { color: "#CBD5E1", font: { size: 11 } } },
                  tooltip: {
                    callbacks: {
                      label: function(context) {
                        return `${context.dataset.label}: ${money(context.raw)}`;
                      }
                    }
                  }
                },
                scales: {
                  x: { ticks: { color: "#F8FAFC", font: { size: 11 } }, grid: { display: false } },
                  y: { ticks: { color: "#94A3B8", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } }
                }
              }
            });
          }
        }

        return () => {
          if (chartRefs.current.trend) chartRefs.current.trend.destroy();
          if (chartRefs.current.expense) chartRefs.current.expense.destroy();
          if (chartRefs.current.projection) chartRefs.current.projection.destroy();
        };
      }, [salesByDay, expensesByDay, expensesByCategory, last7Days, inventoryProjection, canViewCosts]);

      return (
        <div>
          <div style={styles.pageHeader}>
            <div>
              <div style={styles.eyebrow}>RESUMEN INTEGRAL & CONTROL</div>
              <h2 style={styles.pageTitle}>Bienvenido, {currentUser.name} ✨</h2>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              {canAccessPersonal && (
                <button style={styles.purpleBtn} onClick={onNewPersonal}>
                  <Icon name="plus" size={14} /> Movimiento Personal
                </button>
              )}
              {canAccessSales && (
                <button style={styles.primaryBtn} onClick={onNewSale}>
                  <Icon name="shopping-bag" size={14} /> Registrar Venta
                </button>
              )}
            </div>
          </div>

          {lowStock.length > 0 && (
            <div style={styles.warehouseAlertBanner}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Icon name="alert-triangle" size={18} color="#FBBF24" />
                <div>
                  <strong style={{ color: "#FEF3C7", fontSize: 13 }}>
                    Alerta de Estantería: {lowStock.length} {lowStock.length === 1 ? "producto requiere" : "productos requieren"} reposición
                  </strong>
                  <div style={{ fontSize: 11.5, color: "#FDE68A" }}>
                    {lowStock.map(p => `${p.name} (${getProductTotalStock(p)} un.)`).join(" • ")}
                  </div>
                </div>
              </div>
              <button style={styles.amberBtn} onClick={onGoToInventory}>Revisar Inventario</button>
            </div>
          )}

          {/* SECCIÓN 1: FINANZAS DEL NEGOCIO */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <div style={styles.sectionHeader}>
              <Icon name="briefcase" size={17} color="#34D399" />
              <span style={styles.sectionTitle}>Finanzas & Operación del Negocio</span>
            </div>
            <button style={styles.sheetsExportBtn} onClick={onExportBusiness}>
              <Icon name="file-spreadsheet" size={14} color="#34D399" /> Exportar a Sheets
            </button>
          </div>

          <div style={styles.kpiGrid}>
            <div style={styles.kpiCard}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Ventas del Negocio</span>
                <Icon name="trending-up" size={15} color="#34D399" />
              </div>
              <div style={{ ...styles.kpiValue, color: "#34D399" }}>{money(totalSales)}</div>
              <span style={styles.kpiSub}>Ingresos totales en ventas</span>
            </div>

            <div style={styles.kpiCard}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Gastos Operativos</span>

    // ============ MÓDULO PERSONAL CON FILTRO POR MES ============
    function PersonalFinancesManager({ personalFinances, onNew, onEdit, onDelete, onExport }) {
      const [selectedMonth, setSelectedMonth] = useState("");

      const availableMonths = useMemo(() => {
        const currentYM = new Date().toISOString().slice(0, 7);
        const monthsSet = new Set(personalFinances.map(p => (p.date || "").slice(0, 7)).filter(Boolean));
        monthsSet.add(currentYM);
        return Array.from(monthsSet).sort().reverse();
      }, [personalFinances]);

      const filteredFinances = useMemo(() => {
        if (!selectedMonth) return personalFinances;
        return personalFinances.filter(p => (p.date || "").startsWith(selectedMonth));
      }, [personalFinances, selectedMonth]);

      const periodIncome = useMemo(() => {
        return filteredFinances.filter(f => f.type === "ingreso").reduce((a, b) => a + Number(b.amount || 0), 0);
      }, [filteredFinances]);

      const periodExpense = useMemo(() => {
        return filteredFinances.filter(f => f.type === "gasto").reduce((a, b) => a + Number(b.amount || 0), 0);
      }, [filteredFinances]);

      const periodBalance = periodIncome - periodExpense;
      const currentPeriodLabel = selectedMonth ? formatMonthLabel(selectedMonth) : "Historial Completo";

      return (
        <div>
          <div style={styles.pageHeader}>
            <div>
              <div style={{ ...styles.eyebrow, color: "#C084FC" }}>GESTIÓN INDEPENDIENTE</div>
              <h2 style={styles.pageTitle}>Mi Espacio & Finanzas Personales 💳</h2>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <Icon name="calendar" size={15} color="#C084FC" />
                <select
                  style={{ ...styles.filterSelect, borderColor: "rgba(168, 85, 247, 0.3)" }}
                  value={selectedMonth}
                  onChange={e => setSelectedMonth(e.target.value)}
                >
                  <option value="">Todos los meses</option>
                  {availableMonths.map(ym => (
                    <option key={ym} value={ym}>{formatMonthLabel(ym)}</option>
                  ))}
                </select>
              </div>

              <button style={styles.purpleExportBtn} onClick={() => onExport(filteredFinances, currentPeriodLabel, periodIncome, periodExpense, periodBalance)}>
                <Icon name="file-spreadsheet" size={14} color="#C084FC" /> Exportar a Google Sheets
              </button>
              <button style={styles.purpleBtn} onClick={onNew}>
                <Icon name="plus" size={14} /> Registrar Movimiento
              </button>
            </div>
          </div>

          {selectedMonth && (
            <div style={{ ...styles.filterBanner, borderColor: "rgba(168, 85, 247, 0.3)", background: "rgba(168, 85, 247, 0.08)" }}>
              <Icon name="filter" size={14} color="#C084FC" />
              <span style={{ color: "#E9D5FF" }}>
                Visualizando datos de: <strong>{formatMonthLabel(selectedMonth)}</strong>
              </span>
              <button style={{ ...styles.clearFilterBtn, color: "#C084FC" }} onClick={() => setSelectedMonth("")}>Ver todo el historial</button>
            </div>
          )}

          <div style={styles.kpiGrid}>
            <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.25)" }}>
              <span style={styles.kpiLabel}>
                {selectedMonth ? `Ingresos (${formatMonthLabel(selectedMonth)})` : "Ingresos Registrados"}
              </span>
              <div style={{ ...styles.kpiValue, color: "#34D399" }}>{money(periodIncome)}</div>
            </div>
            <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.25)" }}>
              <span style={styles.kpiLabel}>
                {selectedMonth ? `Gastos (${formatMonthLabel(selectedMonth)})` : "Gastos Registrados"}
              </span>
              <div style={{ ...styles.kpiValue, color: "#F87171" }}>{money(periodExpense)}</div>
            </div>
            <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.35)", background: "rgba(168, 85, 247, 0.08)" }}>
              <span style={styles.kpiLabel}>
                {selectedMonth ? `Saldo del Mes` : "Saldo Personal Neto"}
              </span>
              <div style={{ ...styles.kpiValue, color: periodBalance >= 0 ? "#C084FC" : "#F87171" }}>{money(periodBalance)}</div>
            </div>
            <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.25)" }}>
              <span style={styles.kpiLabel}>Movimientos del Período</span>
              <div style={{ ...styles.kpiValue, color: "#F1F5F9" }}>{filteredFinances.length}</div>
            </div>
          </div>

          <div style={styles.panel}>
            <table style={styles.table}>
              <thead>
                <tr style={styles.tableHeaderRow}>
                  <th style={{ padding: "12px 10px" }}>Fecha</th>
                  <th>Tipo</th>
                  <th>Categoría</th>
                  <th>Descripción</th>
                  <th>Monto</th>
                  <th style={{ textAlign: "right", paddingRight: 10 }}>Acciones</th>
                </tr>
              </thead>
              <tbody>
                {filteredFinances.length === 0 ? (
                  <tr>
                    <td colSpan="6" style={{ padding: 24, textAlign: "center", color: "#64748B" }}>
                      {selectedMonth ? `No hay movimientos personales registrados en ${formatMonthLabel(selectedMonth)}.` : "Aún no tienes movimientos personales registrados."}
                    </td>
                  </tr>
                ) : (
                  filteredFinances.map(item => (
                    <tr key={item.id} style={styles.tableRow}>
                      <td style={{ padding: 10, color: "#94A3B8" }}>{item.date}</td>
                      <td>
                        <span style={item.type === "ingreso" ? styles.badgeGreen : styles.badgeRed}>
                          {item.type === "ingreso" ? "Ingreso" : "Gasto"}
                        </span>
                      </td>
                      <td style={{ color: "#E2E8F0" }}>{item.category}</td>
                      <td style={{ color: "#94A3B8" }}>{item.description || "-"}</td>
                      <td style={{ fontWeight: 700, color: item.type === "ingreso" ? "#34D399" : "#F87171" }}>
                        {item.type === "ingreso" ? "+" : "-"}{money(item.amount)}
                      </td>
                      <td style={{ textAlign: "right", paddingRight: 10 }}>
                        <button style={styles.actionIconBtn} onClick={() => onEdit(item)} title="Editar">
                          <Icon name="pencil" size={14} color="#C084FC" />
                        </button>
                        <button style={styles.actionIconBtn} onClick={() => onDelete(item.id)} title="Eliminar">
                          <Icon name="trash-2" size={14} color="#F87171" />
                        </button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ============ CLIENTES ============
    function ClientesManager({ customers, sales, onNew, onEdit, onDelete }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      const customerStats = useMemo(() => {
        return customers.map(c => {
          const customerSales = sales.filter(s => (s.customerName || "").toLowerCase() === (c.name || "").toLowerCase());
          const totalSpent = customerSales.reduce((a, s) => a + Number(s.total || 0), 0);
          const lastPurchase = customerSales.length ? customerSales.map(s => s.date).sort().reverse()[0] : null;
          return { ...c, purchaseCount: customerSales.length, totalSpent, lastPurchase };
        }).sort((a, b) => b.totalSpent - a.totalSpent);
      }, [customers, sales]);

      useEffect(() => {
        if (!window.Chart) return;
        if (chartRef.current) chartRef.current.destroy();
        if (canvasRef.current) {
          const top = customerStats.slice(0, 6);
          chartRef.current = new window.Chart(canvasRef.current, {
            type: "bar",
            data: {
              labels: top.map(c => c.name),
              datasets: [{
                label: "Total comprado",
                data: top.map(c => c.totalSpent),
                backgroundColor: "rgba(52, 211, 153, 0.75)",
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              indexAxis: "y",
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } },
                y: { ticks: { color: "#E2E8F0", font: { size: 11 } }, grid: { display: false } }
              }
            }
          });
        }
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [customerStats]);

      return (
        <div>
          <div style={styles.pageHeader}>
            <div>
              <div style={styles.eyebrow}>CRM & CARTERA</div>
              <h2 style={styles.pageTitle}>Fichas de Clientes e Historial de Compra</h2>
            </div>
            <button style={styles.primaryBtn} onClick={onNew}>
              <Icon name="user-plus" size={14} /> Agregar Cliente
            </button>
          </div>

          <div style={styles.panel}>
            <h3 style={styles.panelTitle}>Top Clientes por Monto Comprado</h3>
            <div style={{ height: 210 }}>
              <canvas ref={canvasRef}></canvas>
            </div>
          </div>

          <div style={{ ...styles.panel, marginTop: 16 }}>
            <table style={styles.table}>
              <thead>
                <tr style={styles.tableHeaderRow}>
                  <th style={{ padding: "12px 10px" }}>Nombre</th>
                  <th>Teléfono</th>
                  <th>N° Compras</th>
                  <th>Total Comprado</th>
                  <th>Última Compra</th>
                  <th style={{ textAlign: "right", paddingRight: 10 }}>Acciones</th>
                </tr>
              </thead>
              <tbody>
                {customerStats.length === 0 ? (
                  <tr>
                    <td colSpan="6" style={{ padding: 24, textAlign: "center", color: "#64748B" }}>
                      No hay clientes registrados todavía.
                    </td>
                  </tr>
                ) : (
                  customerStats.map(c => (
                    <tr key={c.id} style={styles.tableRow}>
                      <td style={{ padding: 10, fontWeight: 600, color: "#F8FAFC" }}>{c.name}</td>
                      <td style={{ color: "#94A3B8" }}>{c.phone || "-"}</td>
                      <td><span style={styles.badgeGray}>{c.purchaseCount} ped.</span></td>
                      <td style={{ color: "#34D399", fontWeight: 700 }}>{money(c.totalSpent)}</td>
                      <td style={{ color: "#94A3B8" }}>{c.lastPurchase || "-"}</td>
                      <td style={{ textAlign: "right", paddingRight: 10 }}>
                        <button style={styles.actionIconBtn} onClick={() => onEdit(c)} title="Modificar">
                          <Icon name="pencil" size={14} color="#38BDF8" />
                        </button>

    function SaleModal({ sale, customers, products, locations, onClose, onSave }) {
      const [customerName, setCustomerName] = useState(sale?.customerName || "");

      const [paymentMethod, setPaymentMethod] = useState(sale?.paymentMethod || "Efectivo");

      const [date, setDate] = useState(sale?.date || new Date().toISOString().slice(0, 10));

      const [selectedProductId, setSelectedProductId] = useState("");
      const [selectedQty, setSelectedQty] = useState(1);
      const [selectedLocId, setSelectedLocId] = useState(locations[1]?.id || "loc-tienda");

      const handleQuickSelectProduct = (prodId, qtyVal) => {
        setSelectedProductId(prodId);
        const prod = products.find(p => p.id === prodId);
        if (prod) {
          const q = Math.max(1, Number(qtyVal) || 1);
          setDetails(`${q}x ${prod.name}`);
          setTotal((Number(prod.salePrice) || 0) * q);
        }
      };

        const deduction = !sale && selectedProductId
          ? { productId: selectedProductId, qty: Number(selectedQty) || 1, locationId: selectedLocId }
          : null;
        onSave(
          { customerName: sanitizeText(customerName), details: sanitizeText(details), paymentMethod, total: Number(total), date },

        <div style={styles.overlay} onClick={onClose}>

                    <input
                      style={styles.glassInput}

                      min="1"

                      onChange={e => {

                        if (selectedProductId) handleQuickSelectProduct(selectedProductId, e.target.value);
                      }}
                    />
                    <select style={styles.glassInput} value={selectedLocId} onChange={e => setSelectedLocId(e.target.value)}>
                      {locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}

                  </div>

              <div>
                <label style={styles.inputLabel}>Cliente</label>
