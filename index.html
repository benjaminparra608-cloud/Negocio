    function CreditCardConfigModal({ creditCardSummary, onClose, onSave }) {
      const [cardName, setCardName] = useState(creditCardSummary?.cardName || "Tarjeta de Crédito Principal");
      const [totalLimit, setTotalLimit] = useState(creditCardSummary?.totalLimit ?? 1000000);
      const [availableInput, setAvailableInput] = useState(creditCardSummary?.availableCredit ?? 1000000);
      const [paymentDay, setPaymentDay] = useState(creditCardSummary?.paymentDay ?? 5);
      const [billingDay, setBillingDay] = useState(creditCardSummary?.billingDay ?? 25);

      const handleTotalLimitChange = (val) => {
        const nextTotal = Math.max(0, Number(val) || 0);
        const currentUsed = Math.max(0, Number(totalLimit || 0) - Number(availableInput || 0));
        setTotalLimit(val);
        setAvailableInput(Math.max(0, nextTotal - currentUsed));
      };

      const computedUsed = Math.max(0, (Number(totalLimit) || 0) - (Number(availableInput) || 0));

      const handleSubmit = (e) => {
        e.preventDefault();
        const cleanLimit = Math.max(0, Number(totalLimit) || 0);
        const cleanAvail = Math.min(cleanLimit, Math.max(0, Number(availableInput) || 0));
        const targetUsed = Math.max(0, cleanLimit - cleanAvail);
        const netMovementsUsed = (Number(creditCardSummary?.usedFromPurchases) || 0) - (Number(creditCardSummary?.freedFromPayments) || 0);
        const calibratedBaseUsed = targetUsed - netMovementsUsed;

        onSave({
          cardName: sanitizeText(cardName) || "Tarjeta de Crédito Principal",
          totalLimit: cleanLimit,
          baseUsed: calibratedBaseUsed,
          paymentDay: Math.min(31, Math.max(1, Number(paymentDay) || 5)),
          billingDay: Math.min(31, Math.max(1, Number(billingDay) || 25))
        });
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div className="responsive-modal" style={styles.glassModal} onClick={e => e.stopPropagation()}>
            <h3 style={{ ...styles.modalTitle, color: "#FDE68A", display: "flex", alignItems: "center", gap: 8 }}>
              <Icon name="credit-card" size={19} color="#FBBF24" />
              <span>Configurar Cupo y Días de Pago • Tarjeta de Crédito</span>
            </h3>
            <p style={{ color: "#CBD5E1", fontSize: 12.5, marginTop: -8, marginBottom: 14 }}>
              Ajusta tu cupo total, el cupo disponible que te queda hoy y el día de pago mensual. Cada compra o abono actualizará este saldo automáticamente en todos tus dispositivos.
            </p>

            <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <label style={styles.inputLabel}>Nombre / Banco de la Tarjeta</label>
                <input
                  style={styles.glassInput}
                  value={cardName}
                  onChange={e => setCardName(e.target.value)}
                  placeholder="Ej: Visa Banco de Chile / CMR / Santander"
                  required
                />
              </div>

              <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <label style={{ ...styles.inputLabel, color: "#FDE68A" }}>Cupo Total de la Tarjeta ($)</label>
                  <input
                    style={styles.glassInput}
                    type="number"
                    min="0"
                    value={totalLimit}
                    onChange={e => handleTotalLimitChange(e.target.value)}
                    required
                  />
                </div>
                <div>
                  <label style={{ ...styles.inputLabel, color: "#6EE7B7" }}>Cupo Disponible Actual ($)</label>
                  <input
                    style={styles.glassInput}
                    type="number"
                    min="0"
                    max={Math.max(0, Number(totalLimit) || 0)}
                    value={availableInput}
                    onChange={e => setAvailableInput(e.target.value)}
                    required
                  />
                </div>
              </div>

              <div style={{
                background: "rgba(15, 23, 42, 0.65)",
                border: "1px solid rgba(251, 191, 36, 0.3)",
                borderRadius: 10,
                padding: "10px 14px",
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                flexWrap: "wrap",
                gap: 8,
                fontSize: 12.5
              }}>
                <span style={{ color: "#CBD5E1" }}>
                  Cupo Utilizado / Deuda Calculada: <strong style={{ color: "#F87171" }}>{money(computedUsed)}</strong>
                </span>
                <span style={{ color: "#34D399", fontWeight: 700 }}>
                  Cupo Disponible: {money(availableInput)}
                </span>
              </div>

              <div className="responsive-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <label style={styles.inputLabel}>Día de Pago Mensual (1 al 31)</label>
                  <input
                    style={styles.glassInput}
                    type="number"
                    min="1"
                    max="31"
                    value={paymentDay}
                    onChange={e => setPaymentDay(e.target.value)}
                    required
                  />
                  <span style={{ fontSize: 10.5, color: "#94A3B8", display: "block", marginTop: 3 }}>
                    Día límite para pagar cada mes

    function AuthScreen({ onLogin, onRegister, users }) {
      const [isRegister, setIsRegister] = useState(false);
      const [email, setEmail] = useState("admin@negocio.cl");
      const [pass, setPass] = useState("123");
      const [name, setName] = useState("");
      const [role, setRole] = useState("Vendedor");
      const [adminAuthCode, setAdminAuthCode] = useState("");
      const [error, setError] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError("");
        const cleanEmail = email.trim().toLowerCase();

        let locks = {};
        try { locks = JSON.parse(localStorage.getItem(LOGIN_LOCKS_KEY) || "{}"); } catch (err) {}
        const currentLock = locks[cleanEmail];
        if (currentLock && currentLock.until > Date.now()) {
          const waitSec = Math.ceil((currentLock.until - Date.now()) / 1000);
          setError(`Demasiados intentos fallidos. Espera ${waitSec}s.`);
          return;
        }

        if (isRegister) {
          if (!name.trim() || !cleanEmail || !pass.trim()) {
            setError("Todos los campos son obligatorios.");
            return;
          }
          if (users.some(u => (u.email || "").toLowerCase() === cleanEmail)) {
            setError("Ya existe un usuario con este correo.");
            return;
          }
          if ((role === "Administrador" || role === "Personal") && adminAuthCode !== "123") {
            setError("Ingresa la clave de autorización del propietario (123) para crear roles administrativos.");
            return;
          }
          const hashedPass = await hashPassword(pass);
          const newUser = { id: "u-" + Date.now(), name: sanitizeText(name), email: cleanEmail, pass: hashedPass, role };
          onRegister(newUser);
        } else {
          const userFound = users.find(u => (u.email || "").toLowerCase() === cleanEmail);
          const isValid = await verifyUserPassword(userFound, pass);
          if (userFound && isValid) {
            delete locks[cleanEmail];
            try { localStorage.setItem(LOGIN_LOCKS_KEY, JSON.stringify(locks)); } catch (err) {}
            onLogin(userFound);
          } else {
            const attempts = (currentLock?.attempts || 0) + 1;
            locks[cleanEmail] = { attempts, until: attempts >= 5 ? Date.now() + 45000 : 0 };
            try { localStorage.setItem(LOGIN_LOCKS_KEY, JSON.stringify(locks)); } catch (err) {}
            setError(`Credenciales incorrectas (${attempts}/5 intentos).`);
          }
        }
      };

      const setDemo = (userEmail) => {
        const u = users.find(x => x.email === userEmail);
        if (u) {
          setEmail(u.email);
          setPass("123");
          setError("");
        }
      };

      return (
        <div style={{ ...styles.authContainer, padding: 16 }}>
          <div style={{ ...styles.authGlassCard, padding: "26px 22px" }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <div style={styles.authLogo}>
                <Icon name="boxes" size={24} color="#EDEAE1" />
              </div>
              <h2 style={{ color: "#F8FAFC", margin: "10px 0 4px", fontSize: 22, fontWeight: 700 }}>Almacén PRO</h2>
              <p style={{ color: "#94A3B8", fontSize: 13 }}>Gestión Multi-Bodega & Finanzas Personales</p>
            </div>

            <div style={styles.authTabs}>
              <button type="button" style={{ ...styles.authTabBtn, ...(isRegister ? {} : styles.authTabActive) }} onClick={() => { setIsRegister(false); setError(""); }}>Iniciar Sesión</button>
              <button type="button" style={{ ...styles.authTabBtn, ...(isRegister ? styles.authTabActive : {}) }} onClick={() => { setIsRegister(true); setError(""); }}>Crear Cuenta</button>
            </div>

            <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {isRegister && (
                <div>
                  <label style={styles.inputLabel}>Nombre completo</label>
                  <input style={styles.glassInput} placeholder="Ej: Benjamín Parra" value={name} onChange={(e) => setName(e.target.value)} required />
                </div>
              )}
              <div>
                <label style={styles.inputLabel}>Correo electrónico</label>
                <input style={styles.glassInput} type="email" placeholder="usuario@negocio.cl" value={email} onChange={(e) => setEmail(e.target.value)} required />
              </div>
              <div>
                <label style={styles.inputLabel}>Contraseña</label>
                <input style={styles.glassInput} type="password" placeholder="••••••••" value={pass} onChange={(e) => setPass(e.target.value)} required />
              </div>
              {isRegister && (
                <>
                  <div>
                    <label style={styles.inputLabel}>Rol / Tipo de Perfil</label>
                    <select style={styles.glassInput} value={role} onChange={(e) => setRole(e.target.value)}>
                      <option value="Vendedor">Vendedor (Punto de Venta y Clientes)</option>
                      <option value="Bodeguero">Bodeguero (Inventario y Almacenes)</option>
                      <option value="Personal">Personal (Finanzas Personales + Visión Global)</option>
                      <option value="Administrador">Administrador (Acceso Total Negocio & Personal)</option>
                    </select>
                  </div>
                  {(role === "Administrador" || role === "Personal") && (
                    <div>
                      <label style={{ ...styles.inputLabel, color: "#FBBF24" }}>Clave de Autorización del Propietario</label>
                      <input style={styles.glassInput} type="password" placeholder="Clave de autorización" value={adminAuthCode} onChange={e => setAdminAuthCode(e.target.value)} required />
                    </div>
                  )}
                </>
              )}
              {error && <div style={styles.errorMsg}>{error}</div>}
              <button type="submit" style={styles.submitBtn}>
                {isRegister ? "Registrar e Ingresar" : "Entrar al Sistema"}

                  <button type="button" style={styles.quickDemoBtn} onClick={() => setDemo("bodega@negocio.cl")}>Bodega</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
