  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      background: #07090e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #F1F5F9;
      overflow-x: hidden;
      position: relative;
      transition: background 0.3s ease;
    }
    body[data-warehouse-theme="warm"] {
      background: #14110d;
    }
    /* Orbes de luz ambiental de fondo para efecto Glassmorphism */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(105px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, #0c4f1c, #063111); top: -80px; left: -80px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #0ea5e9, #0369a1); bottom: -60px; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 320px; height: 320px; background: radial-gradient(circle, #8b5cf6, #5b21b6); top: 40%; left: 45%; opacity: 0.25; animation-delay: -10s; }
    body[data-warehouse-theme="warm"] .orb-1 { background: radial-gradient(circle, #b45309, #78350f); opacity: 0.38; }
    body[data-warehouse-theme="warm"] .orb-2 { background: radial-gradient(circle, #0f766e, #115e59); opacity: 0.35; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, 25px) scale(1.08); }
      100% { transform: translate(-25px, 45px) scale(0.95); }
    }
    #root {
      width: 100%;
      max-width: 1360px;
      z-index: 1;
      position: relative;
    }
    input, select, button, textarea {
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #34D399 !important;
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2);
    }
    option {
      background-color: #0f172a;
      color: #f1f5f9;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }
  </style>

    // Hash SHA-256 con soporte retrocompatible para contraseñas previas
    async function hashPassword(plain, salt = "almacen_supabase_salt_v2") {
      try {
        const data = new TextEncoder().encode(`${salt}::${plain}`);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return "sha256$" + Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
      } catch {
        return "sha256$" + btoa(unescape(encodeURIComponent(salt + plain)));
      }
    }

    async function verifyUserPassword(userObj, inputPlain) {
      if (!userObj) return false;
      const stored = String(userObj.pass || "");
      if (stored.startsWith("sha256$")) {
        const hashedInput = await hashPassword(inputPlain);
        return stored === hashedInput;
      }
      return stored === inputPlain;
    }

    const formatMonthLabel = (ym) => {
      if (!ym) return "";
      const [year, month] = ym.split("-");
      const monthNames = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"

      const mIdx = parseInt(month, 10) - 1;
      return `${monthNames[mIdx] || month} ${year}`;
    };

    // Exportación segura contra CSV Injection (fórmulas maliciosas =, +, -, @)
    function exportToGoogleSheetsCSV(filename, rows) {
      const csvContent = "\uFEFF" + rows.map(row =>
        row.map(cell => {
          if (cell === null || cell === undefined) return '""';
          let cellStr = String(cell).replace(/"/g, '""');
          if (/^[=+\-@]/.test(cellStr)) {
            cellStr = "'" + cellStr;
          }
          return `"${cellStr}"`;
        }).join(";")
      ).join("\r\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ============ COMPONENTE PRINCIPAL APP ============
    function App() {

          return active ? JSON.parse(active) : null;
        } catch (e) {
          localStorage.removeItem(AUTH_STORAGE_KEY);
          return null;

      });

      // Carga inicial con respaldo local por si Supabase está sin conexión
      const cachedData = useMemo(() => {
        try {
          const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }, []);

      const [users, setUsers] = useState(cachedData?.users || initialUsers);
      const [products, setProducts] = useState(cachedData?.products || initialMockProducts);
      const [sales, setSales] = useState(cachedData?.sales || initialMockSales);
      const [expenses, setExpenses] = useState(cachedData?.expenses || initialMockExpenses);
      const [customers, setCustomers] = useState(cachedData?.customers || initialMockCustomers);
      const [personalFinances, setPersonalFinances] = useState(cachedData?.personalFinances || initialPersonalFinances);

      const [rolePermissions, setRolePermissions] = useState(() => {
        try {
          const saved = localStorage.getItem(PERMS_STORAGE_KEY);
          return saved ? { ...defaultRolePermissions, ...JSON.parse(saved) } : defaultRolePermissions;
        } catch {

        }
      });

      const [auditLog, setAuditLog] = useState(() => {
        try {
          const saved = localStorage.getItem(AUDIT_STORAGE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [warehouseTheme, setWarehouseTheme] = useState(() => localStorage.getItem(THEME_MODE_KEY) || "warm");
      const [tab, setTab] = useState("dashboard");
      const [locations] = useState(defaultLocations);
      const [isSyncing, setIsSyncing] = useState(false);
      const [salesMonthFilter, setSalesMonthFilter] = useState("");
      const [inventorySearch, setInventorySearch] = useState("");
      const [inventoryCategoryFilter, setInventoryCategoryFilter] = useState("Todas");
      const [toast, setToast] = useState(null);

      // Modales
      const [productModalState, setProductModalState] = useState(null);
      const [saleModalState, setSaleModalState] = useState(null);
      const [expenseModalState, setExpenseModalState] = useState(null);
      const [customerModalState, setCustomerModalState] = useState(null);
      const [personalModalState, setPersonalModalState] = useState(null);
      const [transferModalOpen, setTransferModalOpen] = useState(false);

      const notify = useCallback((msg, type = "ok") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3200);
      }, []);

      const registerAudit = useCallback((action, detail, userOverride) => {
        const actor = userOverride || currentUser?.name || "Sistema";
        const item = {
          id: "aud-" + Date.now() + "-" + Math.random().toString(36).slice(2, 5),
          date: new Date().toLocaleString("es-CL"),
          actor,
          action,
          detail
        };
        setAuditLog(prev => {
          const updated = [item, ...prev.slice(0, 149)];
          localStorage.setItem(AUDIT_STORAGE_KEY, JSON.stringify(updated));
          return updated;
        });
      }, [currentUser]);

      useEffect(() => {
        document.body.setAttribute("data-warehouse-theme", warehouseTheme);
        localStorage.setItem(THEME_MODE_KEY, warehouseTheme);
      }, [warehouseTheme]);

      // Guardar caché local híbrido
      useEffect(() => {
        try {
          localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify({
            users, products, sales, expenses, customers, personalFinances
          }));
        } catch (e) {}
      }, [users, products, sales, expenses, customers, personalFinances]);

      useEffect(() => {
        localStorage.setItem(PERMS_STORAGE_KEY, JSON.stringify(rolePermissions));
      }, [rolePermissions]);

      const fetchDataFromSupabase = useCallback(async () => {
        if (!supabase) return;
        setIsSyncing(true);
        try {
          const [uRes, pRes, sRes, eRes, cRes, pfRes] = await Promise.all([
            supabase.from("usuarios").select("*"),
            supabase.from("productos").select("*"),
            supabase.from("ventas").select("*").order("date", { ascending: false }),
            supabase.from("gastos").select("*").order("date", { ascending: false }),
            supabase.from("clientes").select("*"),
            supabase.from("finanzas_personales").select("*").order("date", { ascending: false })
          ]);

          if (uRes.data && uRes.data.length > 0) setUsers(uRes.data);
          if (pRes.data && pRes.data.length > 0) setProducts(pRes.data);
          if (sRes.data) setSales(sRes.data);
          if (eRes.data) setExpenses(eRes.data);
          if (cRes.data) setCustomers(cRes.data);
          if (pfRes.data) setPersonalFinances(pfRes.data);
        } catch (err) {
          console.error("Error al sincronizar con Supabase:", err);
        } finally {
          setIsSyncing(false);
        }
      }, []);

      useEffect(() => {
        fetchDataFromSupabase();
      }, [fetchDataFromSupabase]);

      useEffect(() => {
        if (currentUser) {
          const safeSession = { id: currentUser.id, name: currentUser.name, email: currentUser.email, role: currentUser.role };

        } else {

      }, [currentUser]);

      // Cierre automático por inactividad (15 minutos)
      useEffect(() => {
        if (!currentUser) return;
        let inactivityTimer;
        const resetInactivity = () => {
          clearTimeout(inactivityTimer);
          inactivityTimer = setTimeout(() => {
            registerAudit("Sesión Expirada", "Cierre automático tras 15 minutos de inactividad");
            setCurrentUser(null);
            notify("Sesión cerrada por inactividad para proteger el almacén", "warn");
          }, 15 * 60 * 1000);
        };
        window.addEventListener("mousemove", resetInactivity);
        window.addEventListener("keydown", resetInactivity);
        window.addEventListener("click", resetInactivity);
        resetInactivity();
        return () => {
          clearTimeout(inactivityTimer);
          window.removeEventListener("mousemove", resetInactivity);
          window.removeEventListener("keydown", resetInactivity);
          window.removeEventListener("click", resetInactivity);
        };
      }, [currentUser, registerAudit, notify]);

      // TODOS LOS HOOKS useMemo DECLARADOS AL INICIO ANTES DE CONDICIONALES
      const salesAvailableMonths = useMemo(() => {
        const currentYM = new Date().toISOString().slice(0, 7);

        monthsSet.add(currentYM);
        return Array.from(monthsSet).sort().reverse();

            (p.sku || "").toLowerCase().includes(q) ||

          return matchCat && matchText;

        setUsers(prev => [...prev, newUser]);
        setCurrentUser(newUser);
        registerAudit("Registro de Cuenta", `Nueva cuenta creada: ${newUser.email} (${newUser.role})`, newUser.name);
        if (supabase) {
          await supabase.from("usuarios").insert([newUser]);
        }
      };

      const handleSaveProduct = async (productData) => {
        let updatedEntry;
        if (productModalState === "new") {
          updatedEntry = { ...productData, id: "p-" + Date.now() };
          setProducts(prev => [updatedEntry, ...prev]);
          registerAudit("Producto Creado", `${updatedEntry.name} (SKU: ${updatedEntry.sku})`);
          notify("Producto agregado al inventario");
        } else {
          updatedEntry = { ...productData, id: productModalState.id };
          setProducts(prev => prev.map(p => p.id === productModalState.id ? updatedEntry : p));
          registerAudit("Producto Modificado", `${updatedEntry.name} (SKU: ${updatedEntry.sku})`);
          notify("Ficha de producto actualizada");
        }
        setProductModalState(null);

        if (supabase) {
          await supabase.from("productos").upsert([updatedEntry]);
        }
      };

      const handleDeleteProduct = async (productId) => {
        const target = products.find(p => p.id === productId);
        if (confirm(`¿Estás seguro de eliminar "${target?.name || "este producto"}" del inventario?`)) {
          setProducts(prev => prev.filter(p => p.id !== productId));
          registerAudit("Producto Eliminado", `${target?.name || productId}`);
          notify("Producto eliminado", "warn");
          if (supabase) {
            await supabase.from("productos").delete().eq("id", productId);
          }
        }
      };

      // Traspaso directo entre Bodega Central y Tienda Principal
      const handleTransferStock = async ({ productId, fromLocId, toLocId, qty }) => {
        const prod = products.find(p => p.id === productId);
        if (!prod) return;
        const currentFrom = Number(prod.stockByLocation?.[fromLocId] || 0);
        if (qty <= 0 || qty > currentFrom) {
          notify("No hay stock suficiente en la bodega de origen", "warn");
          return;
        }
        const updatedProduct = {
          ...prod,
          stockByLocation: {
            ...(prod.stockByLocation || {}),
            [fromLocId]: currentFrom - qty,
            [toLocId]: Number(prod.stockByLocation?.[toLocId] || 0) + qty
          }
        };
        setProducts(prev => prev.map(p => p.id === productId ? updatedProduct : p));
        registerAudit("Traspaso de Bodega", `${qty} un. de ${prod.name} (${fromLocId} → ${toLocId})`);
        notify(`Traspaso de ${qty} un. realizado con éxito`);
        setTransferModalOpen(false);
        if (supabase) {
          await supabase.from("productos").upsert([updatedProduct]);
        }
      };

      const ensureCustomerExists = async (name) => {
        const trimmed = sanitizeText(name);
        if (!trimmed) return;
        const exists = customers.some(c => c.name.toLowerCase() === trimmed.toLowerCase());
        if (exists) return;

        const newCustomer = { id: "c-" + Date.now(), name: trimmed, phone: "" };
        setCustomers(prev => [...prev, newCustomer]);
        if (supabase) {
          await supabase.from("clientes").insert([newCustomer]);
        }
      };

      const handleSaveSale = async (saleData, stockDeduction) => {
        let updatedEntry;
        if (saleModalState === "new") {
          updatedEntry = { ...saleData, id: "s-" + Date.now() };
          setSales(prev => [updatedEntry, ...prev]);
          registerAudit("Venta Registrada", `${money(updatedEntry.total)} - Cliente: ${updatedEntry.customerName}`);
          notify("Venta registrada en caja");
        } else {
          updatedEntry = { ...saleData, id: saleModalState.id };
          setSales(prev => prev.map(s => s.id === saleModalState.id ? updatedEntry : s));
          registerAudit("Venta Modificada", `${money(updatedEntry.total)} - Cliente: ${updatedEntry.customerName}`);
          notify("Registro de venta actualizado");
        }

        // Si el usuario seleccionó descontar producto del almacén al registrar la venta
        if (stockDeduction && stockDeduction.productId && stockDeduction.qty > 0) {
          const targetProd = products.find(p => p.id === stockDeduction.productId);
          if (targetProd) {
            const locId = stockDeduction.locationId || "loc-tienda";
            const currentLocStock = Number(targetProd.stockByLocation?.[locId] || 0);
            const updatedProd = {
              ...targetProd,
              stockByLocation: {
                ...(targetProd.stockByLocation || {}),
                [locId]: Math.max(0, currentLocStock - stockDeduction.qty)
              }
            };
            setProducts(prev => prev.map(p => p.id === targetProd.id ? updatedProd : p));
            if (supabase) {
              await supabase.from("productos").upsert([updatedProd]);
            }
          }
        }

        ensureCustomerExists(saleData.customerName);
        setSaleModalState(null);

        if (supabase) {
          await supabase.from("ventas").upsert([updatedEntry]);
        }
      };

      const handleDeleteSale = async (saleId) => {
        if (confirm("¿Estás seguro de eliminar esta venta del registro?")) {
          const target = sales.find(s => s.id === saleId);
          setSales(prev => prev.filter(s => s.id !== saleId));
          registerAudit("Venta Eliminada", `${target?.customerName || saleId} (${money(target?.total || 0)})`);
          notify("Venta eliminada", "warn");
          if (supabase) {
            await supabase.from("ventas").delete().eq("id", saleId);
          }
        }
      };

      const handleSaveExpense = async (expenseData) => {
        let updatedEntry;
        if (expenseModalState === "new") {
          updatedEntry = { ...expenseData, id: "e-" + Date.now() };
          setExpenses(prev => [updatedEntry, ...prev]);
          registerAudit("Gasto Registrado", `${updatedEntry.category}: ${money(updatedEntry.amount)}`);
          notify("Gasto comercial registrado");
        } else {
          updatedEntry = { ...expenseData, id: expenseModalState.id };
          setExpenses(prev => prev.map(e => e.id === expenseModalState.id ? updatedEntry : e));
          registerAudit("Gasto Modificado", `${updatedEntry.category}: ${money(updatedEntry.amount)}`);
          notify("Gasto actualizado");
        }
        setExpenseModalState(null);

        if (supabase) {
          await supabase.from("gastos").upsert([updatedEntry]);
        }
      };

      const handleDeleteExpense = async (expenseId) => {
        if (confirm("¿Estás seguro de eliminar este gasto del registro?")) {
          setExpenses(prev => prev.filter(e => e.id !== expenseId));
          registerAudit("Gasto Eliminado", `ID: ${expenseId}`);
          notify("Gasto eliminado", "warn");
          if (supabase) {
            await supabase.from("gastos").delete().eq("id", expenseId);
          }
        }
      };

      const handleSaveCustomer = async (customerData) => {
        let updatedEntry;
        if (customerModalState === "new") {
          updatedEntry = { ...customerData, id: "c-" + Date.now() };
          setCustomers(prev => [updatedEntry, ...prev]);
          notify("Cliente agregado a la cartera");
        } else {
          updatedEntry = { ...customerData, id: customerModalState.id };
          setCustomers(prev => prev.map(c => c.id === customerModalState.id ? updatedEntry : c));
          notify("Datos del cliente actualizados");
        }
        setCustomerModalState(null);

        if (supabase) {
          await supabase.from("clientes").upsert([updatedEntry]);
        }
      };

      const handleDeleteCustomer = async (customerId) => {
        if (confirm("¿Estás seguro de eliminar este cliente del registro?")) {
          setCustomers(prev => prev.filter(c => c.id !== customerId));
          notify("Cliente eliminado", "warn");
          if (supabase) {
            await supabase.from("clientes").delete().eq("id", customerId);
          }
        }
      };

      const handleSavePersonalFinance = async (itemData) => {
        let updatedEntry;
        if (personalModalState === "new") {
          updatedEntry = { ...itemData, id: "pf-" + Date.now() };
          setPersonalFinances(prev => [updatedEntry, ...prev]);
          notify("Movimiento personal guardado");
        } else {
          updatedEntry = { ...itemData, id: personalModalState.id };
          setPersonalFinances(prev => prev.map(item => item.id === personalModalState.id ? updatedEntry : item));
          notify("Movimiento personal actualizado");
        }
        setPersonalModalState(null);

        if (supabase) {
          await supabase.from("finanzas_personales").upsert([updatedEntry]);
        }
      };

      const handleDeletePersonalFinance = async (id) => {
        if (confirm("¿Eliminar este movimiento de tus finanzas personales?")) {
          setPersonalFinances(prev => prev.filter(i => i.id !== id));
          notify("Movimiento personal eliminado", "warn");
          if (supabase) {
            await supabase.from("finanzas_personales").delete().eq("id", id);
          }
        }
      };

      // CONDICIONAL DE AUTENTICACIÓN (DESPUÉS DE TODOS LOS HOOKS)
      if (!currentUser) {
        return <AuthScreen onLogin={handleLogin} onRegister={handleRegister} users={users} />;
      }

      const role = currentUser.role || "Vendedor";
      const activePerms = rolePermissions[role] || defaultRolePermissions[role] || defaultRolePermissions.Vendedor;

      const canAccessFinances = Boolean(activePerms.gastos);
      const canAccessPersonal = Boolean(activePerms.personal);
      const canAccessWarehouses = Boolean(activePerms.bodegas);
      const canAccessSales = Boolean(activePerms.ventas);
      const canAccessCustomers = Boolean(activePerms.clientes);
      const canManageInventory = Boolean(activePerms.canManageInventory);
      const canViewCosts = Boolean(activePerms.canViewCosts);

      const lowStock = products.filter(p => getProductTotalStock(p) <= (p.minStock || 0));
      const totalSales = sales.reduce((a, s) => a + Number(s.total || 0), 0);
      const totalExpenses = expenses.reduce((a, e) => a + Number(e.amount || 0), 0);
      const profit = totalSales - totalExpenses;

      const personalIncome = personalFinances.filter(f => f.type === "ingreso").reduce((a, b) => a + Number(b.amount || 0), 0);
      const personalExpense = personalFinances.filter(f => f.type === "gasto").reduce((a, b) => a + Number(b.amount || 0), 0);
      const personalBalance = personalIncome - personalExpense;

      const handleExportBusinessFinances = () => {
        const today = new Date().toISOString().slice(0, 10);
        const labelPeriodo = salesMonthFilter ? formatMonthLabel(salesMonthFilter) : "Historial Completo";
        const rows = [
          ["REPORTE GENERAL - FINANZAS DEL NEGOCIO", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", ""],
          ["Período Seleccionado:", labelPeriodo, "", "", ""],
          [""],
          ["--- VENTAS REGISTRADAS ---", "", "", "", ""],
          ["Fecha", "Cliente", "Detalle / Concepto", "Medio de Pago", "Monto ($)"],
          ...filteredSales.map(s => [s.date, s.customerName, s.details || "Venta General", s.paymentMethod, s.total]),
          ["TOTAL VENTAS PERÍODO", "", "", "", filteredSalesTotal],
          [""],
          ["--- GASTOS OPERATIVOS DEL NEGOCIO ---", "", "", "", ""],
          ["Fecha", "Categoría", "Descripción", "", "Monto ($)"],
          ...expenses.map(e => [e.date, e.category, e.description || "-", "", e.amount]),
          ["TOTAL GASTOS", "", "", "", totalExpenses],
          [""],
          ["--- RESUMEN FINANCIERO ---", "", "", "", ""],
          ["Ingresos por Ventas", "", "", "", totalSales],
          ["Egresos por Gastos", "", "", "", totalExpenses],
          ["UTILIDAD NETA (NEGOCIO)", "", "", "", profit]
        ];
        exportToGoogleSheetsCSV(`Finanzas_Negocio_${salesMonthFilter || "Total"}_${today}.csv`, rows);
      };

      const handleExportPersonalFinances = (filteredList, periodLabel, pIncome, pExpense, pBalance) => {
        const today = new Date().toISOString().slice(0, 10);
        const rows = [
          ["REPORTE GENERAL - ESPACIO Y FINANZAS PERSONALES", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", ""],
          ["Período:", periodLabel, "", "", ""],
          [""],
          ["--- REGISTRO DE MOVIMIENTOS PERSONALES ---", "", "", "", ""],
          ["Fecha", "Tipo", "Categoría", "Descripción / Motivo", "Monto ($)"],
          ...filteredList.map(p => [
            p.date,
            p.type === "ingreso" ? "Ingreso (+)" : "Gasto (-)",
            p.category,
            p.description || "-",
            p.type === "ingreso" ? p.amount : -Math.abs(p.amount)
          ]),
          [""],
          ["--- BALANCE PERSONAL DEL PERÍODO ---", "", "", "", ""],
          ["Total Ingresos Personales", "", "", "", pIncome],
          ["Total Gastos Personales", "", "", "", pExpense],
          ["SALDO DISPONIBLE EN BOLSILLO", "", "", "", pBalance]
        ];
        exportToGoogleSheetsCSV(`Finanzas_Personales_${periodLabel.replace(/\s+/g, '_')}_${today}.csv`, rows);
      };

      const handleExportInventory = () => {
        const today = new Date().toISOString().slice(0, 10);
        const rows = [
          ["CATÁLOGO DE PRODUCTOS E INVENTARIO", "", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", "", ""],
          [""],
          ["Nombre", "Categoría", "SKU", "Código Barras", "Costo ($)", "Precio Venta ($)", "Stock Total", "Stock Mínimo"],
          ...products.map(p => [
            p.name,
            p.category,
            p.sku,
            p.barcode || "-",
            canViewCosts ? p.costPrice : "Restringido",
            p.salePrice,
            getProductTotalStock(p),
            p.minStock
          ])
        ];
        exportToGoogleSheetsCSV(`Inventario_${today}.csv`, rows);
      };

      return (
        <div style={styles.appContainer}>
          {toast && (
            <div style={{
              position: "fixed", bottom: 22, right: 24, zIndex: 999,
              background: toast.type === "warn" ? "rgba(217, 119, 6, 0.95)" : "rgba(12, 79, 28, 0.95)",
              border: "1px solid rgba(255,255,255,0.25)", color: "#FFF", padding: "10px 16px",
              borderRadius: 12, fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 8,
              boxShadow: "0 12px 30px rgba(0,0,0,0.45)", backdropFilter: "blur(12px)"
            }}>
              <Icon name={toast.type === "warn" ? "alert-circle" : "check-circle-2"} size={15} color="#FFF" />
              <span>{toast.msg}</span>
            </div>
          )}

          <aside style={styles.sidebar}>
            <div style={styles.brand}>
              <img
                src="logo.png"
                alt="Logo Almacén"
                onError={(e) => { e.target.style.display = "none"; }}
                style={{ width: 36, height: 36, objectFit: "contain", borderRadius: 8 }}
              />
              <div style={{ flex: 1 }}>
                <div style={styles.brandTitle}>Almacén PRO</div>
                <div style={styles.brandSub}>
                  {isSupabaseConfigured ? "☁️ Nube Supabase Activa" : "💾 Modo Local"}
                </div>
              </div>
              <button
                onClick={() => setWarehouseTheme(prev => prev === "warm" ? "cool" : "warm")}
                style={styles.themeToggleBtn}
                title={warehouseTheme === "warm" ? "Cambiar a Cristal Frío" : "Cambiar a Almacén Cálido"}
              >
                <Icon name={warehouseTheme === "warm" ? "flame" : "sparkles"} size={14} color={warehouseTheme === "warm" ? "#FBBF24" : "#38BDF8"} />
              </button>
            </div>

            <div style={styles.userCard}>
              <div style={styles.userAvatar}>
                {currentUser.name.slice(0, 2).toUpperCase()}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={styles.userName}>{currentUser.name}</div>
                <span style={{ ...styles.roleBadge, color: role === "Personal" ? "#C084FC" : "#FBBF24" }}>
                  {currentUser.role}
                </span>
              </div>
              <button style={styles.logoutBtn} onClick={handleLogout} title="Cerrar sesión">
                <Icon name="log-out" size={14} color="#F87171" />
              </button>
            </div>

            <nav style={styles.nav}>
              <button onClick={() => setTab("dashboard")} style={{ ...styles.navItem, ...(tab === "dashboard" ? styles.navItemActive : {}) }}>
                <Icon name="layout-dashboard" size={16} />
                <span>Panel General</span>
              </button>

              {canAccessPersonal && (
                <button onClick={() => setTab("personal")} style={{ ...styles.navItem, ...(tab === "personal" ? styles.navItemActive : {}) }}>
                  <Icon name="wallet" size={16} color="#C084FC" />
                  <span>Espacio Personal</span>
                  <span style={styles.navBadgePurple}>Mío</span>
                </button>
              )}

              {activePerms.inventario && (
                <button onClick={() => setTab("inventario")} style={{ ...styles.navItem, ...(tab === "inventario" ? styles.navItemActive : {}) }}>
                  <Icon name="package" size={16} />
                  <span>Inventario & Etiquetas</span>
                  {lowStock.length > 0 && <span style={styles.navBadge}>{lowStock.length}</span>}
                </button>
              )}

              {canAccessWarehouses && (
                <button onClick={() => setTab("bodegas")} style={{ ...styles.navItem, ...(tab === "bodegas" ? styles.navItemActive : {}) }}>
                  <Icon name="warehouse" size={16} />
                  <span>Bodegas & Traspaso</span>
                </button>
              )}

              {canAccessSales && (
                <button onClick={() => setTab("ventas")} style={{ ...styles.navItem, ...(tab === "ventas" ? styles.navItemActive : {}) }}>
                  <Icon name="shopping-cart" size={16} />
                  <span>Ventas & Caja</span>
                </button>
              )}

              {canAccessCustomers && (
                <button onClick={() => setTab("clientes")} style={{ ...styles.navItem, ...(tab === "clientes" ? styles.navItemActive : {}) }}>
                  <Icon name="users-round" size={16} />
                  <span>Clientes</span>
                </button>
              )}

              {canAccessFinances && (
                <button onClick={() => setTab("gastos")} style={{ ...styles.navItem, ...(tab === "gastos" ? styles.navItemActive : {}) }}>
                  <Icon name="receipt" size={16} />
                  <span>Gastos Negocio</span>
                </button>
              )}

              {role === "Administrador" && (
                <button onClick={() => setTab("usuarios")} style={{ ...styles.navItem, ...(tab === "usuarios" ? styles.navItemActive : {}) }}>
                  <Icon name="shield-check" size={16} />
                  <span>Equipo & Seguridad</span>
                </button>
              )}
            </nav>

            <div style={styles.footerStatus}>
              <span style={styles.statusDot}></span>
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {isSyncing ? "Sincronizando..." : currentUser.email}
              </span>
              {isSupabaseConfigured && (
                <button onClick={fetchDataFromSupabase} style={{ background: "none", border: "none", cursor: "pointer", marginLeft: "auto", color: "#94A3B8" }} title="Sincronizar con Supabase">
                  <Icon name="refresh-cw" size={12} />
                </button>
              )}
            </div>
          </aside>

          <main style={styles.main}>
            {tab === "dashboard" && (
              <Dashboard
                currentUser={currentUser}
                canAccessSales={canAccessSales}
                canAccessPersonal={canAccessPersonal}
                canViewCosts={canViewCosts}
                sales={sales}
                expenses={expenses}
                products={products}
                lowStock={lowStock}
                locations={locations}
                customers={customers}
                totalSales={totalSales}
                totalExpenses={totalExpenses}
                profit={profit}
                personalFinances={personalFinances}
                personalIncome={personalIncome}
                personalExpense={personalExpense}
                personalBalance={personalBalance}
                onNewSale={() => setSaleModalState("new")}
                onNewPersonal={() => setPersonalModalState("new")}
                onGoToPersonal={() => setTab("personal")}
                onGoToInventory={() => setTab("inventario")}
                onExportBusiness={handleExportBusinessFinances}
                onExportPersonal={() => handleExportPersonalFinances(personalFinances, "Historial Completo", personalIncome, personalExpense, personalBalance)}
              />
            )}

            {tab === "personal" && canAccessPersonal && (
              <PersonalFinancesManager
                personalFinances={personalFinances}
                onNew={() => setPersonalModalState("new")}
                onEdit={(item) => setPersonalModalState(item)}
                onDelete={handleDeletePersonalFinance}
                onExport={handleExportPersonalFinances}
              />
            )}

            {tab === "inventario" && (
              <div>
                <div style={styles.pageHeader}>
                  <div>
                    <div style={styles.eyebrow}>ESTANTERÍA DEL ALMACÉN & CATÁLOGO</div>
                    <h2 style={styles.pageTitle}>Fichas de Productos y Existencias</h2>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <button style={styles.sheetsExportBtn} onClick={handleExportInventory} title="Exportar catálogo a Google Sheets">
                      <Icon name="file-spreadsheet" size={14} color="#34D399" /> Exportar Sheets
                    </button>
                    {canManageInventory && (
                      <button style={styles.primaryBtn} onClick={() => setProductModalState("new")}>
                        <Icon name="plus" size={14} /> Agregar Producto
                      </button>
                    )}
                  </div>
                </div>

                {/* Barra de búsqueda rápida de almacén (Lector código de barras / SKU / Categoría) */}
                <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap" }}>
                  <div style={{ flex: 1, minWidth: 240, position: "relative" }}>
                    <input
                      style={styles.glassInput}
                      placeholder="🔍 Buscar producto por nombre, SKU o pistolear Código de Barras..."
                      value={inventorySearch}
                      onChange={e => setInventorySearch(e.target.value)}
                    />
                  </div>
                  <select
                    style={styles.filterSelect}
                    value={inventoryCategoryFilter}
                    onChange={e => setInventoryCategoryFilter(e.target.value)}
                  >
                    <option value="Todas">📦 Todas las categorías</option>
                    {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                {filteredInventory.length === 0 ? (
                  <div style={styles.panel}>
                    <p style={{ textAlign: "center", color: "#94A3B8", margin: 20 }}>
                      No se encontraron productos con ese criterio en el almacén.
                    </p>
                  </div>
                ) : (
                  <div style={styles.tagGrid}>
                    {filteredInventory.map(p => {
                      const totalStock = getProductTotalStock(p);
                      const isCritical = totalStock <= (p.minStock || 0);
                      const unitMargin = (Number(p.salePrice) || 0) - (Number(p.costPrice) || 0);
                      return (
                        <div key={p.id} style={{
                          ...styles.productGlassCard,
                          borderColor: isCritical ? "rgba(248, 113, 113, 0.4)" : "rgba(251, 191, 36, 0.22)"
                        }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span style={styles.categoryBadge}>{p.category}</span>
                            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                              {isCritical ? (
                                <span style={styles.stockLowBadge}>⚠️ Reponer ({totalStock})</span>
                              ) : (
                                <span style={styles.stockOkBadge}>✓ En Estante</span>
                              )}
                              {canManageInventory && (
                                <>
                                  <button style={styles.actionIconBtn} onClick={() => setProductModalState(p)} title="Modificar Producto">
                                    <Icon name="pencil" size={13} color="#FBBF24" />
                                  </button>
                                  <button style={styles.actionIconBtn} onClick={() => handleDeleteProduct(p.id)} title="Eliminar Producto">
                                    <Icon name="trash-2" size={13} color="#F87171" />
                                  </button>
                                </>
                              )}
                            </div>
                          </div>

                          <div style={{ fontSize: 16.5, fontWeight: 700, margin: "10px 0 3px", color: "#F8FAFC" }}>{p.name}</div>
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#94A3B8", fontFamily: "monospace" }}>
                            <span>SKU: {p.sku || "-"}</span>
                            {p.barcode && <span>║▌║ {p.barcode}</span>}
                          </div>

                          <div style={styles.cardDivider}></div>

                          <div style={styles.tagRow}>
                            <span>Precio Mostrador:</span>
                            <strong style={{ color: "#34D399", fontSize: 15 }}>{money(p.salePrice)}</strong>
                          </div>
                          {canViewCosts && (
                            <>
                              <div style={styles.tagRow}>
                                <span>Costo Unitario:</span>
                                <span>{money(p.costPrice)}</span>
                              </div>
                              <div style={styles.tagRow}>
                                <span>Ganancia x Unidad:</span>
                                <span style={{ color: "#FBBF24", fontWeight: 600 }}>+{money(unitMargin)}</span>
                              </div>
                            </>
                          )}
                          <div style={styles.tagRow}>
                            <span>Stock Total Almacén:</span>
                            <strong style={{ color: isCritical ? "#F87171" : "#38BDF8" }}>
                              {totalStock} un. (mín. {p.minStock || 0})
                            </strong>
                          </div>

                          <div style={styles.stockByLocBox}>
                            {locations.map(loc => (
                              <div key={loc.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: "#CBD5E1", margin: "3px 0" }}>
                                <span>📍 {loc.name}:</span>
                                <strong style={{ color: "#F8FAFC" }}>{p.stockByLocation?.[loc.id] || 0} un.</strong>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {tab === "bodegas" && canAccessWarehouses && (
              <div>
                <div style={styles.pageHeader}>
                  <div>
                    <div style={styles.eyebrow}>LOGÍSTICA MULTI-BODEGA</div>
                    <h2 style={styles.pageTitle}>Distribución y Traspaso entre Almacenes</h2>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    {canManageInventory && (
                      <>
                        <button style={styles.amberBtn} onClick={() => setTransferModalOpen(true)}>
                          <Icon name="arrow-left-right" size={14} /> Traspasar Mercadería
                        </button>
                        <button style={styles.primaryBtn} onClick={() => setProductModalState("new")}>
                          <Icon name="plus" size={14} /> Nuevo Artículo
                        </button>
                      </>
                    )}
                  </div>
                </div>
                <div style={styles.dashGrid}>
                  {locations.map(loc => {
                    const totalLocUnits = products.reduce((acc, p) => acc + (Number(p.stockByLocation?.[loc.id]) || 0), 0);
                    return (
                      <div key={loc.id} style={styles.panel}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <Icon name="warehouse" size={18} color="#FBBF24" />
                            <h3 style={{ color: "#F1F5F9", margin: 0, fontSize: 16 }}>{loc.name}</h3>
                          </div>
                          <span style={styles.badgeGreen}>{totalLocUnits} un. totales</span>
                        </div>
                        {products.map(p => (
                          <div key={p.id} style={styles.listRow}>
                            <div>
                              <span style={{ color: "#F1F5F9", fontWeight: 500 }}>{p.name}</span>
                              <div style={{ fontSize: 10.5, color: "#64748B", fontFamily: "monospace" }}>{p.sku}</div>
                            </div>
                            <strong style={{ color: (p.stockByLocation?.[loc.id] || 0) === 0 ? "#F87171" : "#38BDF8" }}>

                            </strong>

                    <div style={styles.eyebrow}>PUNTO DE VENTA & MOSTRADOR</div>

                  <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>

                        style={styles.filterSelect}
                        value={salesMonthFilter}

                          <option key={ym} value={ym}>{formatMonthLabel(ym)}</option>

                {salesMonthFilter && (
                  <div style={styles.filterBanner}>
                    <Icon name="filter" size={14} color="#38BDF8" />
                    <span>Filtrando por: <strong>{formatMonthLabel(salesMonthFilter)}</strong> — Total vendido en el mes: <strong style={{ color: "#34D399" }}>{money(filteredSalesTotal)}</strong></span>
                    <button style={styles.clearFilterBtn} onClick={() => setSalesMonthFilter("")}>Mostrar todo</button>
                  </div>
                )}

                <div style={styles.panel}>
                  <table style={styles.table}>
                    <thead>
                      <tr style={styles.tableHeaderRow}>
                        <th style={{ padding: "12px 10px" }}>Fecha</th>
                        <th>Cliente</th>
                        <th>Detalle / Concepto</th>
                        <th>Medio de Pago</th>
                        <th>Total</th>
                        <th style={{ textAlign: "right", paddingRight: 10 }}>Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredSales.length === 0 ? (
                        <tr>
                          <td colSpan="6" style={{ padding: 24, textAlign: "center", color: "#64748B" }}>
                            {salesMonthFilter ? `No hay ventas registradas en ${formatMonthLabel(salesMonthFilter)}.` : "No hay ventas registradas."}
                          </td>

                            <td style={{ color: "#CBD5E1" }}>{s.details || "Venta general"}</td>

            {tab === "clientes" && canAccessCustomers && (
              <ClientesManager

                sales={sales}
                onNew={() => setCustomerModalState("new")}

                onDelete={handleDeleteCustomer}

            {tab === "gastos" && canAccessFinances && (
              <GastosManager
                expenses={expenses}
                totalExpenses={totalExpenses}
                onNew={() => setExpenseModalState("new")}
                onEdit={(e) => setExpenseModalState(e)}
                onDelete={handleDeleteExpense}
                onExport={handleExportBusinessFinances}
              />

            {tab === "usuarios" && (role === "Administrador") && (
              <UsersManager
                users={users}

                  registerAudit("Permisos Actualizados", "Se modificaron los accesos por rol");

              onClose={() => setTransferModalOpen(false)}

            />

              sale={saleModalState === "new" ? null : saleModalState}

              onSave={handleSaveSale}

          {expenseModalState && (

              onClose={() => setExpenseModalState(null)}

            />

            <CustomerModal
              customer={customerModalState === "new" ? null : customerModalState}
              onClose={() => setCustomerModalState(null)}
              onSave={handleSaveCustomer}
            />

          {personalModalState && (
            <PersonalFinanceModal
              item={personalModalState === "new" ? null : personalModalState}
