<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0;
  }
  body { 
    margin: 0; 
    background: #07090e; 
    min-height: 100vh;
    display: flex; 
    justify-content: center; 
    align-items: center;
    padding: 20px; 
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; 
    color: #F1F5F9;
    overflow-x: hidden;
    position: relative;
  }

  /* Orbes de luz ambiental de fondo para efecto Glassmorphism */
  .ambient-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.45;
    animation: floatOrb 18s ease-in-out infinite alternate;
  }
  .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, #0c4f1c, #063111); top: -80px; left: -80px; }
  .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #0ea5e9, #0369a1); bottom: -60px; right: -60px; animation-delay: -5s; }
  .orb-3 { width: 320px; height: 320px; background: radial-gradient(circle, #8b5cf6, #5b21b6); top: 40%; left: 45%; opacity: 0.25; animation-delay: -10s; }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(35px, 25px) scale(1.08); }
    100% { transform: translate(-25px, 45px) scale(0.95); }
  }

  #root { 
    width: 100%; 
    max-width: 1320px; 
    z-index: 1;
    position: relative;
  }

  input, select, button, textarea { 
    font-family: inherit; 
  }
  
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }
</style>
</head>
<body>
  <div class="ambient-orb orb-1"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// CONFIGURACIÓN DE SUPABASE
const SUPABASE_URL = "https://bcnkbsiqrcoosasjlypc.supabase.co"; 
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbmtic2lxcmNvb3Nhc2pseXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1ODA3NTYsImV4cCI6MjEwMzE1Njc1Nn0._MLWTyHL7fBIhYhIwvrguIcDqwz7D9uFoRSCbqPo6pU";

const isSupabaseConfigured = SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_URL.includes("TU-PROYECTO");
const supabase = isSupabaseConfigured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const Icon = ({ name, size = 16, color = "currentColor", ...props }) => {

const AUTH_STORAGE_KEY = "negocio_active_user_v2";

const defaultLocations = [
  { id: "loc-central", name: "Bodega Central" },
  { id: "loc-tienda", name: "Tienda Principal" }
];

const initialUsers = [
  { id: "u-admin", name: "Benjamín Parra", email: "admin@negocio.cl", pass: "123", role: "Administrador" },
  { id: "u-personal", name: "Benjamín (Personal)", email: "personal@negocio.cl", pass: "123", role: "Personal" },
  { id: "u-bodega", name: "R Almacén", email: "bodega@negocio.cl", pass: "123", role: "Bodeguero" },
  { id: "u-ventas", name: "Anon Ventas", email: "ventas@negocio.cl", pass: "123", role: "Vendedor" }
];

const initialMockProducts = [
  { id: "p1", name: "Polera Oversize Algodón", category: "Ropa", sku: "ROP-POL-101", barcode: "7801001", costPrice: 6500, salePrice: 14990, minStock: 5, stockByLocation: { "loc-central": 18, "loc-tienda": 4 } },
  { id: "p2", name: "Taza Cerámica Negra", category: "Bazar", sku: "BAZ-TAZ-202", barcode: "7802002", costPrice: 2100, salePrice: 5990, minStock: 6, stockByLocation: { "loc-central": 3, "loc-tienda": 1 } },
  { id: "p3", name: "Gorra Snapback Urbana", category: "Ropa", sku: "ROP-GOR-303", barcode: "7803003", costPrice: 4200, salePrice: 9990, minStock: 2, stockByLocation: { "loc-central": 12, "loc-tienda": 8 } }
];

const initialMockSales = [
  { id: "s1", date: new Date().toISOString().slice(0, 10), customerName: "Carlos Soto", paymentMethod: "Tarjeta Débito", total: 29980, details: "2x Polera Oversize Algodón" },
  { id: "s2", date: new Date().toISOString().slice(0, 10), customerName: "Consumidor Final", paymentMethod: "Efectivo", total: 9990, details: "1x Gorra Snapback" }
];

const initialMockExpenses = [
  { id: "e1", date: new Date().toISOString().slice(0, 10), category: "Arriendo", description: "Arriendo local principal", amount: 350000 },
  { id: "e2", date: new Date().toISOString().slice(0, 10), category: "Insumos", description: "Compra de bolsas y etiquetas", amount: 18500 }
];

const initialMockCustomers = [
  { id: "c1", name: "Carlos Soto", phone: "+56 9 1234 5678" },
  { id: "c2", name: "Consumidor Final", phone: "" }
];

const initialPersonalFinances = [
  { id: "pf-1", date: new Date().toISOString().slice(0, 10), type: "ingreso", category: "Retiro de Ganancias", description: "Sueldo / Retiro del Negocio", amount: 450000 },
  { id: "pf-2", date: new Date().toISOString().slice(0, 10), type: "gasto", category: "Alimentación", description: "Supermercado quincena", amount: 65000 },
  { id: "pf-3", date: new Date().toISOString().slice(0, 10), type: "gasto", category: "Servicios Personales", description: "Plan de Telefonía y Streaming", amount: 22990 }
];

const EXPENSE_CATEGORIES = ["Arriendo", "Insumos", "Sueldos", "Servicios", "Marketing", "Transporte", "Otros"];
const PERSONAL_CATEGORIES = ["Alimentación", "Vivienda", "Transporte", "Servicios Personales", "Salud & Bienestar", "Ocio & Viajes", "Ahorro / Inversión", "Retiro de Ganancias", "Otros Ingresos", "Otros Gastos"];

const money = (n) => new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 }).format(Math.round(Number(n) || 0));
const getProductTotalStock = (p) => Object.values(p.stockByLocation || {}).reduce((a, b) => a + (Number(b) || 0), 0);

// FUNCIÓN GENERADORA DE CSV COMPATIBLE CON GOOGLE SHEETS & EXCEL
function exportToGoogleSheetsCSV(filename, rows) {
  const csvContent = "\uFEFF" + rows.map(row => 
    row.map(cell => {
      if (cell === null || cell === undefined) return '""';
      const cellStr = String(cell).replace(/"/g, '""');
      return `"${cellStr}"`;
    }).join(";")
  ).join("\r\n");

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function App() {
  const [currentUser, setCurrentUser] = useState(() => {
    const active = localStorage.getItem(AUTH_STORAGE_KEY);
    return active ? JSON.parse(active) : null;
  });

  const [users, setUsers] = useState(initialUsers);
  const [products, setProducts] = useState(initialMockProducts);
  const [sales, setSales] = useState(initialMockSales);
  const [expenses, setExpenses] = useState(initialMockExpenses);
  const [customers, setCustomers] = useState(initialMockCustomers);
  const [personalFinances, setPersonalFinances] = useState(initialPersonalFinances);
  
  const [tab, setTab] = useState("dashboard");
  const [locations] = useState(defaultLocations);
  const [isSyncing, setIsSyncing] = useState(false);

  // Modales
  const [saleModalState, setSaleModalState] = useState(null);
  const [expenseModalState, setExpenseModalState] = useState(null);
  const [customerModalState, setCustomerModalState] = useState(null);
  const [personalModalState, setPersonalModalState] = useState(null);

  const fetchDataFromSupabase = useCallback(async () => {
    if (!supabase) return;
    setIsSyncing(true);
    try {
      const [uRes, pRes, sRes, eRes, cRes, pfRes] = await Promise.all([
        supabase.from("usuarios").select("*"),
        supabase.from("productos").select("*"),
        supabase.from("ventas").select("*").order("date", { ascending: false }),
        supabase.from("gastos").select("*").order("date", { ascending: false }),
        supabase.from("clientes").select("*"),
        supabase.from("finanzas_personales").select("*").order("date", { ascending: false })
      ]);

      if (uRes.data && uRes.data.length > 0) setUsers(uRes.data);
      if (pRes.data && pRes.data.length > 0) setProducts(pRes.data);
      if (sRes.data) setSales(sRes.data);
      if (eRes.data) setExpenses(eRes.data);
      if (cRes.data) setCustomers(cRes.data);
      if (pfRes.data) setPersonalFinances(pfRes.data);
    } catch (err) {
      console.error("Error al sincronizar con Supabase:", err);
    } finally {
      setIsSyncing(false);
    }
  }, []);

  useEffect(() => {
    fetchDataFromSupabase();
  }, [fetchDataFromSupabase]);

  useEffect(() => {
    if (currentUser) {
      localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(currentUser));
    } else {
      localStorage.removeItem(AUTH_STORAGE_KEY);
    }
    if (window.lucide) window.lucide.createIcons();
  }, [currentUser, tab, sales, personalFinances]);

  const handleLogin = (userObj) => {
    setCurrentUser(userObj);
    setTab("dashboard");
  };

  const handleLogout = () => {
    setCurrentUser(null);
  };

  const handleRegister = async (newUser) => {
    setUsers(prev => [...prev, newUser]);
    setCurrentUser(newUser);
    if (supabase) {
      await supabase.from("usuarios").insert([newUser]);
    }
  };

  const ensureCustomerExists = async (name) => {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    const exists = customers.some(c => c.name.toLowerCase() === trimmed.toLowerCase());
    if (exists) return;

    const newCustomer = { id: "c-" + Date.now(), name: trimmed, phone: "" };
    setCustomers(prev => [...prev, newCustomer]);
    if (supabase) {
      await supabase.from("clientes").insert([newCustomer]);
    }
  };

  // CRUD Ventas
  const handleSaveSale = async (saleData) => {
    let updatedEntry;
    if (saleModalState === "new") {
      updatedEntry = { ...saleData, id: "s-" + Date.now() };
      setSales(prev => [updatedEntry, ...prev]);
    } else {
      updatedEntry = { ...saleData, id: saleModalState.id };
      setSales(prev => prev.map(s => s.id === saleModalState.id ? updatedEntry : s));
    }

    ensureCustomerExists(saleData.customerName);
    setSaleModalState(null);

    if (supabase) {
      await supabase.from("ventas").upsert([updatedEntry]);
    }
  };

  const handleDeleteSale = async (saleId) => {
    if (confirm("¿Estás seguro de eliminar esta venta del registro?")) {
      setSales(prev => prev.filter(s => s.id !== saleId));
      if (supabase) {
        await supabase.from("ventas").delete().eq("id", saleId);
      }
    }
  };

  // CRUD Gastos Negocio
  const handleSaveExpense = async (expenseData) => {
    let updatedEntry;
    if (expenseModalState === "new") {
      updatedEntry = { ...expenseData, id: "e-" + Date.now() };
      setExpenses(prev => [updatedEntry, ...prev]);
    } else {
      updatedEntry = { ...expenseData, id: expenseModalState.id };
      setExpenses(prev => prev.map(e => e.id === expenseModalState.id ? updatedEntry : e));
    }
    setExpenseModalState(null);

    if (supabase) {
      await supabase.from("gastos").upsert([updatedEntry]);
    }
  };

  const handleDeleteExpense = async (expenseId) => {
    if (confirm("¿Estás seguro de eliminar este gasto del registro?")) {
      setExpenses(prev => prev.filter(e => e.id !== expenseId));
      if (supabase) {
        await supabase.from("gastos").delete().eq("id", expenseId);
      }
    }
  };

  // CRUD Clientes
  const handleSaveCustomer = async (customerData) => {
    let updatedEntry;
    if (customerModalState === "new") {
      updatedEntry = { ...customerData, id: "c-" + Date.now() };
      setCustomers(prev => [updatedEntry, ...prev]);
    } else {
      updatedEntry = { ...customerData, id: customerModalState.id };
      setCustomers(prev => prev.map(c => c.id === customerModalState.id ? updatedEntry : c));
    }
    setCustomerModalState(null);

    if (supabase) {
      await supabase.from("clientes").upsert([updatedEntry]);
    }
  };

  const handleDeleteCustomer = async (customerId) => {
    if (confirm("¿Estás seguro de eliminar este cliente del registro?")) {
      setCustomers(prev => prev.filter(c => c.id !== customerId));
      if (supabase) {
        await supabase.from("clientes").delete().eq("id", customerId);
      }
    }
  };

  // CRUD Finanzas Personales
  const handleSavePersonalFinance = async (itemData) => {
    let updatedEntry;
    if (personalModalState === "new") {
      updatedEntry = { ...itemData, id: "pf-" + Date.now() };
      setPersonalFinances(prev => [updatedEntry, ...prev]);
    } else {
      updatedEntry = { ...itemData, id: personalModalState.id };
      setPersonalFinances(prev => prev.map(item => item.id === personalModalState.id ? updatedEntry : item));
    }
    setPersonalModalState(null);

    if (supabase) {
      await supabase.from("finanzas_personales").upsert([updatedEntry]);
    }
  };

  const handleDeletePersonalFinance = async (id) => {
    if (confirm("¿Eliminar este movimiento de tus finanzas personales?")) {
      setPersonalFinances(prev => prev.filter(i => i.id !== id));
      if (supabase) {
        await supabase.from("finanzas_personales").delete().eq("id", id);
      }
    }
  };

  if (!currentUser) {
    return <AuthScreen onLogin={handleLogin} onRegister={handleRegister} users={users} />;
  }

  const role = currentUser.role || "Vendedor";
  const canAccessFinances = role === "Administrador" || role === "Personal";
  const canAccessPersonal = role === "Administrador" || role === "Personal";
  const canAccessWarehouses = role === "Administrador" || role === "Bodeguero";
  const canAccessSales = role === "Administrador" || role === "Vendedor";
  const canAccessCustomers = role === "Administrador" || role === "Vendedor";

  const lowStock = products.filter(p => getProductTotalStock(p) <= (p.minStock || 0));
  const totalSales = sales.reduce((a, s) => a + Number(s.total || 0), 0);
  const totalExpenses = expenses.reduce((a, e) => a + Number(e.amount || 0), 0);
  const profit = totalSales - totalExpenses;

  // Métricas personales
  const personalIncome = personalFinances.filter(f => f.type === "ingreso").reduce((a, b) => a + Number(b.amount || 0), 0);
  const personalExpense = personalFinances.filter(f => f.type === "gasto").reduce((a, b) => a + Number(b.amount || 0), 0);
  const personalBalance = personalIncome - personalExpense;

  // EXPORTACIONES A GOOGLE SHEETS / EXCEL
  const handleExportBusinessFinances = () => {
    const today = new Date().toISOString().slice(0, 10);
    const rows = [
      ["REPORTE GENERAL - FINANZAS DEL NEGOCIO", "", "", "", ""],
      ["Fecha de Exportación:", today, "", "", ""],
      [""],
      ["--- VENTAS REGISTRADAS ---", "", "", "", ""],
      ["Fecha", "Cliente", "Detalle / Concepto", "Medio de Pago", "Monto ($)"],
      ...sales.map(s => [s.date, s.customerName, s.details || "Venta General", s.paymentMethod, s.total]),
      ["TOTAL VENTAS", "", "", "", totalSales],
      [""],
      ["--- GASTOS OPERATIVOS DEL NEGOCIO ---", "", "", "", ""],
      ["Fecha", "Categoría", "Descripción", "", "Monto ($)"],
      ...expenses.map(e => [e.date, e.category, e.description || "-", "", e.amount]),
      ["TOTAL GASTOS", "", "", "", totalExpenses],
      [""],
      ["--- RESUMEN FINANCIERO ---", "", "", "", ""],
      ["Ingresos por Ventas", "", "", "", totalSales],
      ["Egresos por Gastos", "", "", "", totalExpenses],
      ["UTILIDAD NETA (NEGOCIO)", "", "", "", profit]
    ];
    exportToGoogleSheetsCSV(`Finanzas_Negocio_${today}.csv`, rows);
  };

  const handleExportPersonalFinances = () => {
    const today = new Date().toISOString().slice(0, 10);
    const rows = [
      ["REPORTE GENERAL - ESPACIO Y FINANZAS PERSONALES", "", "", "", ""],
      ["Fecha de Exportación:", today, "", "", ""],
      [""],
      ["--- REGISTRO DE MOVIMIENTOS PERSONALES ---", "", "", "", ""],
      ["Fecha", "Tipo", "Categoría", "Descripción / Motivo", "Monto ($)"],
      ...personalFinances.map(p => [
        p.date,
        p.type === "ingreso" ? "Ingreso (+)" : "Gasto (-)",
        p.category,
        p.description || "-",
        p.type === "ingreso" ? p.amount : -Math.abs(p.amount)
      ]),
      [""],
      ["--- BALANCE PERSONAL ---", "", "", "", ""],
      ["Total Ingresos Personales", "", "", "", personalIncome],
      ["Total Gastos Personales", "", "", "", personalExpense],
      ["SALDO DISPONIBLE EN BOLSILLO", "", "", "", personalBalance]
    ];
    exportToGoogleSheetsCSV(`Finanzas_Personales_${today}.csv`, rows);
  };

  return (
    <div style={styles.appContainer}>
      <aside style={styles.sidebar}>
        <div style={styles.brand}>
          <div style={styles.brandMark}>
            <Icon name="boxes" size={18} color="#EDEAE1" />
          </div>
          <div>
            <div style={styles.brandTitle}>Almacén</div>
            <div style={styles.brandSub}>
              {isSupabaseConfigured ? "☁️ Nube Supabase Activa" : "💾 Modo Local"}
            </div>
          </div>
        </div>

        <div style={styles.userCard}>
          <div style={styles.userAvatar}>
            {currentUser.name.slice(0, 2).toUpperCase()}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={styles.userName}>{currentUser.name}</div>
            <span style={{ ...styles.roleBadge, color: role === "Personal" ? "#C084FC" : "#34D399" }}>
              {currentUser.role}
            </span>
          </div>
          <button style={styles.logoutBtn} onClick={handleLogout} title="Cerrar sesión">
            <Icon name="log-out" size={14} color="#F87171" />
          </button>
        </div>

        <nav style={styles.nav}>
          <button onClick={() => setTab("dashboard")} style={{ ...styles.navItem, ...(tab === "dashboard" ? styles.navItemActive : {}) }}>
            <Icon name="layout-dashboard" size={16} />
            <span>Panel General</span>
          </button>
          
          {canAccessPersonal && (
            <button onClick={() => setTab("personal")} style={{ ...styles.navItem, ...(tab === "personal" ? styles.navItemActive : {}) }}>
              <Icon name="wallet" size={16} color="#C084FC" />
              <span>Espacio Personal</span>
              <span style={styles.navBadgePurple}>Mío</span>
            </button>
          )}

          <button onClick={() => setTab("inventario")} style={{ ...styles.navItem, ...(tab === "inventario" ? styles.navItemActive : {}) }}>
            <Icon name="package" size={16} />
            <span>Inventario</span>
            {lowStock.length > 0 && <span style={styles.navBadge}>{lowStock.length}</span>}
          </button>
          
          {canAccessWarehouses && (
            <button onClick={() => setTab("bodegas")} style={{ ...styles.navItem, ...(tab === "bodegas" ? styles.navItemActive : {}) }}>
              <Icon name="warehouse" size={16} />
              <span>Bodegas & Traspaso</span>
            </button>
          )}

          {canAccessSales && (
            <button onClick={() => setTab("ventas")} style={{ ...styles.navItem, ...(tab === "ventas" ? styles.navItemActive : {}) }}>
              <Icon name="shopping-cart" size={16} />
              <span>Ventas & Caja</span>
            </button>
          )}

          {canAccessCustomers && (
            <button onClick={() => setTab("clientes")} style={{ ...styles.navItem, ...(tab === "clientes" ? styles.navItemActive : {}) }}>
              <Icon name="users-round" size={16} />
              <span>Clientes</span>
            </button>
          )}

          {canAccessFinances && (
            <button onClick={() => setTab("gastos")} style={{ ...styles.navItem, ...(tab === "gastos" ? styles.navItemActive : {}) }}>
              <Icon name="receipt" size={16} />
              <span>Gastos Negocio</span>
            </button>
          )}

          {(role === "Administrador") && (
            <button onClick={() => setTab("usuarios")} style={{ ...styles.navItem, ...(tab === "usuarios" ? styles.navItemActive : {}) }}>
              <Icon name="shield-check" size={16} />
              <span>Equipo & Roles</span>
            </button>
          )}
        </nav>

        <div style={styles.footerStatus}>
          <span style={styles.statusDot}></span>
          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {isSyncing ? "Sincronizando..." : currentUser.email}
          </span>
          {isSupabaseConfigured && (
            <button onClick={fetchDataFromSupabase} style={{ background: "none", border: "none", cursor: "pointer", marginLeft: "auto", color: "#94A3B8" }} title="Actualizar datos">
              <Icon name="refresh-cw" size={12} />
            </button>
          )}
        </div>
      </aside>

      <main style={styles.main}>
        {tab === "dashboard" && (
          <Dashboard
            currentUser={currentUser}
            canAccessSales={canAccessSales}
            canAccessPersonal={canAccessPersonal}
            sales={sales}
            expenses={expenses}
            products={products}
            lowStock={lowStock}
            locations={locations}
            customers={customers}
            totalSales={totalSales}
            totalExpenses={totalExpenses}
            profit={profit}
            personalFinances={personalFinances}
            personalIncome={personalIncome}
            personalExpense={personalExpense}
            personalBalance={personalBalance}
            onNewSale={() => setSaleModalState("new")}
            onNewPersonal={() => setPersonalModalState("new")}
            onGoToPersonal={() => setTab("personal")}
            onExportBusiness={handleExportBusinessFinances}
            onExportPersonal={handleExportPersonalFinances}
          />
        )}

        {tab === "personal" && canAccessPersonal && (
          <PersonalFinancesManager
            personalFinances={personalFinances}
            income={personalIncome}
            expense={personalExpense}
            balance={personalBalance}
            onNew={() => setPersonalModalState("new")}
            onEdit={(item) => setPersonalModalState(item)}
            onDelete={handleDeletePersonalFinance}
            onExport={handleExportPersonalFinances}
          />
        )}

        {tab === "inventario" && (
          <div>
            <div style={styles.pageHeader}>
              <div>
                <div style={styles.eyebrow}>INVENTARIO & CATÁLOGO</div>
                <h2 style={styles.pageTitle}>Fichas de Productos y Existencias</h2>
              </div>
            </div>
            <div style={styles.tagGrid}>
              {products.map(p => (
                <div key={p.id} style={styles.productGlassCard}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={styles.categoryBadge}>{p.category}</span>
                    {getProductTotalStock(p) <= p.minStock && (
                      <span style={styles.stockLowBadge}>Stock Crítico</span>
                    )}
                  </div>
                  <div style={{ fontSize: 16, fontWeight: 700, margin: "10px 0 2px", color: "#F8FAFC" }}>{p.name}</div>
                  <div style={{ fontSize: 11, color: "#94A3B8", fontFamily: "monospace" }}>SKU: {p.sku}</div>
                  <div style={styles.cardDivider}></div>
                  <div style={styles.tagRow}><span>Precio Venta:</span><strong style={{ color: "#34D399" }}>{money(p.salePrice)}</strong></div>
                  <div style={styles.tagRow}><span>Costo Unitario:</span><span>{money(p.costPrice)}</span></div>
                  <div style={styles.tagRow}><span>Stock Global:</span><strong style={{ color: "#38BDF8" }}>{getProductTotalStock(p)} un.</strong></div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab === "bodegas" && canAccessWarehouses && (
          <div>
            <div style={styles.pageHeader}>
              <div>
                <div style={styles.eyebrow}>LOGÍSTICA MULTI-BODEGA</div>
                <h2 style={styles.pageTitle}>Distribución de Stock por Almacén</h2>
              </div>
            </div>
            <div style={styles.dashGrid}>
              {locations.map(loc => (
                <div key={loc.id} style={styles.panel}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
                    <Icon name="building-2" size={18} color="#34D399" />
                    <h3 style={{ color: "#F1F5F9", margin: 0, fontSize: 16 }}>{loc.name}</h3>
                  </div>
                  {products.map(p => (
                    <div key={p.id} style={styles.listRow}>
                      <span style={{ color: "#CBD5E1" }}>{p.name}</span>
                      <strong style={{ color: "#38BDF8" }}>{p.stockByLocation?.[loc.id] || 0} un.</strong>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        )}

        {tab === "ventas" && canAccessSales && (
          <div>
            <div style={styles.pageHeader}>
              <div>
                <div style={styles.eyebrow}>PUNTO DE VENTA & CAJA</div>
                <h2 style={styles.pageTitle}>Registro de Ventas Comerciales</h2>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={styles.sheetsExportBtn} onClick={handleExportBusinessFinances} title="Exportar ventas a Google Sheets">
                  <Icon name="file-spreadsheet" size={14} color="#34D399" /> Exportar Sheets
                </button>
                <button style={styles.primaryBtn} onClick={() => setSaleModalState("new")}>
                  <Icon name="plus" size={14} /> Registrar Venta
                </button>
              </div>
            </div>
            <div style={styles.panel}>
              <table style={styles.table}>
                <thead>
                  <tr style={styles.tableHeaderRow}>
                    <th style={{ padding: "12px 10px" }}>Fecha</th>
                    <th>Cliente</th>
                    <th>Detalle / Concepto</th>
                    <th>Medio de Pago</th>
                    <th>Total</th>
                    <th style={{ textAlign: "right", paddingRight: 10 }}>Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  {sales.length === 0 ? (
                    <tr>
                      <td colSpan="6" style={{ padding: 24, textAlign: "center", color: "#64748B" }}>
                        No hay ventas registradas.
                      </td>
                    </tr>
                  ) : (
                    sales.map(s => (
                      <tr key={s.id} style={styles.tableRow}>
                        <td style={{ padding: 10, color: "#94A3B8" }}>{s.date}</td>
                        <td style={{ fontWeight: 600, color: "#F8FAFC" }}>{s.customerName}</td>
                        <td style={{ color: "#94A3B8" }}>{s.details || "Venta general"}</td>
                        <td><span style={styles.badgeGray}>{s.paymentMethod}</span></td>
                        <td style={{ color: "#34D399", fontWeight: 700 }}>{money(s.total)}</td>
                        <td style={{ textAlign: "right", paddingRight: 10 }}>
                          <button style={styles.actionIconBtn} onClick={() => setSaleModalState(s)} title="Modificar">
                            <Icon name="pencil" size={14} color="#38BDF8" />
                          </button>
                          <button style={styles.actionIconBtn} onClick={() => handleDeleteSale(s.id)} title="Eliminar">
                            <Icon name="trash-2" size={14} color="#F87171" />
                          </button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab === "clientes" && canAccessCustomers && (
          <ClientesManager
            customers={customers}
            sales={sales}
            onNew={() => setCustomerModalState("new")}
            onEdit={(c) => setCustomerModalState(c)}
            onDelete={handleDeleteCustomer}
          />
        )}

        {tab === "gastos" && canAccessFinances && (
          <GastosManager
            expenses={expenses}
            totalExpenses={totalExpenses}
            onNew={() => setExpenseModalState("new")}
            onEdit={(e) => setExpenseModalState(e)}
            onDelete={handleDeleteExpense}
            onExport={handleExportBusinessFinances}
          />
        )}

        {tab === "usuarios" && (role === "Administrador") && (
          <UsersManager users={users} onAddUser={async (u) => {
            setUsers(prev => [...prev, u]);
            if (supabase) await supabase.from("usuarios").insert([u]);
          }} />
        )}
      </main>

      {/* Modales */}
      {saleModalState && (
        <SaleModal
          sale={saleModalState === "new" ? null : saleModalState}
          customers={customers}
          onClose={() => setSaleModalState(null)}
          onSave={handleSaveSale}
        />
      )}

      {expenseModalState && (
        <ExpenseModal
          expense={expenseModalState === "new" ? null : expenseModalState}
          onClose={() => setExpenseModalState(null)}
          onSave={handleSaveExpense}
        />
      )}

      {customerModalState && (
        <CustomerModal
          customer={customerModalState === "new" ? null : customerModalState}
          onClose={() => setCustomerModalState(null)}
          onSave={handleSaveCustomer}
        />
      )}

      {personalModalState && (
        <PersonalFinanceModal
          item={personalModalState === "new" ? null : personalModalState}
          onClose={() => setPersonalModalState(null)}
          onSave={handleSavePersonalFinance}
        />
      )}
    </div>
  );
}

// ============ DASHBOARD ============
function Dashboard({ 
  currentUser, canAccessSales, canAccessPersonal, sales, expenses, products, lowStock, locations, customers, 
  totalSales, totalExpenses, profit, personalFinances, personalIncome, personalExpense, personalBalance,
  onNewSale, onNewPersonal, onGoToPersonal, onExportBusiness, onExportPersonal
}) {
  const trendCanvasRef = useRef(null);
  const expenseCanvasRef = useRef(null);
  const chartRefs = useRef({ trend: null, expense: null });

  const last7Days = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    return days;
  }, []);

  const salesByDay = useMemo(() => {
    return last7Days.map(day => sales.filter(s => s.date === day).reduce((a, s) => a + Number(s.total || 0), 0));
  }, [sales, last7Days]);

  const expensesByDay = useMemo(() => {
    return last7Days.map(day => expenses.filter(e => e.date === day).reduce((a, e) => a + Number(e.amount || 0), 0));
  }, [expenses, last7Days]);

  const expensesByCategory = useMemo(() => {
    const map = {};
    expenses.forEach(e => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
    return map;
  }, [expenses]);

  useEffect(() => {
    if (!window.Chart) return;

    if (chartRefs.current.trend) chartRefs.current.trend.destroy();
    if (trendCanvasRef.current) {
      chartRefs.current.trend = new window.Chart(trendCanvasRef.current, {
        type: "line",
        data: {
          labels: last7Days.map(d => d.slice(5)),
          datasets: [
            { 
              label: "Ventas Negocio", 
              data: salesByDay, 
              borderColor: "#34D399", 
              backgroundColor: "rgba(52, 211, 153, 0.15)", 
              borderWidth: 2.5,
              tension: 0.35, 
              fill: true 
            },
            { 
              label: "Gastos Negocio", 
              data: expensesByDay, 
              borderColor: "#F87171", 
              backgroundColor: "rgba(248, 113, 113, 0.1)", 
              borderWidth: 2,
              tension: 0.35, 
              fill: true 
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#CBD5E1", font: { size: 11 } } } },
          scales: {
            x: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } },
            y: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } }
          }
        }
      });
    }

    if (chartRefs.current.expense) chartRefs.current.expense.destroy();
    if (expenseCanvasRef.current) {
      const labels = Object.keys(expensesByCategory);
      const data = Object.values(expensesByCategory);
      chartRefs.current.expense = new window.Chart(expenseCanvasRef.current, {
        type: "doughnut",
        data: {
          labels: labels.length ? labels : ["Sin gastos"],
          datasets: [{
            data: data.length ? data : [1],
            backgroundColor: ["#10B981", "#38BDF8", "#F87171", "#FBBF24", "#A78BFA", "#EC4899", "#64748B"],
            borderWidth: 1,
            borderColor: "rgba(255,255,255,0.1)"
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "bottom", labels: { color: "#CBD5E1", font: { size: 10 }, boxWidth: 10 } } }
        }
      });
    }

    return () => {
      if (chartRefs.current.trend) chartRefs.current.trend.destroy();
      if (chartRefs.current.expense) chartRefs.current.expense.destroy();
    };
  }, [salesByDay, expensesByDay, expensesByCategory, last7Days]);

  return (
    <div>
      <div style={styles.pageHeader}>
        <div>
          <div style={styles.eyebrow}>RESUMEN INTEGRAL & CONTROL</div>
          <h2 style={styles.pageTitle}>Bienvenido, {currentUser.name} ✨</h2>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          {canAccessPersonal && (
            <button style={styles.purpleBtn} onClick={onNewPersonal}>
              <Icon name="plus" size={14} /> Movimiento Personal
            </button>
          )}
          {canAccessSales && (
            <button style={styles.primaryBtn} onClick={onNewSale}>
              <Icon name="shopping-bag" size={14} /> Registrar Venta
            </button>
          )}
        </div>
      </div>

      {/* SECCIÓN 1: FINANZAS DEL NEGOCIO */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={styles.sectionHeader}>
          <Icon name="briefcase" size={17} color="#34D399" />
          <span style={styles.sectionTitle}>Finanzas & Operación del Negocio</span>
        </div>
        <button style={styles.sheetsExportBtn} onClick={onExportBusiness}>
          <Icon name="file-spreadsheet" size={14} color="#34D399" /> Exportar a Sheets
        </button>
      </div>

      <div style={styles.kpiGrid}>
        <div style={styles.kpiCard}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={styles.kpiLabel}>Ventas del Negocio</span>
            <Icon name="trending-up" size={15} color="#34D399" />
          </div>
          <div style={{ ...styles.kpiValue, color: "#34D399" }}>{money(totalSales)}</div>
          <span style={styles.kpiSub}>Ingresos totales en ventas</span>
        </div>

        <div style={styles.kpiCard}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={styles.kpiLabel}>Gastos Operativos</span>
            <Icon name="trending-down" size={15} color="#F87171" />
          </div>
          <div style={{ ...styles.kpiValue, color: "#F87171" }}>{money(totalExpenses)}</div>
          <span style={styles.kpiSub}>Arriendo, insumos y compras</span>
        </div>

        <div style={styles.kpiCard}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={styles.kpiLabel}>Utilidad Neta (Negocio)</span>
            <Icon name="dollar-sign" size={15} color={profit >= 0 ? "#38BDF8" : "#F87171"} />
          </div>
          <div style={{ ...styles.kpiValue, color: profit >= 0 ? "#38BDF8" : "#F87171" }}>{money(profit)}</div>
          <span style={styles.kpiSub}>Margen bruto - costos</span>
        </div>

        <div style={styles.kpiCard}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={styles.kpiLabel}>Catálogo & Alertas</span>
            <Icon name="package-check" size={15} color="#FBBF24" />
          </div>
          <div style={{ ...styles.kpiValue, color: "#F1F5F9" }}>{products.length} <span style={{ fontSize: 13, color: "#94A3B8" }}>prods.</span></div>
          <span style={{ ...styles.kpiSub, color: lowStock.length > 0 ? "#F87171" : "#34D399" }}>
            {lowStock.length > 0 ? `⚠️ ${lowStock.length} con stock bajo` : "✓ Stock en óptimo estado"}
          </span>
        </div>
      </div>

      <div style={styles.dashGrid}>
        <div style={styles.panel}>
          <div style={styles.panelTitleRow}>
            <h3 style={styles.panelTitle}>Rendimiento Comercial (Últimos 7 días)</h3>
            <span style={styles.badgeGlass}>Flujo Negocio</span>
          </div>
          <div style={{ height: 210 }}>
            <canvas ref={trendCanvasRef}></canvas>
          </div>
        </div>

        <div style={styles.panel}>
          <div style={styles.panelTitleRow}>
            <h3 style={styles.panelTitle}>Distribución de Costos del Negocio</h3>
            <span style={styles.badgeGlass}>Por Categoría</span>
          </div>
          <div style={{ height: 210 }}>
            <canvas ref={expenseCanvasRef}></canvas>
          </div>
        </div>
      </div>

      {/* SECCIÓN 2: ESPACIO & FINANZAS PERSONALES */}
      {canAccessPersonal && (
        <div style={{ marginTop: 28 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <div style={{ ...styles.sectionHeader, borderLeftColor: "#A855F7" }}>
              <Icon name="wallet" size={17} color="#C084FC" />
              <span style={{ ...styles.sectionTitle, color: "#E9D5FF" }}>Espacio de Cosas Personales & Finanzas</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={styles.purpleExportBtn} onClick={onExportPersonal}>
                <Icon name="file-spreadsheet" size={14} color="#C084FC" /> Exportar Personal
              </button>
              <button onClick={onGoToPersonal} style={styles.linkGlassBtn}>
                Ver historial completo &rarr;
              </button>
            </div>
          </div>

          <div style={styles.kpiGrid}>
            <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.25)" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Ingresos Personales</span>
                <Icon name="arrow-down-left" size={15} color="#34D399" />
              </div>
              <div style={{ ...styles.kpiValue, color: "#34D399" }}>{money(personalIncome)}</div>
              <span style={styles.kpiSub}>Retiros de negocio y otros</span>
            </div>

            <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.25)" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Gastos Personales</span>
                <Icon name="arrow-up-right" size={15} color="#F87171" />
              </div>
              <div style={{ ...styles.kpiValue, color: "#F87171" }}>{money(personalExpense)}</div>
              <span style={styles.kpiSub}>Gastos diarios, ocio y vida</span>
            </div>

            <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.35)", background: "rgba(168, 85, 247, 0.08)" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={styles.kpiLabel}>Saldo Personal Disponible</span>
                <Icon name="piggy-bank" size={16} color="#C084FC" />
              </div>
              <div style={{ ...styles.kpiValue, color: personalBalance >= 0 ? "#C084FC" : "#F87171" }}>
                {money(personalBalance)}
              </div>
              <span style={styles.kpiSub}>Balance neto en bolsillo</span>
            </div>
          </div>

          <div style={styles.dashGrid}>
            <div style={styles.panel}>
              <div style={styles.panelTitleRow}>
                <h3 style={styles.panelTitle}>Últimos Movimientos Personales</h3>
                <button style={styles.smallGlassBtn} onClick={onNewPersonal}>+ Agregar</button>
              </div>
              {personalFinances.length === 0 ? (
                <p style={{ color: "#64748B", fontSize: 13 }}>No has registrado movimientos personales aún.</p>
              ) : (
                personalFinances.slice(0, 4).map(item => (
                  <div key={item.id} style={styles.listRow}>
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 13, color: "#F1F5F9" }}>{item.description || item.category}</div>
                      <span style={{ fontSize: 11, color: "#94A3B8" }}>{item.date} • {item.category}</span>
                    </div>
                    <strong style={{ color: item.type === "ingreso" ? "#34D399" : "#F87171", fontSize: 13 }}>
                      {item.type === "ingreso" ? "+" : "-"}{money(item.amount)}
                    </strong>
                  </div>
                ))
              )}
            </div>

            <div style={styles.panel}>
              <div style={styles.panelTitleRow}>
                <h3 style={styles.panelTitle}>Recordatorios & Cosas Personales</h3>
                <span style={styles.badgeGlass}>Notas Rápidas</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div style={styles.glassNote}>
                  <Icon name="check-circle-2" size={15} color="#34D399" />
                  <span style={{ fontSize: 12.5, color: "#CBD5E1" }}>Separar el 20% de las ventas semanales para fondo de reserva.</span>
                </div>
                <div style={styles.glassNote}>
                  <Icon name="clock" size={15} color="#FBBF24" />
                  <span style={{ fontSize: 12.5, color: "#CBD5E1" }}>Revisar pagos de servicios básicos antes del fin de mes.</span>
                </div>
                <div style={styles.glassNote}>
                  <Icon name="sparkles" size={15} color="#38BDF8" />
                  <span style={{ fontSize: 12.5, color: "#CBD5E1" }}>Sincronización multi-dispositivo activa en tiempo real.</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ MÓDULO PERSONAL ============
function PersonalFinancesManager({ personalFinances, income, expense, balance, onNew, onEdit, onDelete, onExport }) {
  return (
    <div>
      <div style={styles.pageHeader}>
        <div>
          <div style={{ ...styles.eyebrow, color: "#C084FC" }}>GESTIÓN INDEPENDIENTE</div>
          <h2 style={styles.pageTitle}>Mi Espacio & Finanzas Personales 💳</h2>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button style={styles.purpleExportBtn} onClick={onExport}>
            <Icon name="file-spreadsheet" size={14} color="#C084FC" /> Exportar a Google Sheets
          </button>
          <button style={styles.purpleBtn} onClick={onNew}>
            <Icon name="plus" size={14} /> Registrar Movimiento
          </button>
        </div>
      </div>

      <div style={styles.kpiGrid}>
        <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.25)" }}>
          <span style={styles.kpiLabel}>Ingresos Registrados</span>
          <div style={{ ...styles.kpiValue, color: "#34D399" }}>{money(income)}</div>
        </div>
        <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.25)" }}>
          <span style={styles.kpiLabel}>Gastos Registrados</span>
          <div style={{ ...styles.kpiValue, color: "#F87171" }}>{money(expense)}</div>
        </div>
        <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.35)", background: "rgba(168, 85, 247, 0.08)" }}>
          <span style={styles.kpiLabel}>Saldo Personal Neto</span>
          <div style={{ ...styles.kpiValue, color: balance >= 0 ? "#C084FC" : "#F87171" }}>{money(balance)}</div>
        </div>
        <div style={{ ...styles.kpiCard, borderColor: "rgba(168, 85, 247, 0.25)" }}>
          <span style={styles.kpiLabel}>Total Movimientos</span>
          <div style={{ ...styles.kpiValue, color: "#F1F5F9" }}>{personalFinances.length}</div>
        </div>
      </div>

      <div style={styles.panel}>
        <table style={styles.table}>
          <thead>
            <tr style={styles.tableHeaderRow}>
              <th style={{ padding: "12px 10px" }}>Fecha</th>
              <th>Tipo</th>
              <th>Categoría</th>
              <th>Descripción</th>
              <th>Monto</th>
              <th style={{ textAlign: "right", paddingRight: 10 }}>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {personalFinances.length === 0 ? (
              <tr>
                <td colSpan="6" style={{ padding: 24, textAlign: "center", color: "#64748B" }}>
                  Aún no tienes movimientos personales registrados.
                </td>
              </tr>
            ) : (
              personalFinances.map(item => (
                <tr key={item.id} style={styles.tableRow}>
                  <td style={{ padding: 10, color: "#94A3B8" }}>{item.date}</td>
                  <td>
                    <span style={item.type === "ingreso" ? styles.badgeGreen : styles.badgeRed}>
                      {item.type === "ingreso" ? "Ingreso" : "Gasto"}
                    </span>
                  </td>
                  <td style={{ color: "#E2E8F0" }}>{item.category}</td>
                  <td style={{ color: "#94A3B8" }}>{item.description || "-"}</td>
                  <td style={{ fontWeight: 700, color: item.type === "ingreso" ? "#34D399" : "#F87171" }}>
                    {item.type === "ingreso" ? "+" : "-"}{money(item.amount)}
                  </td>
                  <td style={{ textAlign: "right", paddingRight: 10 }}>
                    <button style={styles.actionIconBtn} onClick={() => onEdit(item)} title="Editar">
                      <Icon name="pencil" size={14} color="#C084FC" />
                    </button>
                    <button style={styles.actionIconBtn} onClick={() => onDelete(item.id)} title="Eliminar">

// ============ CLIENTES ============
function ClientesManager({ customers, sales, onNew, onEdit, onDelete }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const customerStats = useMemo(() => {
    return customers.map(c => {
      const customerSales = sales.filter(s => s.customerName.toLowerCase() === c.name.toLowerCase());
      const totalSpent = customerSales.reduce((a, s) => a + Number(s.total || 0), 0);
      const lastPurchase = customerSales.length ? customerSales.map(s => s.date).sort().reverse()[0] : null;
      return { ...c, purchaseCount: customerSales.length, totalSpent, lastPurchase };
    }).sort((a, b) => b.totalSpent - a.totalSpent);
  }, [customers, sales]);

  useEffect(() => {
    if (!window.Chart) return;
    if (chartRef.current) chartRef.current.destroy();
    if (canvasRef.current) {
      const top = customerStats.slice(0, 6);
      chartRef.current = new window.Chart(canvasRef.current, {
        type: "bar",
        data: {
          labels: top.map(c => c.name),
          datasets: [{ 
            label: "Total comprado", 
            data: top.map(c => c.totalSpent), 
            backgroundColor: "rgba(52, 211, 153, 0.75)",
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: "y",
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#64748B", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.05)" } },
            y: { ticks: { color: "#E2E8F0", font: { size: 11 } }, grid: { display: false } }
          }
        }
      });
    }
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [customerStats]);

  return (
    <div>
      <div style={styles.pageHeader}>
        <div>
          <div style={styles.eyebrow}>CRM & CARTERA</div>
          <h2 style={styles.pageTitle}>Fichas de Clientes e Historial de Compra</h2>
        </div>
        <button style={styles.primaryBtn} onClick={onNew}>
          <Icon name="user-plus" size={14} /> Agregar Cliente
        </button>
      </div>

      <div style={styles.panel}>
        <h3 style={styles.panelTitle}>Top Clientes por Monto Comprado</h3>
        <div style={{ height: 210 }}>
          <canvas ref={canvasRef}></canvas>
        </div>
      </div>

      <div style={{ ...styles.panel, marginTop: 16 }}>
        <table style={styles.table}>
          <thead>
            <tr style={styles.tableHeaderRow}>
              <th style={{ padding: "12px 10px" }}>Nombre</th>
              <th>Teléfono</th>
              <th>N° Compras</th>
              <th>Total Comprado</th>
              <th>Última Compra</th>
              <th style={{ textAlign: "right", paddingRight: 10 }}>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {customerStats.length === 0 ? (
              <tr>
                <td colSpan="6" style={{ padding: 24, textAlign: "center", color: "#64748B" }}>
                  No hay clientes registrados todavía.
                </td>
              </tr>
            ) : (
              customerStats.map(c => (
                <tr key={c.id} style={styles.tableRow}>
                  <td style={{ padding: 10, fontWeight: 600, color: "#F8FAFC" }}>{c.name}</td>
                  <td style={{ color: "#94A3B8" }}>{c.phone || "-"}</td>
                  <td><span style={styles.badgeGray}>{c.purchaseCount} ped.</span></td>
                  <td style={{ color: "#34D399", fontWeight: 700 }}>{money(c.totalSpent)}</td>
                  <td style={{ color: "#94A3B8" }}>{c.lastPurchase || "-"}</td>
                  <td style={{ textAlign: "right", paddingRight: 10 }}>
                    <button style={styles.actionIconBtn} onClick={() => onEdit(c)} title="Modificar">
                      <Icon name="pencil" size={14} color="#38BDF8" />
                    </button>
                    <button style={styles.actionIconBtn} onClick={() => onDelete(c.id)} title="Eliminar">
                      <Icon name="trash-2" size={14} color="#F87171" />
                    </button>
                  </td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AuthScreen({ onLogin, onRegister, users }) {
  const [isRegister, setIsRegister] = useState(false);
  const [email, setEmail] = useState("admin@negocio.cl");
  const [pass, setPass] = useState("123");
  const [name, setName] = useState("");
  const [role, setRole] = useState("Personal");
  const [error, setError] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    setError("");
    if (isRegister) {
      if (!name.trim() || !email.trim() || !pass.trim()) {
        setError("Todos los campos son obligatorios.");
        return;
      }
      if (users.some(u => u.email.toLowerCase() === email.trim().toLowerCase())) {
        setError("Ya existe un usuario con este correo.");
        return;
      }
      const newUser = { id: "u-" + Date.now(), name: name.trim(), email: email.trim(), pass, role };
      onRegister(newUser);
    } else {
      const userFound = users.find(u => u.email.toLowerCase() === email.trim().toLowerCase() && u.pass === pass);
      if (userFound) {
        onLogin(userFound);
      } else {
        setError("Credenciales incorrectas. Verifica tus datos.");
      }
    }
  };

  const setDemo = (userEmail) => {
    const u = users.find(x => x.email === userEmail);
    if (u) {
      setEmail(u.email);
      setPass(u.pass);
    }
  };

  return (
    <div style={styles.authContainer}>
      <div style={styles.authGlassCard}>
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={styles.authLogo}>
            <Icon name="boxes" size={24} color="#EDEAE1" />
          </div>
          <h2 style={{ color: "#F8FAFC", margin: "10px 0 4px", fontSize: 22, fontWeight: 700 }}>Almacén PRO</h2>
          <p style={{ color: "#94A3B8", fontSize: 13 }}>Gestión Multi-Bodega & Finanzas Personales</p>
        </div>

        <div style={styles.authTabs}>
          <button type="button" style={{ ...styles.authTabBtn, ...(isRegister ? {} : styles.authTabActive) }} onClick={() => { setIsRegister(false); setError(""); }}>Iniciar Sesión</button>
          <button type="button" style={{ ...styles.authTabBtn, ...(isRegister ? styles.authTabActive : {}) }} onClick={() => { setIsRegister(true); setError(""); }}>Crear Cuenta</button>
        </div>

        <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {isRegister && (
            <div>
              <label style={styles.inputLabel}>Nombre completo</label>
              <input style={styles.glassInput} placeholder="Ej: Benjamín Parra" value={name} onChange={(e) => setName(e.target.value)} required />
            </div>
          )}
          <div>
            <label style={styles.inputLabel}>Correo electrónico</label>
            <input style={styles.glassInput} type="email" placeholder="usuario@negocio.cl" value={email} onChange={(e) => setEmail(e.target.value)} required />
          </div>
          <div>
            <label style={styles.inputLabel}>Contraseña</label>
            <input style={styles.glassInput} type="password" placeholder="••••••••" value={pass} onChange={(e) => setPass(e.target.value)} required />
          </div>
          {isRegister && (
            <div>
              <label style={styles.inputLabel}>Rol / Tipo de Perfil</label>
              <select style={styles.glassInput} value={role} onChange={(e) => setRole(e.target.value)}>
                <option value="Personal">Personal (Finanzas Personales + Visión Global)</option>
                <option value="Administrador">Administrador (Acceso Total Negocio & Personal)</option>
                <option value="Vendedor">Vendedor (Punto de Venta y Clientes)</option>
                <option value="Bodeguero">Bodeguero (Inventario y Almacenes)</option>
              </select>
            </div>
          )}
          {error && <div style={styles.errorMsg}>{error}</div>}
          <button type="submit" style={styles.submitBtn}>
            {isRegister ? "Registrar e Ingresar" : "Entrar al Sistema"}
          </button>
        </form>

        {!isRegister && (
          <div style={styles.demoSection}>
            <span style={{ fontSize: 11, color: "#94A3B8" }}>Accesos rápidos de prueba:</span>
            <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
              <button type="button" style={styles.quickDemoBtn} onClick={() => setDemo("admin@negocio.cl")}>Admin</button>
              <button type="button" style={{ ...styles.quickDemoBtn, borderColor: "rgba(168,85,247,0.4)" }} onClick={() => setDemo("personal@negocio.cl")}>Personal ✨</button>
              <button type="button" style={styles.quickDemoBtn} onClick={() => setDemo("ventas@negocio.cl")}>Ventas</button>
              <button type="button" style={styles.quickDemoBtn} onClick={() => setDemo("bodega@negocio.cl")}>Bodega</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

          <div style={styles.glassModal} onClick={e => e.stopPropagation()}>
            <h3 style={styles.modalTitle}>Crear Cuenta de Usuario</h3>
            <form onSubmit={handleCreate} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <label style={styles.inputLabel}>Nombre</label>
                <input style={styles.glassInput} value={name} onChange={e => setName(e.target.value)} required />
              </div>
              <div>
                <label style={styles.inputLabel}>Correo</label>
                <input style={styles.glassInput} type="email" value={email} onChange={e => setEmail(e.target.value)} required />
              </div>
              <div>
                <label style={styles.inputLabel}>Contraseña provisional</label>
                <input style={styles.glassInput} type="password" value={pass} onChange={e => setPass(e.target.value)} required />
              </div>
              <div>
                <label style={styles.inputLabel}>Rol de acceso</label>
                <select style={styles.glassInput} value={role} onChange={e => setRole(e.target.value)}>
                  <option value="Personal">Personal (Finanzas Personales + Panel)</option>
                  <option value="Administrador">Administrador (Acceso total)</option>
                  <option value="Bodeguero">Bodeguero</option>
                  <option value="Vendedor">Vendedor</option>
                </select>
              </div>
              <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 }}>
                <button type="button" style={styles.secondaryBtn} onClick={() => setModal(false)}>Cancelar</button>
                <button type="submit" style={styles.primaryBtn}>Crear Usuario</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}
