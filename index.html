    * {

    }
    body[data-warehouse-theme="warm"] {

    }
    /* Orbes de luz ambiental de fondo para efecto Glassmorphism */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, #0c4f1c, #063111); top: -80px; left: -80px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #0ea5e9, #0369a1); bottom: -60px; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 320px; height: 320px; background: radial-gradient(circle, #8b5cf6, #5b21b6); top: 40%; left: 45%; opacity: 0.25; animation-delay: -10s; }
    body[data-warehouse-theme="warm"] .orb-1 { background: radial-gradient(circle, #b45309, #78350f); opacity: 0.38; }
    body[data-warehouse-theme="warm"] .orb-2 { background: radial-gradient(circle, #0f766e, #115e59); opacity: 0.35; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, 25px) scale(1.08); }
      100% { transform: translate(-25px, 45px) scale(0.95); }
    }
    #root {
      width: 100%;
      max-width: 1320px;
      z-index: 1;
      position: relative;
    }
    input, select, button, textarea {
      font-family: inherit;
    }
    option {
      background-color: #0f172a;
      color: #f1f5f9;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

    /* Contenedor deslizable horizontal para tablas en móvil */
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-scroll table {
      min-width: 560px;
    }

    /* Adaptación responsiva integral para Android e iOS */
    @media (max-width: 860px) {
      body {
        padding: 0;
        align-items: stretch;
      }
      #root {
        max-width: 100%;
      }
      /* Previene el auto-zoom forzado de Safari en iOS cuando font-size < 16px */
      input, select, textarea {
        font-size: 16px !important;
      }
      .mobile-top-bar {
        padding-top: calc(10px + env(safe-area-inset-top, 0px)) !important;
      }
      .mobile-bottom-nav {
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
      }
      .mobile-bottom-nav::-webkit-scrollbar {
        display: none;
      }
      .responsive-2col, .responsive-3col {
        grid-template-columns: 1fr !important;
      }
      .responsive-kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 10px !important;
      }
      .responsive-modal {
        max-height: 90dvh !important;
        overflow-y: auto !important;
        margin: 10px !important;
        padding: 18px 16px !important;
        border-radius: 18px !important;
      }
    }
    @media (max-width: 420px) {
      .responsive-kpi-grid {
        grid-template-columns: 1fr !important;
      }
    }

    async function hashPassword(plain, salt = "almacen_supabase_salt_v2") {
      try {
        if (!window.crypto || !window.crypto.subtle) {
          return "sha256$" + btoa(unescape(encodeURIComponent(salt + plain)));
        }
        const data = new TextEncoder().encode(salt + "::" + plain);
        const digest = await window.crypto.subtle.digest("SHA-256", data);
        return "sha256$" + Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
      } catch (e) {
        return "sha256$" + btoa(unescape(encodeURIComponent(salt + plain)));
      }
    }

    async function verifyUserPassword(userObj, inputPlain) {
      if (!userObj) return false;
      const stored = String(userObj.pass || "");
      if (stored.startsWith("sha256$")) {
        const hashedInput = await hashPassword(inputPlain);
        return stored === hashedInput;
      }
      return stored === inputPlain;
    }

    const defaultCreditCardConfig = {

      baseUsed: Number(raw?.baseUsed ?? 0),

    const saveWalletInMap = (id, wallet) => {

    const getPersonalWallet = (item) => {
      if (!item) return "Tarjeta";
      if (item.wallet === "Efectivo" || item.wallet === "Tarjeta" || item.wallet === "Crédito") return item.wallet;
      if (item.wallet === "Credito") return "Crédito";
      if (item.paymentMethod === "Efectivo") return "Efectivo";
      const desc = String(item.description || "");
      if (/^\[Efectivo\]/i.test(desc)) return "Efectivo";
      if (/^\[(Crédito|Credito)\]/i.test(desc)) return "Crédito";
      if (/^\[Tarjeta\]/i.test(desc)) return "Tarjeta";
      const map = getStoredWalletMap();
      if (item.id && map[item.id]) return map[item.id];

      return "Tarjeta";

    const getCreditCardSummary = (personalFinancesList, rawConfig) => {
      const cfg = normalizeCreditCardConfig(rawConfig);
      const list = Array.isArray(personalFinancesList) ? personalFinancesList : [];
      const creditMovements = list.filter(f => getPersonalWallet(f) === "Crédito");
      const usedFromPurchases = creditMovements
        .filter(f => f.type === "gasto")
        .reduce((acc, f) => acc + Number(f.amount || 0), 0);
      const freedFromPayments = creditMovements
        .filter(f => f.type === "ingreso")
        .reduce((acc, f) => acc + Number(f.amount || 0), 0);

      const totalLimit = Math.max(0, Number(cfg.totalLimit || 0));
      const netMovementUsed = usedFromPurchases - freedFromPayments;
      const usedAmount = Math.max(0, Number(cfg.baseUsed || 0) + netMovementUsed);
      const availableCredit = Math.max(0, totalLimit - usedAmount);
      const usagePercent = totalLimit > 0 ? Math.min(100, Math.round((usedAmount / totalLimit) * 100)) : 0;
      const availablePercent = totalLimit > 0 ? Math.max(0, 100 - usagePercent) : 0;

      // Cálculo de próxima fecha de pago y días restantes
      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let targetDate = null;

      if (cfg.nextPaymentDate && /^\d{4}-\d{2}-\d{2}$/.test(cfg.nextPaymentDate)) {
        const [y, m, d] = cfg.nextPaymentDate.split("-").map(Number);
        const explicitDate = new Date(y, m - 1, d);
        if (!isNaN(explicitDate.getTime()) && explicitDate >= todayMidnight) {
          targetDate = explicitDate;
        }
      }

      if (!targetDate) {
        const payDay = cfg.paymentDay;
        const daysInCurrentMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const candidateThisMonth = new Date(now.getFullYear(), now.getMonth(), Math.min(payDay, daysInCurrentMonth));
        if (candidateThisMonth >= todayMidnight) {
          targetDate = candidateThisMonth;
        } else {
          const daysInNextMonth = new Date(now.getFullYear(), now.getMonth() + 2, 0).getDate();
          targetDate = new Date(now.getFullYear(), now.getMonth() + 1, Math.min(payDay, daysInNextMonth));
        }
      }

      const diffMs = targetDate.getTime() - todayMidnight.getTime();
      const daysUntilPayment = Math.max(0, Math.round(diffMs / (1000 * 60 * 60 * 24)));
      const nextPaymentFormatted = targetDate.toLocaleDateString("es-CL", { day: "2-digit", month: "long" });

      return {
        ...cfg,
        totalLimit,
        usedAmount,
        availableCredit,
        usedFromPurchases,
        freedFromPayments,
        netMovementUsed,
        usagePercent,
        availablePercent,
        daysUntilPayment,
        nextPaymentFormatted,
        creditMovementsCount: creditMovements.length
      };
    };

      const rawDesc = String(r.description || "");
      let detectedWallet = r.wallet;
      if (detectedWallet === "Credito") detectedWallet = "Crédito";
      if (detectedWallet !== "Efectivo" && detectedWallet !== "Tarjeta" && detectedWallet !== "Crédito") {
        if (/^\[Efectivo\]/i.test(rawDesc)) detectedWallet = "Efectivo";

        else if (/^\[Tarjeta\]/i.test(rawDesc)) detectedWallet = "Tarjeta";
        else {

          detectedWallet = (r.id && map[r.id]) || (r.id === "pf-2" || r.id === "pf-4" ? "Efectivo" : "Tarjeta");

      const cleanDesc = rawDesc.replace(/^\[(Efectivo|Tarjeta|Crédito|Credito)\]\s*/i, "").trim();

      return {

        amount: Number(r.amount ?? 0)

    async function upsertProductToSupabase(prod) {
      if (!supabase) return { error: null };
      const clean = normalizeProduct(prod);
      const { barcode, ...noBarcode } = clean;
      const lower = {
        id: clean.id, name: clean.name, category: clean.category, sku: clean.sku, barcode: clean.barcode,
        costprice: clean.costPrice, saleprice: clean.salePrice, minstock: clean.minStock, stockbylocation: clean.stockByLocation
      };
      const { barcode: _b2, ...lowerNoBarcode } = lower;
      const snake = {
        id: clean.id, name: clean.name, category: clean.category, sku: clean.sku, barcode: clean.barcode,
        cost_price: clean.costPrice, sale_price: clean.salePrice, min_stock: clean.minStock, stock_by_location: clean.stockByLocation
      };
      const { barcode: _b3, ...snakeNoBarcode } = snake;

      const variants = [clean, noBarcode, lower, lowerNoBarcode, snake, snakeNoBarcode];
      if (schemaFormatCache.productos !== null && variants[schemaFormatCache.productos]) {
        const cachedRes = await supabase.from("productos").upsert([variants[schemaFormatCache.productos]]);
        if (!cachedRes.error) return cachedRes;
      }

      let lastRes = { error: null };
      for (let i = 0; i < variants.length; i++) {
        if (i === schemaFormatCache.productos) continue;
        lastRes = await supabase.from("productos").upsert([variants[i]]);
        if (!lastRes.error) {
          schemaFormatCache.productos = i;
          return lastRes;
        }
      }
      return lastRes;
    }

    async function upsertSaleToSupabase(sale) {

      const lower = {
        id: clean.id, date: clean.date, customername: clean.customerName,
        paymentmethod: clean.paymentMethod, total: clean.total, details: clean.details
      };
      const snake = {
        id: clean.id, date: clean.date, customer_name: clean.customerName,
        payment_method: clean.paymentMethod, total: clean.total, details: clean.details
      };
      const variants = [clean, lower, snake];

      if (schemaFormatCache.ventas !== null && variants[schemaFormatCache.ventas]) {
        const cachedRes = await supabase.from("ventas").upsert([variants[schemaFormatCache.ventas]]);
        if (!cachedRes.error) return cachedRes;

    const formatMonthLabel = (ym) => {
      if (!ym) return "";
      const [year, month] = ym.split("-");
      const monthNames = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
      ];
      const mIdx = parseInt(month, 10) - 1;
      return `${monthNames[mIdx] || month} ${year}`;
    };

    function exportToGoogleSheetsCSV(filename, rows) {
      const csvContent = "\uFEFF" + rows.map(row =>
        row.map(cell => {
          if (cell === null || cell === undefined) return '""';
          let cellStr = String(cell).replace(/"/g, '""');
          if (/^[=+\-@]/.test(cellStr)) {
            cellStr = "'" + cellStr;
          }
          return `"${cellStr}"`;
        }).join(";")
      ).join("\r\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

      // Aplica instantáneamente un snapshot recibido por Broadcast (entre dispositivos o pestañas)
      const applyCloudSnapshotPayload = useCallback((payload) => {
        if (!payload || typeof payload !== "object") return;
        if (payload.deviceId && payload.deviceId === DEVICE_ID) return;
        if (activeSavesCountRef.current > 0) return;
        const incomingTs = Number(payload.updatedAt || 0);
        if (incomingTs > 0 && incomingTs < localUpdatedAtRef.current) return;

        localUpdatedAtRef.current = Math.max(localUpdatedAtRef.current, incomingTs || Date.now());
        const tracker = getSyncTracker();
        const mergedDeleted = { ...(tracker.deletedIds || {}), ...(payload.deletedIds || {}) };

        if (Array.isArray(payload.users)) {
          const uList = payload.users.filter(u => u && u.id !== META_SYNC_ID && !mergedDeleted[u.id]).map(normalizeUser);
          const uMap = new Map(uList.map(u => [u.email.toLowerCase(), u]));

          });

        }
        if (Array.isArray(payload.products)) {
          setProducts(payload.products.filter(p => p && p.id !== META_SYNC_ID && !mergedDeleted[p.id]).map(normalizeProduct));
        }
        if (Array.isArray(payload.sales)) {
          const sList = payload.sales.filter(s => s && s.id !== META_SYNC_ID && !mergedDeleted[s.id]).map(normalizeSale);
          sList.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));

        if (Array.isArray(payload.expenses)) {

          eList.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
          setExpenses(eList);
        }
        if (Array.isArray(payload.customers)) {
          setCustomers(payload.customers.filter(c => c && c.id !== META_SYNC_ID && !mergedDeleted[c.id]).map(normalizeCustomer));
        }
        if (Array.isArray(payload.personalFinances)) {
          const pfList = payload.personalFinances.filter(pf => pf && pf.id !== META_SYNC_ID && !mergedDeleted[pf.id]).map(normalizePersonalFinance);
          pfList.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
          setPersonalFinances(pfList);
        }
        if (payload.creditCardConfig) {
          setCreditCardConfig(normalizeCreditCardConfig(payload.creditCardConfig));
        }
        if (payload.rolePermissions) {
          setRolePermissions(prev => ({ ...defaultRolePermissions, ...prev, ...payload.rolePermissions }));
        }

        const nowStr = new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        saveSyncTracker(prev => ({
          ...prev,
          deletedIds: mergedDeleted,
          dirtyIds: {},
          initialized: true,
          lastSyncAt: nowStr,
          lastCloudUpdatedAt: localUpdatedAtRef.current
        }));
        setSyncStatus(prev => ({ ...prev, state: "ok", lastSync: nowStr, error: null }));
      }, []);

      // Guarda un espejo autoritativo del estado completo en Supabase y lo transmite en vivo a otros dispositivos
      const saveCloudSnapshot = useCallback(async (overrideState = {}, deletedOverride = null) => {
        if (!supabase) return;
        try {
          const tracker = getSyncTracker();
          const mergedDeleted = deletedOverride || tracker.deletedIds || {};
          const current = { ...stateRef.current, ...overrideState };
          stateRef.current = current;

          const nextUpdatedAt = Math.max(Date.now(), (localUpdatedAtRef.current || 0) + 1);
          localUpdatedAtRef.current = nextUpdatedAt;

          const payload = {
            updatedAt: nextUpdatedAt,
            deviceId: DEVICE_ID,
            deletedIds: mergedDeleted,
            rolePermissions: current.rolePermissions,
            creditCardConfig: normalizeCreditCardConfig(current.creditCardConfig),
            products: (current.products || []).filter(p => p && p.id !== META_SYNC_ID).map(normalizeProduct),
            sales: (current.sales || []).filter(s => s && s.id !== META_SYNC_ID).map(normalizeSale),
            expenses: (current.expenses || []).filter(e => e && e.id !== META_SYNC_ID).map(normalizeExpense),
            customers: (current.customers || []).filter(c => c && c.id !== META_SYNC_ID).map(normalizeCustomer),
            personalFinances: (current.personalFinances || []).filter(pf => pf && pf.id !== META_SYNC_ID).map(normalizePersonalFinance),
            users: (current.users || []).filter(u => u && u.id !== META_SYNC_ID).map(normalizeUser)
          };

          const nowStr = new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
          saveSyncTracker(prev => ({
            ...prev,
            deletedIds: mergedDeleted,
            lastSyncAt: nowStr,
            lastCloudUpdatedAt: nextUpdatedAt
          }));

          // Transmisión instantánea por WebSocket (Supabase Broadcast) y entre pestañas locales
          if (realtimeChannelRef.current) {
            try {
              realtimeChannelRef.current.send({
                type: "broadcast",
                event: "cloud_state_update",
                payload
              });
            } catch (e) {}
          }
          if (localBroadcastRef.current) {
            try { localBroadcastRef.current.postMessage(payload); } catch (e) {}
          }

          const serialized = JSON.stringify(payload);
          const [cSnap, eSnap] = await Promise.all([
            supabase.from("clientes").upsert([{ id: META_SYNC_ID, name: "__sync_v2__", phone: serialized }]),
            supabase.from("gastos").upsert([{ id: META_SYNC_ID, date: "1970-01-01", category: "__sync_v2__", description: serialized, amount: 0 }])
          ]);
          if (cSnap.error && eSnap.error) {
            await supabase.from("ventas").upsert([{ id: META_SYNC_ID, date: "1970-01-01", customerName: "__sync_v2__", paymentMethod: "Sync", total: 0, details: serialized }]);
          }
          setSyncStatus(prev => ({ ...prev, state: "ok", lastSync: nowStr, error: null }));
        } catch (e) {}
      }, []);

      // Subida completa de todos los datos locales de este PC hacia Supabase
      const pushAllLocalDataToSupabase = useCallback(async (silent = false) => {
        if (!supabase) return false;
        activeSavesCountRef.current += 1;
        setIsSyncing(true);
        try {
          const current = stateRef.current;
          await saveCloudSnapshot(current);

          const results = await Promise.all([
            Promise.all((current.users || []).filter(u => u.id !== META_SYNC_ID).map(u => upsertUserToSupabase(u))),
            Promise.all((current.products || []).filter(p => p.id !== META_SYNC_ID).map(p => upsertProductToSupabase(p))),
            Promise.all((current.sales || []).filter(s => s.id !== META_SYNC_ID).map(s => upsertSaleToSupabase(s))),
            Promise.all((current.expenses || []).filter(e => e.id !== META_SYNC_ID).map(e => upsertExpenseToSupabase(e))),
            Promise.all((current.customers || []).filter(c => c.id !== META_SYNC_ID).map(c => upsertCustomerToSupabase(c))),
            Promise.all((current.personalFinances || []).filter(pf => pf.id !== META_SYNC_ID).map(pf => upsertPersonalFinanceToSupabase(pf)))
          ]);

          const allIds = {};
          [
            ...(current.users || []),
            ...(current.products || []),
            ...(current.sales || []),
            ...(current.expenses || []),
            ...(current.customers || []),
            ...(current.personalFinances || [])
          ].forEach(item => { if (item?.id && item.id !== META_SYNC_ID) allIds[item.id] = true; });

          const nowStr = new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
          saveSyncTracker(prev => ({
            ...prev,
            syncedIds: { ...(prev.syncedIds || {}), ...allIds },
            dirtyIds: {},
            initialized: true,
            lastSyncAt: nowStr,
            lastCloudUpdatedAt: localUpdatedAtRef.current
          }));

          const firstErr = results.flat().find(r => r && r.error)?.error;
          setSyncStatus(prev => ({
            ...prev,
            state: firstErr ? "warn" : "ok",
            lastSync: nowStr,
            error: firstErr ? (firstErr.message || String(firstErr)) : null
          }));

          if (!silent) {
            notify("Datos de este dispositivo subidos a la nube correctamente ☁️");
          }
          return !firstErr;
        } catch (err) {
          if (!silent) notify("Error al subir datos a la nube", "warn");
          return false;
        } finally {
          activeSavesCountRef.current = Math.max(0, activeSavesCountRef.current - 1);
          lastSaveFinishedAtRef.current = Date.now();
          setIsSyncing(false);
        }
      }, [notify, saveCloudSnapshot]);

      const fetchDataFromSupabase = useCallback(async (silent = false, forcePullOnly = false) => {
        if (!supabase) return;
        // Evitar que un sondeo en segundo plano pise un guardado local en curso o recién terminado
        if (silent && !forcePullOnly && (activeSavesCountRef.current > 0 || Date.now() - lastSaveFinishedAtRef.current < 2500)) {
          return;
        }
        setIsSyncing(true);
        try {
          const [uRes, pRes, sRes, eRes, cRes, pfRes] = await Promise.all([
            supabase.from("usuarios").select("*"),
            supabase.from("productos").select("*"),
            supabase.from("ventas").select("*"),
            supabase.from("gastos").select("*"),
            supabase.from("clientes").select("*"),
            supabase.from("finanzas_personales").select("*")
          ]);

          // Si el usuario guardó algo mientras esta consulta viajaba por red, abortar lectura antigua
          if (silent && !forcePullOnly && activeSavesCountRef.current > 0) {
            return;
          }

          const tableStatus = {
            usuarios: uRes.error ? uRes.error.message : `OK (${(uRes.data || []).filter(r => r.id !== META_SYNC_ID).length})`,
            productos: pRes.error ? pRes.error.message : `OK (${(pRes.data || []).filter(r => r.id !== META_SYNC_ID).length})`,
            ventas: sRes.error ? sRes.error.message : `OK (${(sRes.data || []).filter(r => r.id !== META_SYNC_ID).length})`,
            gastos: eRes.error ? eRes.error.message : `OK (${(eRes.data || []).filter(r => r.id !== META_SYNC_ID).length})`,
            clientes: cRes.error ? cRes.error.message : `OK (${(cRes.data || []).filter(r => r.id !== META_SYNC_ID).length})`,
            finanzas_personales: pfRes.error ? pfRes.error.message : `OK (${(pfRes.data || []).filter(r => r.id !== META_SYNC_ID).length})`
          };

          const anyError = uRes.error || pRes.error || sRes.error || eRes.error || cRes.error || pfRes.error;
          const allFailed = Boolean(uRes.error && pRes.error && sRes.error && eRes.error && cRes.error && pfRes.error);

          // Si Supabase está pausado o sin conexión (todas las tablas fallaron), no tocar estado ni borrar dirtyIds
          if (allFailed) {
            setSyncStatus({
              state: "error",
              lastSync: getSyncTracker().lastSyncAt || null,
              error: anyError?.message || "No se pudo conectar con Supabase (verifica que el proyecto esté activo)",
              tableStatus
            });
            return;
          }

          // Buscar el espejo global (__almacen_sync_meta_v2__) más reciente entre todas las tablas disponibles
          const metaCandidates = [
            (cRes.data || []).find(r => r.id === META_SYNC_ID)?.phone,
            (eRes.data || []).find(r => r.id === META_SYNC_ID)?.description,
            (sRes.data || []).find(r => r.id === META_SYNC_ID)?.details,
            (pfRes.data || []).find(r => r.id === META_SYNC_ID)?.description
          ].filter(Boolean);

          let cloudMeta = null;
          metaCandidates.forEach(rawStr => {
            try {
              const parsed = JSON.parse(rawStr);
              if (parsed && typeof parsed === "object") {
                if (!cloudMeta || Number(parsed.updatedAt || 0) >= Number(cloudMeta.updatedAt || 0)) {
                  cloudMeta = parsed;
                }
              }
            } catch (e) {}
          });

          const hasCloudMeta = Boolean(
            cloudMeta && (Array.isArray(cloudMeta.products) || Array.isArray(cloudMeta.sales) || Array.isArray(cloudMeta.personalFinances))
          );

          if (hasCloudMeta && Number(cloudMeta.updatedAt || 0) > localUpdatedAtRef.current) {
            localUpdatedAtRef.current = Number(cloudMeta.updatedAt);
          }

          const tracker = getSyncTracker();
          const mergedDeletedIds = { ...(tracker.deletedIds || {}), ...(cloudMeta?.deletedIds || {}) };
          const dirtyIds = forcePullOnly ? {} : (tracker.dirtyIds || {});

          const mergeCollection = (remoteRaw, metaFallbackList, localList, initialMockList, normalizer, sortByDate = false) => {
            const hasRemoteTable = Array.isArray(remoteRaw);
            const remoteNormalized = hasRemoteTable
              ? remoteRaw.filter(r => r && r.id !== META_SYNC_ID).map(normalizer)
              : [];
            const metaNormalized = Array.isArray(metaFallbackList)
              ? metaFallbackList.filter(r => r && r.id !== META_SYNC_ID).map(normalizer)
              : [];

            const remoteById = new Map();

            // 1. Cargar filas de la tabla SQL individual
            remoteNormalized.forEach(item => {
              if (!mergedDeletedIds[item.id]) {
                remoteById.set(item.id, item);
              }
            });

            // 2. Superponer datos completos del espejo autoritativo (cloudMeta conserva todos los campos intactos)
            metaNormalized.forEach(metaItem => {
              if (!mergedDeletedIds[metaItem.id]) {
                const fromTable = remoteById.get(metaItem.id);
                remoteById.set(metaItem.id, fromTable ? { ...fromTable, ...metaItem } : metaItem);
              }
            });

            const initialById = new Map((initialMockList || []).map(i => [i.id, normalizer(i)]));
            const resultById = new Map(remoteById);
            const toUpload = [];

            if (!forcePullOnly) {
              (localList || []).forEach(rawLocal => {
                if (!rawLocal || rawLocal.id === META_SYNC_ID) return;
                const localItem = normalizer(rawLocal);
                const id = localItem.id;
                if (mergedDeletedIds[id]) return;

                // Solo sobrescribir la nube si este dispositivo modificó explícitamente el registro (dirtyIds)
                if (dirtyIds[id]) {
                  resultById.set(id, localItem);
                  toUpload.push(localItem);
                  return;
                }

                // Si aún no existe espejo en la nube (o el proyecto estuvo pausado sin espejo), rescatar y subir registros creados localmente
                if (!hasCloudMeta && !remoteById.has(id)) {
                  const initItem = initialById.get(id);
                  const isUserCreatedItem = !initItem;
                  const wasAlreadySynced = Boolean(tracker.syncedIds?.[id]);
                  if (wasAlreadySynced && !isUserCreatedItem) return;
                  const isUntouchedMock = initItem && JSON.stringify(initItem) === JSON.stringify(localItem);
                  if (isUserCreatedItem || !isUntouchedMock || remoteById.size === 0) {
                    resultById.set(id, localItem);
                    toUpload.push(localItem);
                  }
                }
              });
            }

            let finalArr = Array.from(resultById.values());
            if (finalArr.length === 0 && remoteById.size === 0 && !hasCloudMeta && Object.keys(mergedDeletedIds).length === 0) {
              finalArr = (localList && localList.length > 0 ? localList : initialMockList).map(normalizer);
              finalArr.forEach(item => toUpload.push(item));
            }

            if (sortByDate) {
              finalArr.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
            }
            return { list: finalArr, toUpload };
          };

          const current = stateRef.current;
          const uMerged = mergeCollection(uRes.data, cloudMeta?.users, current.users, initialUsers, normalizeUser, false);
          // Garantizar que los usuarios base siempre existan para poder iniciar sesión
          const userMap = new Map(uMerged.list.map(u => [u.email.toLowerCase(), u]));
          initialUsers.forEach(iu => {
            if (!userMap.has(iu.email.toLowerCase())) {
              const normU = normalizeUser(iu);
              uMerged.list.push(normU);
            }
          });

          const pMerged = mergeCollection(pRes.data, cloudMeta?.products, current.products, initialMockProducts, normalizeProduct, false);
          const sMerged = mergeCollection(sRes.data, cloudMeta?.sales, current.sales, initialMockSales, normalizeSale, true);
          const eMerged = mergeCollection(eRes.data, cloudMeta?.expenses, current.expenses, initialMockExpenses, normalizeExpense, true);
          const cMerged = mergeCollection(cRes.data, cloudMeta?.customers, current.customers, initialMockCustomers, normalizeCustomer, false);
          const pfMerged = mergeCollection(pfRes.data, cloudMeta?.personalFinances, current.personalFinances, initialPersonalFinances, normalizePersonalFinance, true);

          setUsers(uMerged.list);
          setProducts(pMerged.list);
          setSales(sMerged.list);
          setExpenses(eMerged.list);
          setCustomers(cMerged.list);
          setPersonalFinances(pfMerged.list);

          if (cloudMeta?.creditCardConfig) {
            setCreditCardConfig(normalizeCreditCardConfig(cloudMeta.creditCardConfig));
          }
          if (cloudMeta?.rolePermissions) {
            setRolePermissions(prev => ({ ...defaultRolePermissions, ...prev, ...cloudMeta.rolePermissions }));
          }

          // Subir únicamente si había cambios locales pendientes (dirtyIds) o si la nube aún no tenía espejo inicial
          const totalToUpload =
            uMerged.toUpload.length + pMerged.toUpload.length + sMerged.toUpload.length +
            eMerged.toUpload.length + cMerged.toUpload.length + pfMerged.toUpload.length;

          if (!forcePullOnly && (totalToUpload > 0 || !hasCloudMeta)) {
            await Promise.all([
              ...uMerged.toUpload.map(u => upsertUserToSupabase(u)),
              ...pMerged.toUpload.map(p => upsertProductToSupabase(p)),
              ...sMerged.toUpload.map(s => upsertSaleToSupabase(s)),
              ...eMerged.toUpload.map(e => upsertExpenseToSupabase(e)),
              ...cMerged.toUpload.map(c => upsertCustomerToSupabase(c)),
              ...pfMerged.toUpload.map(pf => upsertPersonalFinanceToSupabase(pf)),
              saveCloudSnapshot({
                users: uMerged.list,
                products: pMerged.list,
                sales: sMerged.list,
                expenses: eMerged.list,
                customers: cMerged.list,
                personalFinances: pfMerged.list,
                creditCardConfig: cloudMeta?.creditCardConfig || current.creditCardConfig,
                rolePermissions: cloudMeta?.rolePermissions || current.rolePermissions
              }, mergedDeletedIds)
            ]);
          }

          // Marcar todos los IDs actuales como sincronizados una vez completada la lectura/subida exitosa
          const newSyncedIds = { ...(tracker.syncedIds || {}) };
          [
            ...uMerged.list, ...pMerged.list, ...sMerged.list,
            ...eMerged.list, ...cMerged.list, ...pfMerged.list
          ].forEach(item => { if (item?.id) newSyncedIds[item.id] = true; });

          const nowStr = new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
          saveSyncTracker({
            syncedIds: newSyncedIds,
            deletedIds: mergedDeletedIds,
            dirtyIds: {},
            initialized: true,
            lastSyncAt: nowStr,
            lastCloudUpdatedAt: localUpdatedAtRef.current
          });

          setSyncStatus({
            state: (anyError && !hasCloudMeta) ? "warn" : "ok",
            lastSync: nowStr,
            error: null,
            tableStatus
          });

          if (!silent && forcePullOnly) {
            notify("Datos actualizados desde la nube ☁️");
          }
        } catch (err) {
          console.error("Error al sincronizar con Supabase:", err);
          setSyncStatus(prev => ({
            ...prev,
            state: "error",
            error: err?.message || "No se pudo conectar con Supabase"
          }));
        } finally {
          setIsSyncing(false);
        }
      }, [notify, saveCloudSnapshot]);

      // Sincronización inicial, Realtime Broadcast + Postgres Changes, foco de pestaña e intervalo cada 6s
      useEffect(() => {
        fetchDataFromSupabase(true);

        if (typeof window !== "undefined" && "BroadcastChannel" in window) {
          try {
            const bc = new BroadcastChannel("almacen_local_tabs_sync_v2");
            bc.onmessage = (ev) => {
              if (ev?.data) applyCloudSnapshotPayload(ev.data);
            };
            localBroadcastRef.current = bc;
          } catch (e) {}
        }

        if (!supabase) return;

        let realtimeChannel = null;
        try {
          realtimeChannel = supabase
            .channel("almacen-multi-device-sync", {
              config: { broadcast: { self: false } }
            })
            .on("broadcast", { event: "cloud_state_update" }, (msg) => {
              if (msg?.payload) {
                applyCloudSnapshotPayload(msg.payload);
              }
            })
            .on("postgres_changes", { event: "*", schema: "public" }, () => {
              fetchDataFromSupabase(true);
            })
            .subscribe();
          realtimeChannelRef.current = realtimeChannel;
        } catch (e) {}

        const handleFocusOrOnline = () => {
          if (document.visibilityState === "visible") {
            fetchDataFromSupabase(true);
          }
        };

        window.addEventListener("focus", handleFocusOrOnline);
        window.addEventListener("online", handleFocusOrOnline);
        document.addEventListener("visibilitychange", handleFocusOrOnline);

        const intervalId = setInterval(() => {
          if (document.visibilityState === "visible") {
            fetchDataFromSupabase(true);
          }
        }, 6000);

        return () => {
          clearInterval(intervalId);
          window.removeEventListener("focus", handleFocusOrOnline);
          window.removeEventListener("online", handleFocusOrOnline);
          document.removeEventListener("visibilitychange", handleFocusOrOnline);
          if (localBroadcastRef.current) {
            try { localBroadcastRef.current.close(); } catch (e) {}
            localBroadcastRef.current = null;
          }
          if (realtimeChannel) {
            try { supabase.removeChannel(realtimeChannel); } catch (e) {}
            realtimeChannelRef.current = null;
          }
        };
      }, [fetchDataFromSupabase, applyCloudSnapshotPayload]);

        const updatedProduct = normalizeProduct({

          stockByLocation: {

            [fromLocId]: currentFrom - qty,
            [toLocId]: Number(prod.stockByLocation?.[toLocId] || 0) + qty
          }
        });
        const nextProducts = products.map(p => p.id === productId ? updatedProduct : p);

      const handleSavePersonalFinance = async (itemData) => {
        let updatedEntry;
        let nextPF;
        const isCreating = personalModalState === "new" || Boolean(personalModalState?.isPreset);
        if (isCreating) {
          updatedEntry = normalizePersonalFinance({ ...itemData, id: "pf-" + Date.now() });
          nextPF = [updatedEntry, ...personalFinances];
          setPersonalFinances(nextPF);
          notify(`Movimiento en ${updatedEntry.wallet || "Tarjeta"} sincronizado ☁️`);
        } else {
          updatedEntry = normalizePersonalFinance({ ...itemData, id: personalModalState.id });
          nextPF = personalFinances.map(item => item.id === personalModalState.id ? updatedEntry : item);
          setPersonalFinances(nextPF);
          notify("Movimiento personal actualizado ☁️");
        }
        markDirtyId(updatedEntry.id);
        setPersonalModalState(null);

        if (supabase) {
          activeSavesCountRef.current += 1;
          try {
            const [, { error }] = await Promise.all([
              saveCloudSnapshot({ personalFinances: nextPF }),
              upsertPersonalFinanceToSupabase(updatedEntry)
            ]);
            if (!error) markSyncedId(updatedEntry.id);
          } finally {
            activeSavesCountRef.current = Math.max(0, activeSavesCountRef.current - 1);
            lastSaveFinishedAtRef.current = Date.now();
          }
        }
      };

      const handleDeletePersonalFinance = async (id) => {
        if (confirm("¿Eliminar este movimiento de tus finanzas personales?")) {
          const nextPF = personalFinances.filter(i => i.id !== id);
          const nextTracker = markDeletedId(id);
          setPersonalFinances(nextPF);
          notify("Movimiento eliminado", "warn");
          if (supabase) {
            activeSavesCountRef.current += 1;
            try {
              await Promise.all([
                saveCloudSnapshot({ personalFinances: nextPF }, nextTracker.deletedIds),
                supabase.from("finanzas_personales").delete().eq("id", id)
              ]);
            } finally {
              activeSavesCountRef.current = Math.max(0, activeSavesCountRef.current - 1);
              lastSaveFinishedAtRef.current = Date.now();
            }
          }
        }
      };

      const handleSaveCreditCardConfig = async (newConfig) => {
        const cleanCfg = normalizeCreditCardConfig({
          ...creditCardConfig,
          ...newConfig,
          updatedAt: Date.now()
        });
        setCreditCardConfig(cleanCfg);
        try {
          localStorage.setItem(CREDIT_CARD_CONFIG_KEY, JSON.stringify(cleanCfg));
        } catch (err) {}
        setCreditCardModalOpen(false);
        notify("Configuración de Tarjeta de Crédito guardada y sincronizada ☁️");

        if (supabase) {
          activeSavesCountRef.current += 1;
          try {
            await saveCloudSnapshot({ creditCardConfig: cleanCfg });
          } finally {
            activeSavesCountRef.current = Math.max(0, activeSavesCountRef.current - 1);
            lastSaveFinishedAtRef.current = Date.now();
          }
        }
      };

      // CONDICIONAL DE AUTENTICACIÓN (DESPUÉS DE TODOS LOS HOOKS)
      if (!currentUser) {
        return <AuthScreen onLogin={handleLogin} onRegister={handleRegister} users={users} />;
      }

      const role = currentUser.role || "Vendedor";
      const activePerms = rolePermissions[role] || defaultRolePermissions[role] || defaultRolePermissions.Vendedor;

      const canAccessFinances = Boolean(activePerms.gastos);
      const canAccessPersonal = Boolean(activePerms.personal);
      const canAccessWarehouses = Boolean(activePerms.bodegas);
      const canAccessSales = Boolean(activePerms.ventas);
      const canAccessCustomers = Boolean(activePerms.clientes);
      const canManageInventory = Boolean(activePerms.canManageInventory);
      const canViewCosts = Boolean(activePerms.canViewCosts);

      const lowStock = products.filter(p => getProductTotalStock(p) <= (p.minStock || 0));
      const totalSales = sales.reduce((a, s) => a + Number(s.total || 0), 0);
      const totalExpenses = expenses.reduce((a, e) => a + Number(e.amount || 0), 0);
      const profit = totalSales - totalExpenses;

      const personalCashIncome = personalFinances.filter(f => f.type === "ingreso" && getPersonalWallet(f) === "Efectivo").reduce((a, b) => a + Number(b.amount || 0), 0);
      const personalCashExpense = personalFinances.filter(f => f.type === "gasto" && getPersonalWallet(f) === "Efectivo").reduce((a, b) => a + Number(b.amount || 0), 0);
      const personalCashBalance = personalCashIncome - personalCashExpense;

      const personalCardIncome = personalFinances.filter(f => f.type === "ingreso" && getPersonalWallet(f) === "Tarjeta").reduce((a, b) => a + Number(b.amount || 0), 0);
      const personalCardExpense = personalFinances.filter(f => f.type === "gasto" && getPersonalWallet(f) === "Tarjeta").reduce((a, b) => a + Number(b.amount || 0), 0);
      const personalCardBalance = personalCardIncome - personalCardExpense;

      const personalIncome = personalCashIncome + personalCardIncome;
      const personalExpense = personalCashExpense + personalCardExpense;
      const personalBalance = personalCashBalance + personalCardBalance;

      const creditCardSummary = getCreditCardSummary(personalFinances, creditCardConfig);

      const handleExportBusinessFinances = () => {
        const today = new Date().toISOString().slice(0, 10);
        const labelPeriodo = salesMonthFilter ? formatMonthLabel(salesMonthFilter) : "Historial Completo";
        const rows = [
          ["REPORTE GENERAL - FINANZAS DEL NEGOCIO", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", ""],
          ["Período Seleccionado:", labelPeriodo, "", "", ""],
          [""],
          ["--- VENTAS REGISTRADAS ---", "", "", "", ""],
          ["Fecha", "Cliente", "Detalle / Concepto", "Medio de Pago", "Monto ($)"],
          ...filteredSales.map(s => [s.date, s.customerName, s.details || "Venta General", s.paymentMethod, s.total]),
          ["TOTAL VENTAS PERÍODO", "", "", "", filteredSalesTotal],
          [""],
          ["--- GASTOS OPERATIVOS DEL NEGOCIO ---", "", "", "", ""],
          ["Fecha", "Categoría", "Descripción", "", "Monto ($)"],
          ...expenses.map(e => [e.date, e.category, e.description || "-", "", e.amount]),
          ["TOTAL GASTOS", "", "", "", totalExpenses],
          [""],
          ["--- RESUMEN FINANCIERO ---", "", "", "", ""],
          ["Ingresos por Ventas", "", "", "", totalSales],
          ["Egresos por Gastos", "", "", "", totalExpenses],
          ["UTILIDAD NETA (NEGOCIO)", "", "", "", profit]
        ];
        exportToGoogleSheetsCSV(`Finanzas_Negocio_${salesMonthFilter || "Total"}_${today}.csv`, rows);
      };

      const handleExportPersonalFinances = (filteredList, periodLabel, pIncome, pExpense, pBalance, pCashBalance = personalCashBalance, pCardBalance = personalCardBalance) => {
        const today = new Date().toISOString().slice(0, 10);
        const rows = [
          ["REPORTE GENERAL - ESPACIO Y FINANZAS PERSONALES", "", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", "", ""],
          ["Período:", periodLabel, "", "", "", ""],
          [""],
          ["--- REGISTRO DE MOVIMIENTOS PERSONALES ---", "", "", "", "", ""],
          ["Fecha", "Tipo", "Medio (Efectivo/Tarjeta/Crédito)", "Categoría", "Descripción / Motivo", "Monto ($)"],
          ...filteredList.map(p => {
            const w = getPersonalWallet(p);
            const tipoLabel = w === "Crédito"
              ? (p.type === "ingreso" ? "Pago / Abono Cupo (+)" : "Compra / Uso Cupo (-)")
              : (p.type === "ingreso" ? "Ingreso (+)" : "Gasto (-)");
            return [
              p.date,
              tipoLabel,
              w === "Crédito" ? "Tarjeta de Crédito (Cupo)" : w,
              p.category,
              p.description || "-",
              p.type === "ingreso" ? p.amount : -Math.abs(p.amount)
            ];
          }),
          [""],
          ["--- BALANCE PERSONAL DEL PERÍODO ---", "", "", "", "", ""],
          ["Total Ingresos Personales (Efectivo + Débito)", "", "", "", "", pIncome],
          ["Total Gastos Personales (Efectivo + Débito)", "", "", "", "", pExpense],
          ["Saldo en Efectivo", "", "", "", "", pCashBalance],
          ["Saldo en Tarjeta / Banco", "", "", "", "", pCardBalance],
          ["SALDO TOTAL DISPONIBLE (EFECTIVO + BANCO)", "", "", "", "", pBalance],
          [""],
          ["--- ESTADO TARJETA DE CRÉDITO (CUPO & PAGO) ---", "", "", "", "", ""],
          ["Tarjeta", creditCardSummary.cardName, "", "", "", ""],
          ["Cupo Total Tarjeta", "", "", "", "", creditCardSummary.totalLimit],
          ["Cupo Utilizado (Deuda Actual)", "", "", "", "", creditCardSummary.usedAmount],
          ["CUPO DISPONIBLE ACTUAL", "", "", "", "", creditCardSummary.availableCredit],
          ["Día de Pago Mensual", `Día ${creditCardSummary.paymentDay}`, "Próximo Vencimiento:", creditCardSummary.nextPaymentFormatted, `Faltan ${creditCardSummary.daysUntilPayment} días`, ""]
        ];
        exportToGoogleSheetsCSV(`Finanzas_Personales_${periodLabel.replace(/\s+/g, '_')}_${today}.csv`, rows);
      };

      const handleExportInventory = () => {
        const today = new Date().toISOString().slice(0, 10);
        const rows = [
          ["CATÁLOGO DE PRODUCTOS E INVENTARIO", "", "", "", "", ""],
          ["Fecha de Exportación:", today, "", "", "", ""],
          [""],
          ["Nombre", "Categoría", "SKU", "Costo ($)", "Precio Venta ($)", "Stock Total", "Stock Mínimo"],
          ...products.map(p => [
            p.name,
            p.category,
            p.sku,
            canViewCosts ? p.costPrice : "Restringido",
            p.salePrice,
            getProductTotalStock(p),
            p.minStock
          ])
        ];
        exportToGoogleSheetsCSV(`Inventario_${today}.csv`, rows);
      };

      const navItemsList = [
        { id: "dashboard", label: "Panel General", shortLabel: "Panel", icon: "layout-dashboard", show: true },
        { id: "personal", label: "Espacio Personal", shortLabel: "Personal", icon: "wallet", iconColor: "#C084FC", badgePurple: "Mío", show: canAccessPersonal },
        { id: "inventario", label: "Inventario", shortLabel: "Inventario", icon: "package", badge: lowStock.length > 0 ? lowStock.length : null, show: true },
        { id: "bodegas", label: "Bodegas & Traspaso", shortLabel: "Bodegas", icon: "warehouse", show: canAccessWarehouses },
        { id: "ventas", label: "Ventas & Caja", shortLabel: "Ventas", icon: "shopping-cart", show: canAccessSales },
        { id: "clientes", label: "Clientes", shortLabel: "Clientes", icon: "users-round", show: canAccessCustomers },
        { id: "gastos", label: "Gastos Negocio", shortLabel: "Gastos", icon: "receipt", show: canAccessFinances },
        { id: "usuarios", label: "Equipo & Roles", shortLabel: "Equipo", icon: "shield-check", show: role === "Administrador" }
      ].filter(x => x.show);

      return (
        <div style={{ ...styles.appContainer, ...(isMobile ? styles.appContainerMobile : {}) }}>
          {toast && (
            <div style={{
              position: "fixed", bottom: isMobile ? 84 : 22, right: isMobile ? 14 : 24, left: isMobile ? 14 : "auto", zIndex: 999,
              background: toast.type === "warn" ? "rgba(217, 119, 6, 0.95)" : "rgba(12, 79, 28, 0.95)",
              border: "1px solid rgba(255,255,255,0.25)", color: "#FFF", padding: "10px 16px",
              borderRadius: 12, fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 8,
              boxShadow: "0 12px 30px rgba(0,0,0,0.45)", backdropFilter: "blur(12px)"
            }}>
              <Icon name={toast.type === "warn" ? "alert-circle" : "check-circle-2"} size={15} color="#FFF" />
              <span>{toast.msg}</span>
            </div>
          )}

          {isMobile ? (
            <header className="mobile-top-bar" style={styles.mobileTopBar}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <img
                  src="logo.png"
                  alt="Logo Almacén"
                  onError={(e) => { e.target.style.display = "none"; }}
                  style={{ width: 30, height: 30, objectFit: "contain" }}
                />
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14, color: "#F8FAFC", lineHeight: 1.1 }}>Almacén PRO</div>
                  <div style={{ fontSize: 10, color: role === "Personal" ? "#C084FC" : "#34D399", fontWeight: 600 }}>
                    {currentUser.name} • {currentUser.role}
                  </div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                {isSupabaseConfigured && (
                  <button
                    onClick={() => setSyncModalOpen(true)}
                    style={{
                      ...styles.themeToggleBtn,
                      borderColor: syncStatus.state === "error" ? "rgba(248,113,113,0.45)" : syncStatus.state === "warn" ? "rgba(251,191,36,0.45)" : "rgba(52,211,153,0.35)",
                      gap: 5,
                      padding: "6px 9px"
                    }}
                    title="Centro de Sincronización en la Nube"
                  >
                    <Icon
                      name={isSyncing ? "refresh-cw" : "cloud"}
                      size={14}
                      color={syncStatus.state === "error" ? "#F87171" : syncStatus.state === "warn" ? "#FBBF24" : "#34D399"}
                    />
                    <span style={{ fontSize: 10.5, fontWeight: 700, color: "#E2E8F0" }}>
                      {isSyncing ? "Sync..." : "Nube"}
                    </span>
                  </button>
                )}
                <button
                  onClick={() => setWarehouseTheme(prev => prev === "warm" ? "cool" : "warm")}
                  style={styles.themeToggleBtn}
                  title="Cambiar ambiente visual"
                >
                  <Icon name={warehouseTheme === "warm" ? "flame" : "sparkles"} size={14} color={warehouseTheme === "warm" ? "#FBBF24" : "#38BDF8"} />
                </button>
                <button style={{ ...styles.themeToggleBtn, borderColor: "rgba(248, 113, 113, 0.3)" }} onClick={handleLogout} title="Cerrar sesión">
                  <Icon name="log-out" size={14} color="#F87171" />
                </button>
              </div>
            </header>
          ) : (
            <aside style={styles.sidebar}>
              <div style={styles.brand}>
                <img
                  src="logo.png"
                  alt="Logo Almacén"
                  onError={(e) => { e.target.style.display = "none"; }}
                  style={{ width: 36, height: 36, objectFit: "contain" }}
                />
                <div style={{ flex: 1, cursor: "pointer" }} onClick={() => setSyncModalOpen(true)} title="Abrir Centro de Sincronización">
                  <div style={styles.brandTitle}>Almacén</div>
                  <div style={{ ...styles.brandSub, color: syncStatus.state === "error" ? "#FCA5A5" : syncStatus.state === "warn" ? "#FCD34D" : "#6EE7B7" }}>
                    {!isSupabaseConfigured
                      ? "💾 Modo Local"
                      : isSyncing
                      ? "🔄 Sincronizando..."
                      : syncStatus.state === "error"
                      ? "⚠️ Revisar Nube (Clic)"
                      : `☁️ Nube Activa ${syncStatus.lastSync ? "• " + syncStatus.lastSync : ""}`}
                  </div>
                </div>
                <button
                  onClick={() => setWarehouseTheme(prev => prev === "warm" ? "cool" : "warm")}
                  style={styles.themeToggleBtn}
                  title="Cambiar ambiente visual del almacén"
                >
                  <Icon name={warehouseTheme === "warm" ? "flame" : "sparkles"} size={14} color={warehouseTheme === "warm" ? "#FBBF24" : "#38BDF8"} />
                </button>
              </div>

              <div style={styles.userCard}>
                <div style={styles.userAvatar}>
                  {(currentUser.name || "US").slice(0, 2).toUpperCase()}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={styles.userName}>{currentUser.name}</div>
                  <span style={{ ...styles.roleBadge, color: role === "Personal" ? "#C084FC" : "#34D399" }}>
                    {currentUser.role}
                  </span>
                </div>
                <button style={styles.logoutBtn} onClick={handleLogout} title="Cerrar sesión">
                  <Icon name="log-out" size={14} color="#F87171" />
                </button>
              </div>

              <nav style={styles.nav}>
                {navItemsList.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    style={{ ...styles.navItem, ...(tab === item.id ? styles.navItemActive : {}) }}
                  >
                    <Icon name={item.icon} size={16} color={item.iconColor || "currentColor"} />
                    <span>{item.label}</span>
                    {item.badgePurple && <span style={styles.navBadgePurple}>{item.badgePurple}</span>}
                    {item.badge && <span style={styles.navBadge}>{item.badge}</span>}
                  </button>
                ))}
              </nav>

              {isSupabaseConfigured && (
                <button
                  onClick={() => setSyncModalOpen(true)}
                  style={{
                    background: "rgba(52, 211, 153, 0.1)",
                    border: "1px solid rgba(52, 211, 153, 0.3)",
                    color: "#6EE7B7",
                    borderRadius: 10,
                    padding: "8px 10px",
                    fontSize: 11.5,
                    fontWeight: 600,
                    cursor: "pointer",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    gap: 6,
                    marginBottom: 10
                  }}
                >
                  <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <Icon name="cloud" size={14} color="#34D399" />
                    <span>Sincronizar Dispositivos</span>
                  </span>
                  <Icon name="chevron-right" size={13} color="#6EE7B7" />
                </button>
              )}

              <div style={styles.footerStatus}>
                <span style={{
                  ...styles.statusDot,
                  background: syncStatus.state === "error" ? "#EF4444" : syncStatus.state === "warn" ? "#F59E0B" : "#34D399",
                  boxShadow: `0 0 8px ${syncStatus.state === "error" ? "#EF4444" : syncStatus.state === "warn" ? "#F59E0B" : "#34D399"}`
                }}></span>
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {isSyncing ? "Sincronizando nube..." : currentUser.email}
                </span>
                {isSupabaseConfigured && (
                  <button onClick={() => fetchDataFromSupabase(false, false)} style={{ background: "none", border: "none", cursor: "pointer", marginLeft: "auto", color: "#94A3B8" }} title="Sincronizar ahora">
                    <Icon name="refresh-cw" size={12} />
                  </button>
                )}
              </div>
            </aside>
          )}

          <main style={{ ...styles.main, ...(isMobile ? styles.mainMobile : {}) }}>
            {syncStatus.state === "error" && (
              <div style={{
                display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap",
                background: "rgba(239, 68, 68, 0.14)", border: "1px solid rgba(248, 113, 113, 0.4)",
                borderRadius: 12, padding: "10px 14px", marginBottom: 16, fontSize: 12.5, color: "#FECACA"
              }}>
                <span>⚠️ <strong>Sincronización en Nube bloqueada o incompleta:</strong> {syncStatus.error}</span>
                <button style={styles.smallGlassBtn} onClick={() => setSyncModalOpen(true)}>
                  Reparar / Sincronizar Ahora
                </button>
              </div>
            )}

            {tab === "dashboard" && (
              <Dashboard
                currentUser={currentUser}
                canAccessSales={canAccessSales}
                canAccessPersonal={canAccessPersonal}
                canViewCosts={canViewCosts}
                sales={sales}
                expenses={expenses}
                products={products}
                lowStock={lowStock}
                locations={locations}
                customers={customers}
                totalSales={totalSales}
                totalExpenses={totalExpenses}
                profit={profit}
                personalFinances={personalFinances}
                personalIncome={personalIncome}
                personalExpense={personalExpense}
                personalBalance={personalBalance}
                personalCashBalance={personalCashBalance}
                personalCardBalance={personalCardBalance}
                creditCardSummary={creditCardSummary}
                onOpenCreditCardConfig={() => setCreditCardModalOpen(true)}
                onNewSale={() => setSaleModalState("new")}
                onNewPersonal={(preset) => setPersonalModalState(preset ? { isPreset: true, ...preset } : "new")}
                onGoToPersonal={() => setTab("personal")}
                onGoToInventory={() => setTab("inventario")}
                onExportBusiness={handleExportBusinessFinances}
                onExportPersonal={() => handleExportPersonalFinances(personalFinances, "Historial Completo", personalIncome, personalExpense, personalBalance, personalCashBalance, personalCardBalance)}
              />
            )}

            {tab === "personal" && canAccessPersonal && (
              <PersonalFinancesManager
                personalFinances={personalFinances}
                creditCardSummary={creditCardSummary}
                onOpenCreditCardConfig={() => setCreditCardModalOpen(true)}
                onNew={(preset) => setPersonalModalState(preset ? { isPreset: true, ...preset } : "new")}
                onEdit={(item) => setPersonalModalState(item)}
                onDelete={handleDeletePersonalFinance}
                onExport={handleExportPersonalFinances}
              />
            )}

            {tab === "inventario" && (
              <div>
                <div style={styles.pageHeader}>
                  <div>
                    <div style={styles.eyebrow}>INVENTARIO & CATÁLOGO DE ALMACÉN</div>
                    <h2 style={styles.pageTitle}>Fichas de Productos y Existencias</h2>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <button style={styles.sheetsExportBtn} onClick={handleExportInventory} title="Exportar catálogo a Google Sheets">
                      <Icon name="file-spreadsheet" size={14} color="#34D399" /> Exportar Sheets
                    </button>
                    {canManageInventory && (
                      <button style={styles.primaryBtn} onClick={() => setProductModalState("new")}>
                        <Icon name="plus" size={14} /> Agregar Producto
                      </button>
                    )}
                  </div>
                </div>

                {/* Buscador rápido de Almacén por Nombre, SKU o Código de Barras */}
                <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
                  <div style={{ flex: 1, minWidth: 230 }}>
                    <input
                      style={styles.glassInput}
                      placeholder="🔍 Buscar en estantería por nombre, SKU o Código de Barras..."
                      value={inventorySearch}
                      onChange={e => setInventorySearch(e.target.value)}
                    />
                  </div>
                  <select
                    style={styles.filterSelect}
                    value={inventoryCategoryFilter}
                    onChange={e => setInventoryCategoryFilter(e.target.value)}
                  >
                    <option value="Todas">📦 Todas las categorías</option>
                    {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                {filteredInventory.length === 0 ? (
                  <div style={styles.panel}>
                    <p style={{ textAlign: "center", color: "#64748B", margin: 20 }}>
                      No hay productos que coincidan con la búsqueda.
                    </p>
                  </div>
                ) : (
                  <div style={styles.tagGrid}>
                    {filteredInventory.map(p => (
                      <div key={p.id} style={styles.productGlassCard}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <span style={styles.categoryBadge}>{p.category}</span>
                          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            {getProductTotalStock(p) <= p.minStock && (
                              <span style={styles.stockLowBadge}>Stock Crítico</span>
                            )}
                            {canManageInventory && (
                              <>
                                <button style={styles.actionIconBtn} onClick={() => setProductModalState(p)} title="Modificar Producto">
                                  <Icon name="pencil" size={13} color="#38BDF8" />
                                </button>
                                <button style={styles.actionIconBtn} onClick={() => handleDeleteProduct(p.id)} title="Eliminar Producto">
                                  <Icon name="trash-2" size={13} color="#F87171" />
                                </button>
                              </>
                            )}
                          </div>
                        </div>

                        <div style={{ fontSize: 16, fontWeight: 700, margin: "10px 0 2px", color: "#F8FAFC" }}>{p.name}</div>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#94A3B8", fontFamily: "monospace" }}>
                          <span>SKU: {p.sku || "-"}</span>
                          {p.barcode && <span>EAN: {p.barcode}</span>}
                        </div>
                        <div style={styles.cardDivider}></div>

                        <div style={styles.tagRow}>
                          <span>Precio Venta:</span>
                          <strong style={{ color: "#34D399" }}>{money(p.salePrice)}</strong>
                        </div>
                        {canViewCosts && (
                          <div style={styles.tagRow}>
                            <span>Costo Unitario:</span>
                            <span>{money(p.costPrice)}</span>
                          </div>
                        )}
